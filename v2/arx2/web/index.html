<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Bridge</title>
<link rel="stylesheet" href="/static/app.css">
<script>try { const t = localStorage.getItem("arx2.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header id="top">
  <a class="brand" href="#/">arx</a>
  <nav id="crumbs"></nav>
  <div id="clock"></div>
  <button id="theme" onclick="cycleTheme()"></button>
  <button id="askbtn" onclick="askToggle()" title="Ask about anything (A)">Ask</button>
</header>
<div id="replay" hidden></div>
<main id="app"></main>
<div id="hovercard" hidden></div>
<div id="pins"></div>
<div id="askbox" hidden></div>
<button id="askpick" hidden>Ask</button>
<script src="/static/ui.js"></script>
<script src="/static/pages.js"></script>
<script src="/static/ask.js"></script>
</body>
</html>
