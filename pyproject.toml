[project]
name = "autoresearch"
version = "0.1.0"
description = "Research infrastructure for AI agents that improve models: gate ladder, ledger, live dashboard"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arx = "autoresearch.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autoresearch"]

[tool.setuptools.package-data]
autoresearch = ["dashboard.html", "paper.html", "ui.css", "templates/*"]
