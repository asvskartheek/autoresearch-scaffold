<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>arx · discuss</title>
<!-- data-proto: story frames, questions, agent runs, collaborators and their comments are derived from the real
     gsm8k-ft ledger (state, hill percent-base per-id runs, GRPO v2 metrics). Every number in an answer is computed
     in the page from that data; only the agent's step timings and the people are simulated. -->
<style>
:root{
 --ground:#f2f5f8;--surface:#fff;--raised:#f5f7f9;--active:#e4e9ee;--border:#e3e7eb;--rule:#eef1f4;--control:#cdd3d9;
 --text:#131416;--muted:#5b6168;--faint:#6f767d;
 --accent:#1b6c80;--accent-soft:#e3f0f3;--primary:#16181a;--on-primary:#fff;
 --positive:#1e7b4f;--negative:#c4242a;--warning:#92400e;
 --chart-1:#1b6c80;--chart-2:#2f70bb;--chart-3:#a86f0c;--grid:#e9edf0;
 --pill-positive-bg:#dcfae5;--pill-positive-ink:#04250e;--pill-negative-bg:#ffedea;--pill-negative-ink:#831c1e;
 --pill-neutral-bg:#ebeef1;--pill-neutral-ink:#353736;--pill-accent-bg:#ddeef2;--pill-accent-ink:#0f4a59;
 --radius-card:8px;--radius-control:6px;--radius-chip:4px;--radius-sheet:16px;
 --font:"IBM Plex Sans",Inter,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 --p-mira:#a86f0c;--p-dev:#2f70bb;--p-you:#1b6c80;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root{
 --ground:#0c0f12;--surface:#13171b;--raised:#1a1f24;--active:#232a31;--border:#232a30;--rule:#1c2227;--control:#3a434b;
 --text:#eef1f3;--muted:#a3abb3;--faint:#8c959d;--accent:#5cb8cc;--accent-soft:#163038;--primary:#eef1f3;--on-primary:#0c0f12;
 --positive:#4cc38a;--negative:#f07575;--warning:#e3a84f;--chart-1:#5cb8cc;--chart-2:#6aa1e6;--chart-3:#d9a441;--grid:#222930;
 --pill-positive-bg:#14291e;--pill-positive-ink:#6fd6a1;--pill-negative-bg:#2e1a1d;--pill-negative-ink:#f59a9a;
 --pill-neutral-bg:#222930;--pill-neutral-ink:#c3cad1;--pill-accent-bg:#14303a;--pill-accent-ink:#8fd3e2;
 --p-mira:#d9a441;--p-dev:#6aa1e6;--p-you:#5cb8cc;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--text);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;background:var(--ground)}
.crumbs{display:flex;gap:8px;color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{color:var(--control)}
.right{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.faces{display:flex}
.face{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;border:2px solid var(--ground);margin-left:-6px;position:relative}
.face:first-child{margin-left:0}
.face[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:32px;right:0;white-space:nowrap;background:var(--primary);color:var(--on-primary);font-weight:500;padding:3px 8px;border-radius:4px;font-size:12px}
.agents{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.agents b{color:var(--text);font-weight:500}
.spin{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:r .8s linear infinite;flex:none}
.idle{width:8px;height:8px;border-radius:50%;background:var(--control);flex:none}
@keyframes r{to{transform:rotate(360deg)}}
.btn{height:32px;padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--control);background:var(--surface);font-weight:500}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

.sheet{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sheet);margin:0 8px 8px;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:calc(100vh - 60px)}
.story{padding:28px 32px 80px;min-width:0;border-right:1px solid var(--rule)}
.story h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 24px;max-width:720px}
.frame{max-width:720px;margin:0 0 40px;position:relative}
.frame .n{position:absolute;left:-22px;top:2px;font:500 12px var(--mono);color:var(--faint)}
.fig{position:relative;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);padding:12px;user-select:none;-webkit-user-select:none}
.fig svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.fig .askfig{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-weight:600;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.frame:hover .askfig,.askfig:focus-visible{opacity:1}
@media (hover:none){.fig .askfig{opacity:1}}
.here{position:absolute;top:-10px;right:40px;display:flex;gap:4px}
.here .face{width:20px;height:20px;font-size:9px;border-width:2px;border-color:var(--surface);margin:0;transition:all .4s}
.cap{margin:12px 2px 0;font-size:16px;line-height:1.5;max-width:640px}
.cap .num{all:unset;cursor:pointer;font-weight:600;border-bottom:1.5px dotted var(--accent)}
.cap .num:hover{background:var(--accent-soft)}
svg text{font-family:var(--font);fill:var(--muted);font-size:11px}
svg .lab{fill:var(--text);font-size:12px}
svg .mono{font-family:var(--mono);font-size:10.5px}
svg .hit{cursor:pointer}
svg .hit:hover{opacity:.75}
svg .sel{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 2;pointer-events:none}
svg .picked{stroke:var(--text);stroke-width:2}
.pin circle{fill:var(--primary)}
.pin text{fill:var(--on-primary);font-size:10px;font-weight:600;text-anchor:middle}
.pin{cursor:pointer}
.pin.flash circle{animation:fl .9s ease 2}
@keyframes fl{50%{r:13}}

/* thread rail */
.rail{padding:20px 16px 80px;background:var(--surface);border-radius:0 var(--radius-sheet) var(--radius-sheet) 0;min-width:0}
.rail .head{display:flex;align-items:baseline;gap:8px;margin:0 4px 14px;font-weight:600;font-size:16px}
.rail .head span{font-weight:400;color:var(--muted);font-size:13px}
.empty{color:var(--faint);margin:40px 4px;text-align:center}
.th{border:1px solid var(--border);border-radius:var(--radius-card);margin-bottom:12px;background:var(--surface)}
.th.enter{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.th.new{border-color:var(--accent)}
.anch{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted);cursor:pointer;border-radius:var(--radius-card) var(--radius-card) 0 0}
.anch:hover{background:var(--raised)}
.anch .pinb{width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.anch .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{padding:10px 12px;display:flex;gap:10px}
.msg+.msg{border-top:1px solid var(--rule)}
.msg .face{margin:0;width:24px;height:24px;font-size:10px;border:0;flex:none}
.msg .bot{width:24px;height:24px;border-radius:6px;background:var(--active);color:var(--text);display:grid;place-items:center;font:600 10px var(--mono);flex:none}
.msg .body{min-width:0;flex:1}
.msg .who{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg .who b{color:var(--text);font-weight:500}
.msg .who .t{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.msg .txt{margin-top:2px;overflow-wrap:anywhere}
.steps{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:8px;min-height:20px}
.steps li .ok{width:10px;color:var(--positive);flex:none;text-align:center;font-size:11px}
.steps li.wait{color:var(--faint)}
.steps li.wait .ok::before{content:"";display:block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--control)}
.steps.fold li:not(:last-child){display:none}
.steps .tog{all:unset;cursor:pointer;color:var(--faint);font-size:12px}
.ans{margin-top:8px}
.ans .cursor{display:inline-block;width:6px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:1px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.mini{margin-top:8px;border:1px solid var(--rule);border-radius:6px;padding:8px;background:var(--raised)}
.mini.enter{animation:in .35s ease}
.mini svg{display:block;width:100%;height:auto}
.queued{font-size:12.5px;color:var(--faint);margin-top:4px}
.reply{display:flex;gap:6px;padding:8px 12px 10px;border-top:1px solid var(--rule)}
.reply input{flex:1;min-width:0;height:30px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--surface);padding:0 10px;font:inherit;color:inherit}

/* ask popover */
.pop{position:absolute;z-index:40;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--control);border-radius:var(--radius-card);box-shadow:0 8px 28px rgba(0,0,0,.14);padding:10px}
.pop .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--raised);border-radius:var(--radius-chip);padding:2px 8px;margin-bottom:8px;max-width:100%}
.pop .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop textarea{width:100%;height:58px;resize:none;border:1px solid var(--border);border-radius:var(--radius-control);padding:8px;font:inherit;color:inherit;background:var(--surface)}
.pop .sugg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pop .sugg button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;text-align:left}
.pop .sugg button:hover{border-color:var(--accent);color:var(--accent)}
.pop .row{display:flex;justify-content:flex-end;gap:8px}

/* share dialog */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.38);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(460px,100%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.dlg h2{margin:0 0 16px;font-size:16px;font-weight:600}
.dlg .link{display:flex;gap:8px}
.dlg .link input{flex:1;min-width:0;height:32px;border:1px solid var(--border);border-radius:var(--radius-control);padding:0 10px;font:12.5px var(--mono);color:var(--text);background:var(--raised)}
.dlg select,.dlg .inv input{height:32px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--surface);color:var(--text);font:inherit;padding:0 8px}
.dlg .line{display:flex;align-items:center;gap:10px;margin-top:12px}
.dlg .line .grow{flex:1;min-width:0}
.dlg .inv{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.dlg .inv input{flex:1 1 160px;min-width:0}
.dlg .ppl{margin-top:10px}
.dlg .ppl .line .face{margin:0;border:0}
.dlg .ppl .sub{color:var(--faint);font-size:12px}
.dlg .foot{display:flex;justify-content:flex-end;margin-top:20px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60;animation:in .2s ease}
.jump{display:none}

@media (max-width:900px){
 .sheet{grid-template-columns:1fr}
 .story{border-right:0;padding:20px 16px 24px}
 .frame .n{position:static;display:block;margin-bottom:6px}
 .rail{border-top:1px solid var(--rule);border-radius:0 0 var(--radius-sheet) var(--radius-sheet);padding:16px 12px 90px}
 .jump{display:flex;position:fixed;bottom:16px;right:16px;z-index:30;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:var(--primary);color:var(--on-primary);border:0;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.18)}
 .jump .spin{border-color:var(--on-primary);border-right-color:transparent}
}
@media (max-width:520px){
 .top{padding:0 10px;gap:8px}
 .crumbs .p{display:none}
 .agents .lbl{display:none}
 .sheet{margin:0 0 8px;border-radius:12px}
 .cap{font-size:15px}
 .fig{padding:8px}
 .pop{position:fixed;left:8px!important;right:8px;bottom:8px;top:auto!important;width:auto;max-width:none}
}
</style>
</head>
<body>
<header class="top">
 <div class="crumbs"><span class="p">gsm8k-ft</span><span class="sep p">/</span><b>Turning the adapter off</b></div>
 <div class="right">
  <div class="agents" id="agents"><span class="idle"></span><span class="lbl">agents</span><b>0</b></div>
  <div class="faces" id="faces"></div>
  <button class="btn primary" id="share">Share</button>
 </div>
</header>
<div class="sheet">
 <section class="story" id="story"><h1>Turning the adapter off</h1></section>
 <aside class="rail" id="rail"><div class="head">Questions <span id="tcount"></span></div><div id="threads"><div class="empty">Drag across a figure, click a point, or select a caption.</div></div></aside>
</div>
<button class="jump" id="jump"></button>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n.toLocaleString("en-US");
const short = m => m.replace(/-v(\d)$/, " v$1");
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const CAP = 4;  // agents allowed to run at once; the rest queue (the real daemon's --max-agents)

let S, H, T;       // state, hill percent-base, GRPO v2 task
let CH, BASE, DEV, CTL, IDS, CIDS, FULL, GOAL, REWARD;
const PEOPLE = {
  you: {n: "You", i: "KA", c: "var(--p-you)"},
  mira: {n: "Mira", i: "MI", c: "var(--p-mira)"},
  dev: {n: "Dev", i: "DV", c: "var(--p-dev)"},
};
const SHARED = [{p: "mira", role: "comment"}, {p: "dev", role: "comment"}];
let linkAccess = "comment";

/* ---------------- data ---------------- */
async function load() {
  const j = u => fetch(u).then(r => r.json());
  [S, H, T] = await Promise.all([j("../data/gsm8k-ft-state.json"), j("../data/hill-percent-base.json"),
    j("../data/tasks/1026-015519-train-2f1c.json")]);
  CH = S.champion;
  GOAL = S.goals["gsm8k-96"];
  BASE = GOAL.baseline;
  DEV = H.target.runs; CTL = H.control.runs; IDS = H.target.ids; CIDS = H.control.ids;
  FULL = S.leaderboard["gsm8k-test/full"];
  REWARD = T.metrics.filter(m => m.reward != null).map(m => ({s: m.step, r: m.reward, kl: m.kl, len: m["completions/mean_length"]}));
}
// per-id scores are means over repeat runs (the champion has 13), so "right" = right in most runs
const ok = v => (v || 0) >= .5;
// counts come from the ledger's latest run when it has one (what arx reports), else from the per-id means
const solved = (runs, m, ids) => {
  const lb = S.leaderboard[runs === DEV ? H.target.slice : runs === CTL ? H.control.slice : ""], r = lb && lb[m];
  return r ? Math.round(r.score * r.n) : Math.round(ids.reduce((a, i) => a + (runs[m] ? runs[m][i] || 0 : 0), 0));
};
function paired(a, b, runs = DEV, ids = IDS) {
  let f = 0, br = 0, s = 0, ss = 0; const fix = [], brk = [];
  for (const i of ids) {
    const d = (runs[a][i] || 0) - (runs[b][i] || 0); s += d; ss += d * d;
    const A = ok(runs[a][i]), B = ok(runs[b][i]);
    if (A && !B) { f++; fix.push(i); } if (!A && B) { br++; brk.push(i); }
  }
  const n = ids.length, mean = s / n, sd = Math.sqrt(Math.max(0, ss / n - mean * mean)), h = 1.645 * sd / Math.sqrt(n);
  return {n, f, b: br, fix, brk, delta: mean, lo: mean - h, hi: mean + h, a: solved(runs, a, ids), bb: solved(runs, b, ids)};
}
const pts = x => (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(1);
const modelsOnDev = () => Object.keys(DEV).sort((a, b) => solved(DEV, b, IDS) - solved(DEV, a, IDS));
const status = m => (S.models[m] || {}).status || "?";
const firstSentence = s => { const t = (s || "").split(/(?<=\.)\s/)[0]; const w = t.split(/\s+/); return w.length > 14 ? w.slice(0, 14).join(" ") + "…" : t; };

/* ---------------- svg helpers ---------------- */
function svg(w, h, inner) { return `<svg viewBox="0 0 ${w} ${h}" xmlns="${NS}">${inner}</svg>`; }
const line = (x1, y1, x2, y2, st, extra = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${st}" ${extra}/>`;
const txt = (x, y, s, extra = "") => `<text x="${x}" y="${y}" ${extra}>${esc(s)}</text>`;
const hitA = (kind, ref, label) => `class="hit" data-kind="${kind}" data-ref="${esc(ref)}" data-label="${esc(label)}"`;
function ema(v, a = .12) { let e = v[0]; return v.map(x => (e = a * x + (1 - a) * e)); }
function pathOf(xs, ys) { return xs.map((x, i) => (i ? "L" : "M") + x.toFixed(1) + " " + ys[i].toFixed(1)).join(""); }

/* ---------------- frames ---------------- */
function frames() {
  const N = GOAL.n, target = Math.ceil(GOAL.target * N);
  const champN = Math.round(FULL[CH].score * N), baseN = Math.round(FULL[BASE].score * N);
  const archN = Math.round(FULL["qwen3-4b-rl-archived"].score * N);
  const tried = modelsOnDev().filter(m => !["qwen3-4b-rl-archived", BASE].includes(m));
  const pc = paired(CH, BASE);
  const rl = paired("percent-rlvr-v2", BASE);
  const r0 = REWARD.slice(0, 20).reduce((a, b) => a + b.r, 0) / 20, r1 = REWARD.slice(-20).reduce((a, b) => a + b.r, 0) / 20;
  const num = (v, kind, ref, label) => `<button class="num" data-kind="${kind}" data-ref="${esc(ref)}" data-label="${esc(label)}">${v}</button>`;
  return [
    {fig: figGoal(N, target, [["qwen3-4b-rl-archived", archN], [BASE, baseN], [CH, champN]]),
     cap: `The champion solves ${num(fmt(champN), "bar", CH, "champion on full")} of ${fmt(N)}. The goal needs ${fmt(target)}: ${num(target - champN, "gap", "gap", "the gap to goal")} more.`},
    {fig: figDots(),
     cap: `${num(tried.length, "dots", "all", "all changes on percent slice")} changes were tried on ${IDS.length} percentage problems. One passed the gate: the adapter switched off.`},
    {fig: figGrid(pc),
     cap: `Switching the adapter off and allowing 1,024 tokens fixed ${num(pc.f, "cells", "fixed", "fixed problems")} problems and broke ${num(pc.b, "cells", "broke", "broken problems")}.`},
    {fig: figCurve(),
     cap: `RL reward rose from ${num(r0.toFixed(2), "steps", "1-20", "steps 1–20")} to ${r1.toFixed(2)} over ${REWARD.length} steps. The percentage slice moved ${num(rl.a - rl.bb, "rl", "rl", "RL v2 on the percent slice")} problems.`},
  ];
}

function figGoal(N, target, rows) {
  const W = 640, Hh = 200, x0 = 150, x1 = 620, lo = 1100, hi = N;
  const X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);
  let g = "";
  for (let t = 1100; t <= 1300; t += 50) g += line(X(t), 14, X(t), 150, "var(--grid)") + txt(X(t), 166, fmt(t), 'text-anchor="middle"');
  g += txt(x0, 182, "solved, axis from 1,100", 'font-size="10"');
  rows.forEach(([m, v], i) => {
    const y = 24 + i * 40, c = m === CH ? "var(--accent)" : "var(--control)";
    g += txt(x0 - 10, y + 15, short(m).replace("qwen3-4b-rl-", "qwen rl "), 'text-anchor="end" class="mono"');
    g += `<rect x="${x0}" y="${y}" width="${X(v) - x0}" height="22" rx="3" fill="${c}" ${hitA("bar", m, short(m) + " on full")}/>`;
    g += txt(X(v) + 6, y + 15, fmt(v), 'class="lab"');
  });
  g += line(X(target), 8, X(target), 150, "var(--text)", 'stroke-dasharray="4 3"') + txt(X(target), 4, `goal ${fmt(target)}`, 'text-anchor="middle" class="lab"');
  const cy = 24 + 2 * 40 + 11, cv = rows[2][1];
  g += `<g ${hitA("gap", "gap", "the gap to goal")}><rect x="${X(cv) + 40}" y="${cy - 10}" width="${X(target) - X(cv) - 40}" height="20" fill="transparent"/>` +

/* ---------------- threads + agents ---------------- */
const threads = []; let agentNo = 0; const queue = []; let running = 0;
function ask(who, anchor, q, pt) {

  threads.unshift(th);

}
function addPin(th) {

  p.innerHTML = `<circle cx="${pt.x}" cy="${pt.y - 14}" r="9"/><text x="${pt.x}" y="${pt.y - 10.5}">${th.id}</text>`;
  p.addEventListener("click", e => { e.stopPropagation(); const c = document.getElementById("th" + th.id); c.scrollIntoView({behavior: "smooth", block: "center"}); c.classList.add("new"); setTimeout(() => c.classList.remove("new"), 1500); });

  const iv = setInterval(() => {
    m.out = words.slice(0, ++i).join(" "); renderMsg(th, m);
    if (i >= words.length) { clearInterval(iv); m.state = "done"; m.t1 = Date.now(); running--; m.fresh = true; renderMsg(th, m); m.fresh = false; pump(); }
  }, rnd(35, 70));
}

}

function ago(t) { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + "s" : Math.round(s / 60) + "m"; }

/* ---------------- the answering: real computations on the ledger ---------------- */
function answer(a, q, th) {

  const wantCtl = /control|cost|hurt|regress/.test(ql), wantNoise = /noise|real|ci\b|sure|significant|luck/.test(ql);
  const S0 = `read story frame ${a.frame + 1}`;
  const k = a.kind;
  if (wantCtl && a.frame === 2) return ansModel(S0, CH, true, true, ql);
  if (k === "bar" || (k === "frame" && a.frame === 0) || (k === "text" && a.frame === 0 && !/goal|43|gap/.test(a.ref))) return ansClimb(S0, wantCtl);
  if (k === "gap" || (a.frame === 0)) return ansGap(S0);
  if (k === "dot") return ansModel(S0, a.ref, wantCtl, wantNoise, ql);
  if (k === "dots") return ansModels(S0, Array.isArray(a.ref) ? a.ref : modelsOnDev(), wantCtl);
  if (k === "cell") return ansCell(S0, a.ref, ql);
  if (k === "cells") {
    const pc = paired(CH, BASE), ids = Array.isArray(a.ref) ? a.ref : (a.ref === "broke" ? pc.brk : pc.fix);
    const which = ids.every(i => pc.brk.includes(i)) ? "broke" : ids.every(i => pc.fix.includes(i)) ? "fixed" : "mixed";
    return ansCells(S0, ids, which, wantNoise);
  }
  if (a.frame === 1) return ansModels(S0, modelsOnDev(), true);
  if (a.frame === 2) return wantCtl ? ansModel(S0, CH, true, true, ql) : ansCells(S0, IDS, "all", true);
  if (k === "steps") return ansSteps(S0, a.ref, ql);
  return ansRL(S0, wantNoise);

  setInterval(() => { const p = pick(["mira", "dev"]); presence[p] = Math.floor(Math.random() * FR.length); renderFaces(); }, 9000);

function share() {
  const sc = document.createElement("div"); sc.className = "scrim";
  const draw = () => {
    sc.innerHTML = `<div class="dlg" role="dialog" aria-label="Share"><h2>Share “Turning the adapter off”</h2>
      <div class="link"><input readonly value="https://arx.example/s/gsm8k-ft/adapter-off-k3f9"><button class="btn" data-copy>Copy</button></div>
      <div class="line"><span class="grow">Anyone with the link</span><select data-link>
        <option value="off" ${linkAccess === "off" ? "selected" : ""}>No access</option>
        <option value="view" ${linkAccess === "view" ? "selected" : ""}>Can view</option>
        <option value="comment" ${linkAccess === "comment" ? "selected" : ""}>Can comment</option></select></div>
      <div class="inv"><input list="names" placeholder="Invite by name" data-name><select data-role><option value="comment">Can comment</option><option value="view">Can view</option></select><button class="btn" data-inv>Invite</button></div>
      <datalist id="names"><option>Sam</option><option>Priya</option><option>Jonas</option></datalist>
      <div class="ppl"><div class="line">${face("you")}<span class="grow">You</span><span class="sub">owner</span></div>
        ${SHARED.map((s, i) => `<div class="line">${s.p in PEOPLE ? face(s.p) : `<span class="face" style="background:var(--faint)">${s.p.slice(0, 2).toUpperCase()}</span>`}<span class="grow">${esc(PEOPLE[s.p] ? PEOPLE[s.p].n : s.p)}${s.pending ? ' <span class="sub">invited</span>' : ""}</span>
          <select data-i="${i}"><option value="comment" ${s.role === "comment" ? "selected" : ""}>Can comment</option><option value="view" ${s.role === "view" ? "selected" : ""}>Can view</option><option value="x">Remove</option></select></div>`).join("")}</div>
      <div class="foot"><button class="btn primary" data-done>Done</button></div></div>`;
    $("[data-copy]", sc).onclick = e => { const i = $(".link input", sc); i.select(); try { navigator.clipboard.writeText(i.value); } catch (_) {} e.target.textContent = "Copied"; };
    $("[data-link]", sc).onchange = e => linkAccess = e.target.value;
    $("[data-inv]", sc).onclick = () => { const n = $("[data-name]", sc).value.trim(); if (!n) return; SHARED.push({p: n, role: $("[data-role]", sc).value, pending: true}); draw(); };
