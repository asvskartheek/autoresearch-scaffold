<!doctype html>

<title data-keep>Champion paper</title>
<!-- data-proto: a "reference paper" for a champion does not exist in arx yet.
     Real, read at runtime from ../data/ (state + hill json): every score, n, hash, run id, rule, threshold, latency,
     model change and rejection reason, hill symptom and example, decision time.
     Real but copied from task notes (strings, not structured fields): promotion-time CIs and fix/break counts on the
     target (1026-015459-eval-e6a9) and full (1026-023024-eval-5116), cap hits (7 / 34), token counts (369,446 vs 96,157),
     the 2.82x batch-seconds figure (audit 1026-031545-analysis-39e2).
     Derived: per-problem cells outside dev-percent-base-v1 and control-ordinary-v1 (full per-id rows are not exported,
     only counts), so the 1,034 "other" cells are placed by count only. Per-id cells on the two known slices use the
     mean over every champion run (>= 0.5 counts as right), so they need not match the single full run cell for cell.
     CIs computed in the page use a seeded paired bootstrap (2,000 resamples) like autoresearch/core.py:paired, with a
     different RNG, so they can differ from the ledger in the second decimal. -->

<script id="main" data-keep>
(async () => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = new Intl.NumberFormat("en-US");
const N0 = x => fmt.format(Math.round(x));
const pct = (x, d = 1) => x == null ? "—" : (x * 100).toFixed(d) + "%";
const pts = (x, d = 1) => x == null ? "—" : (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(d);
const sgn = (x, d = 1) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d);
const dt = t => { if (!t) return "—"; const d = new Date(t * 1000); return d.toLocaleString("en-US", { timeZone: "UTC", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }) + " UTC"; };
const short = (h, n = 10) => h ? String(h).slice(0, n) + "…" : "—";

/* ---------------- data ---------------- */
let D;
const snapEl = $("#snap");
const SNAP = !!snapEl.textContent.trim();
try {
  if (SNAP) D = JSON.parse(snapEl.textContent);
  else {
    const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u + " " + r.status); return r.json(); });
    const [s, hp, ht, hg] = await Promise.all(["../data/gsm8k-ft-state.json", "../data/hill-percent-base.json", "../data/hill-time-rate.json", "../data/hill-group-count.json"].map(get));
    D = reduce(s, hp, ht, hg);
  }
} catch (e) { $("#load").textContent = "could not load ledger: " + e.message; return; }

function reduce(s, hp, ht, hg) {
  const CH = s.champion, PV = s.models[CH].parent;
  const keepT = t => t.model === CH || t.model === PV || t.kind === "analysis" || t.kind === "benchmark";
  const pick = (h, m) => Object.fromEntries(h.ids.map(i => [i, h.runs[m]?.[i]]));

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const d = ids.map(i => c[i] - b[i]), n = d.length, r = rng(0), mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const boots = []; for (let k = 0; k < iters; k++) { let s = 0; for (let j = 0; j < n; j++) s += d[Math.floor(r() * n)]; boots.push(s / n); }
  boots.sort((x, y) => x - y);
  return { n, delta: mean(d), lo: boots[Math.floor(.05 * iters)], hi: boots[Math.floor(.95 * iters) - 1], wins: d.filter(x => x > 0).length, losses: d.filter(x => x < 0).length, cand: mean(ids.map(i => c[i])), base: mean(ids.map(i => b[i])) };
}

    const e = { label: r.sl, slice: r.sl, hash: SL[r.sl].hash, n: r.n, runs: r.ids.filter(Boolean), src: r.src, note: r.p?.lo != null ? `delta ${(r.p.delta * 100).toFixed(2)}, CI [${(r.p.lo * 100).toFixed(2)}, ${(r.p.hi * 100).toFixed(2)}]` : null };
    if (!r.p) return `<tr class="na"><td class="id">${esc(r.sl.replace("gsm8k-test/", ""))}</td><td class="n">${r.n}</td><td class="n">not run</td><td class="n">not run</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">0</td></tr>`;
    const k = v => (v * r.n).toFixed(Number.isInteger(+(v * r.n).toFixed(3)) ? 0 : 1);
    return `<tr><td class="id">${esc(r.sl.replace("gsm8k-test/", ""))}</td><td class="n">${r.n}</td><td class="n">${ev(k(r.ch), e)} <span class="faint">${pct(r.ch)}</span></td><td class="n">${k(r.pv)} <span class="faint">${pct(r.pv)}</span></td>
    <td class="n ${r.p.lo > 0 ? "pos" : ""}">${ev(pts(r.p.delta), e)}</td><td class="n">${r.p.lo != null ? ev("[" + pts(r.p.lo) + ", " + pts(r.p.hi) + "]", e) : '<span class="faint">no rows</span>'}</td>
    <td class="n">${r.p.wins != null ? `<span class="pos">${r.p.wins}</span> / <span class="neg">${r.p.losses}</span>` : "—"}</td><td class="n">${r.chRuns} · ${r.pvRuns}</td></tr>`;
  }).join("")}
  </tbody></table></div>
  <dl class="f" style="margin-top:12px"><dt>champion column</dt><dd>${CTL.replace("gsm8k-test/", "")} and ${TGT.replace("gsm8k-test/", "")}: mean over every champion run per id; others: latest run</dd><dt>runs</dt><dd>champion · previous</dd><dt>CI</dt><dd>paired bootstrap, 2,000 resamples, over ids</dd></dl>`;
}

/* ================= 05 gates ================= */
{
  const L = D.config.ladder;
  const S = id => T[id]?.summary?.score;
  const GT = { // promotion-time pairs (task ids from the ledger); CIs are from the task notes where the row is a string
    dev: [{ sl: TGT, rule: "better", thr: 0, c: "1026-015459-eval-e6a9", b: "1026-015152-eval-a636", ci: [3.78, 11.89], fb: [18, 4], extra: "pre-registered: lower 90% CI > 0" },
          { sl: CTL, rule: "not_worse", thr: -2, c: "1026-020414-eval-856a", b: "1026-020310-eval-30b4" }],
    random50: [{ sl: "gsm8k-test/random50", rule: "not_worse", thr: -2, c: "1026-020803-eval-a7da", b: "1026-020727-eval-a66c" }],
    random100: [{ sl: "gsm8k-test/random100", rule: "not_worse", thr: -1, c: "1026-021038-eval-e25f", b: "1026-020927-eval-8a7f" }],
    full: [{ sl: FULL, rule: "better", thr: 0, c: "1026-023024-eval-5116", b: "1026-021402-eval-25f8", ci: [3.71, 6.75], fb: [106, 37] }]
  };
  const mini = (d, thr, ci) => { const lo = -6, hi = 14, X = v => 6 + (v - lo) / (hi - lo) * 188; return `<svg viewBox="0 0 200 30" preserveAspectRatio="none"><line class="grid" x1="6" x2="194" y1="15" y2="15"/><line class="s-mut" x1="${X(0)}" x2="${X(0)}" y1="6" y2="24"/><rect x="${X(lo)}" y="9" width="${X(thr) - X(lo)}" height="12" style="fill:var(--negative);opacity:.12"/><line class="s-neg" x1="${X(thr)}" x2="${X(thr)}" y1="5" y2="25" stroke-dasharray="2 2"/>${ci ? `<line class="s-pos" stroke-width="3" stroke-linecap="round" x1="${X(ci[0])}" x2="${X(ci[1])}" y1="15" y2="15"/>` : ""}<circle class="f-pos" cx="${X(d)}" cy="15" r="4.5"/></svg>`; };
  const ld = L.map((r, i) => {
    const ch = (GT[r.rung] || []).map(c => {
      const n = SL[c.sl].n, a = S(c.c), b = S(c.b), d = (a - b) * 100;
      const e = { label: `${r.rung} · ${c.sl}`, slice: c.sl, hash: SL[c.sl].hash, n, runs: [c.c, c.b], src: c.ci ? "task note on " + c.c : "task summaries", note: `${c.rule} ${c.thr >= 0 ? "> " + c.thr : "≥ " + c.thr} pts · observed ${sgn(d, 2)}${c.ci ? ` · CI [${c.ci.join(", ")}] · ${c.fb[0]} fixed / ${c.fb[1]} broken` : ""}` };
      return `<div class="chk"><div class="rl">${esc(c.sl.replace("gsm8k-test/", ""))} · ${c.rule} ${c.thr >= 0 ? "> " + c.thr : "≥ " + c.thr} pts</div>
      <div class="ob">${ev(Math.round(a * n) + " vs " + Math.round(b * n), e)} · <b class="pos">${ev(sgn(d) + " pts", e)}</b>${c.ci ? ` · CI ${ev("[+" + c.ci[0] + ", +" + c.ci[1] + "]", e)}` : ""} <span class="pos">✓</span></div>${mini(d, c.thr, c.ci)}${c.extra ? `<div class="rl">${c.extra} ✓</div>` : ""}</div>`;
    }).join("");
    const skipped = r.checks.filter(c => c.slice === "@hills.climbed").map(() => `<div class="chk"><div class="rl">@hills.climbed · not_worse −3 pts</div><div class="ob faint">no climbed hill yet · n/a</div></div>`).join("");
    const t0 = (GT[r.rung] || [])[0]; const when = T[t0?.c]?.ended;
    return `<div class="rung" style="margin-left:0"><div class="rh"><b>${i + 1} · ${r.rung}</b><span class="st champion">pass</span></div><div class="faint" style="font:11px var(--mono);margin-bottom:8px">${dt(when)}</div>${ch}${skipped}</div>`;
  }).join("");
  const au = T["1026-031545-analysis-39e2"];
  body("gates").innerHTML = `<div class="ladder">${ld}</div>
  <div class="leg"><span><i style="background:var(--positive)"></i>observed Δ and 90% CI</span><span><i style="background:var(--negative);opacity:.35"></i>fails below the dashed threshold</span><span>axis −6 to +14 pts</span></div>
  <div class="after">
    <div class="stp"><div class="k">audit · ${esc(au?.id)}</div>${esc(au?.note || "").replace(/^APPROVE/, '<b class="pos">APPROVE</b>')}</div>
    <div class="stp"><div class="k">promote · ${dt(promoteDec?.t)}</div>${esc(CH)} replaced ${esc(promoteDec?.replaced)}</div>
    <div class="stp"><div class="k">baseline after promote</div>${Object.keys(D.baseline.have).length} slices have champion runs · missing: ${D.baseline.need.map(x => `<code>${esc(x.replace("gsm8k-test/", ""))}</code>`).join(", ")}</div>
  </div>`;
}

/* ================= 06 flips (1,319 cells) ================= */
{
  const cls = (c, b) => { const a = c >= .5, p = b >= .5; return a && !p ? "fix" : p && !a ? "brk" : a ? "rr" : "ww"; };
  const known = [];
  for (const k of ["target", "control"]) { const R = D.rows[k]; R.ids.forEach(id => known.push({ id, sl: R.slice, o: cls(R.ch[id], R.pv[id]), c: R.ch[id], b: R.pv[id], runs: runsOf(CH, R.slice).length })); }
  const kc = o => known.filter(x => x.o === o).length;
  const tot = { fix: FIX, brk: BRK, ww: WW, rr: RR };
  const rest = []; for (const o of ["fix", "brk", "ww", "rr"]) for (let i = 0; i < Math.max(0, tot[o] - kc(o)); i++) rest.push({ id: null, sl: null, o });
  const ORD = { fix: 0, brk: 1, ww: 2, rr: 3 }, COL = { fix: "f-pos", brk: "f-neg", ww: "f-ww", rr: "f-rr" }, LAB = { fix: "fixed", brk: "broken", ww: "both wrong", rr: "both right" };
  let mode = "outcome", hide = new Set();
  const all = [...known, ...rest];
  const draw = () => {
    const narrow = innerWidth < 560, cols = narrow ? 34 : 60, cs = 12, gap = 2, W = cols * (cs + gap);
    let blocks;
    if (mode === "outcome") blocks = [["all " + N0(N) + " problems, sorted by outcome", [...all].sort((a, b) => ORD[a.o] - ORD[b.o])]];
    else blocks = [[TGT.replace("gsm8k-test/", "") + " · " + D.rows.target.ids.length + " · per id", known.filter(x => x.sl === TGT).sort((a, b) => ORD[a.o] - ORD[b.o])],
                   [CTL.replace("gsm8k-test/", "") + " · " + D.rows.control.ids.length + " · per id", known.filter(x => x.sl === CTL).sort((a, b) => ORD[a.o] - ORD[b.o])],
                   ["other " + N0(rest.length) + " · per-id rows not exported, placed by count", rest]];
    let y = 0, out = "", idx = 0; window.__cells = [];
    for (const [lab, cells] of blocks) {
      out += `<text class="t-f" x="0" y="${y + 11}">${esc(lab)}</text>`; y += 18;
      cells.forEach((c, i) => { const cx = (i % cols) * (cs + gap), cy = y + Math.floor(i / cols) * (cs + gap); window.__cells.push(c);
        out += `<rect data-i="${idx++}" x="${cx}" y="${cy}" width="${cs}" height="${cs}" rx="2" class="${COL[c.o]}" style="${hide.has(c.o) ? "opacity:.12" : ""}${c.id ? "" : ";opacity:" + (hide.has(c.o) ? .08 : .82)}"/>${c.id && c.c > 0 && c.c < 1 ? `<circle cx="${cx + cs / 2}" cy="${cy + cs / 2}" r="2" style="fill:var(--surface)" pointer-events="none"/>` : ""}`; });
      y += Math.ceil(cells.length / cols) * (cs + gap) + 12;
    }
    $("#grid").innerHTML = `<svg viewBox="0 -2 ${W} ${y}" role="img" aria-label="Every problem on full: fixed, broken, both right, both wrong">${out}</svg>`;
  };
  const evF = { label: "Fixed and broken on full", slice: FULL, hash: SL[FULL].hash, n: N, runs: [G.task, lb(FULL, PV).task], src: ".research/goals.json › vs_baseline.wins / losses" };
  body("flips").innerHTML = `<div class="ctl"><div class="seg" id="fmode"><button class="on" data-m="outcome">by outcome</button><button data-m="slice">by slice</button></div></div>
  <div class="fig" id="grid"></div>
  <div class="leg" id="fleg">${["fix", "brk", "ww", "rr"].map(o => `<button data-o="${o}"><i class="${o}" style="background:${{ fix: "var(--positive)", brk: "var(--negative)", ww: "var(--cell-ww)", rr: "var(--cell-rr)" }[o]}"></i>${LAB[o]} · <b>${N0(tot[o])}</b></button>`).join("")}<span><i style="background:var(--surface);border:1px solid var(--control);border-radius:50%"></i>flips across champion runs</span></div>
  <dl class="f" style="margin-top:12px">
    <dt>net</dt><dd>${ev(FIX + " − " + BRK + " = " + sgn(FIX - BRK, 0), evF)} problems on ${FULL}</dd>
    <dt>per id known</dt><dd>${known.length} of ${N0(N)} (two hill slices): <span class="pos">${kc("fix")} fixed</span>, <span class="neg">${kc("brk")} broken</span>, ${kc("ww")} both wrong</dd>
    <dt>flaky</dt><dd>${ev(known.filter(x => x.c > 0 && x.c < 1).length + " ids", { label: "Ids whose champion score differs across runs", slice: TGT + " + " + CTL, n: known.length, src: "hill-percent-base.json, champion per-id mean strictly between 0 and 1", note: "runs mix transformers and vLLM engines" })} change answer across champion runs</dd>
  </dl>`;
  draw();
  $("#fmode").onclick = e => { const b = e.target.closest("button"); if (!b) return; mode = b.dataset.m; $$("#fmode button").forEach(x => x.classList.toggle("on", x === b)); draw(); };
  $("#fleg").onclick = e => { const b = e.target.closest("button[data-o]"); if (!b) return; const o = b.dataset.o; hide.has(o) ? hide.delete(o) : hide.add(o); b.classList.toggle("dim", hide.has(o)); draw(); };
  const tip = $("#tip");
  $("#grid").addEventListener("mousemove", e => { const r = e.target.closest("rect[data-i]"); if (!r) { tip.style.display = "none"; return; } const c = window.__cells[+r.dataset.i];
    tip.textContent = c.id ? `${c.id}\n${c.sl.replace("gsm8k-test/", "")}\n${LAB[c.o]}\nchampion right in ${Math.round(c.c * c.runs)} of ${c.runs} runs\nprevious ${c.b ? "right" : "wrong"}` : `${LAB[c.o]}\nid not exported`;
    tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 12, innerWidth - 240) + "px"; tip.style.top = e.clientY + 14 + "px"; });
  $("#grid").addEventListener("mouseleave", () => tip.style.display = "none");
  $("#grid").addEventListener("click", e => { const r = e.target.closest("rect[data-i]"); if (!r) return; const c = window.__cells[+r.dataset.i]; if (!c.id) return;
    openPop(r, { v: LAB[c.o], label: "Problem " + c.id, slice: c.sl, hash: SL[c.sl].hash, n: SL[c.sl].n, runs: [lb(c.sl, CH).task, lb(c.sl, PV).task], src: "hill-percent-base.json › runs[model][id]", note: `champion mean ${c.c.toFixed(2)} over ${c.runs} runs · previous ${c.b}` }); });
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(draw, 150); });
}

/* ================= 07 failures ================= */
{
  const errs = N - NOW, cap = 29, capHits = 34;
  const W = 800, X = v => v / errs * W;
  let s = `<svg viewBox="0 0 ${W} 70" role="img" aria-label="Champion errors on full by kind"><text class="t-f" x="0" y="11">champion's ${errs} wrong answers on ${FULL}</text>
  <rect x="0" y="20" width="${X(cap) - 1}" height="32" rx="3" class="f-neg"/><rect x="${X(cap)}" y="20" width="${W - X(cap)}" height="32" rx="3" class="f-ww"/>
  <text x="8" y="41" style="fill:#fff" class="t-b">${cap} cut at 1,024 tokens</text><text x="${X(cap) + 8}" y="41" style="fill:#fff" class="t-b">${errs - cap} finished, wrong number</text>
  <text class="t-f" x="0" y="68">${capHits} outputs hit the cap; ${capHits - cap} of them were still right</text></svg>`;
  const H = D.hills, of = Object.values(H)[0].share.of, other = of - Object.values(H).reduce((a, h) => a + h.share.count, 0);
  let s2 = `<svg viewBox="0 0 ${W} 62" role="img" aria-label="Archived errors split by hill"><text class="t-f" x="0" y="11">${of} archived errors (${esc(D.config.provenance.source.split("/").pop())}), disjoint input categories</text>`, x = 0;
  const hc = { "percent-base": "var(--chart-1)", "time-rate": "var(--chart-2)", "group-count": "var(--chart-3)" };
  [...Object.entries(H).map(([k, h]) => [k, h.share.count, hc[k]]), ["other", other, "var(--control)"]].forEach(([k, n, c]) => { const w = n / of * W; s2 += `<rect x="${x}" y="20" width="${w - 1}" height="28" rx="3" style="fill:${c}"/><text x="${x + 6}" y="38" style="fill:#fff;font-size:11.5px" class="t-b">${w > 70 ? k + " " + n : n}</text>`; x += w; });
  s2 += `</svg>`;
  const still = D.rows.target.ids.filter(i => D.rows.target.ch[i] < .5).map(i => ({ id: i, c: D.rows.target.ch[i], b: D.rows.target.pv[i] })).sort((a, b) => a.c - b.c);
  const nR = runsOf(CH, TGT).length;
  const card = (k, h) => {
    const tr = SL[h.target], chs = lb(h.target, CH), arch = lb(h.target, "qwen3-4b-rl-archived");
    return `<div class="hc"><div class="kick">${esc(k)} · ${h.status === "climbed" ? '<span class="pos">climbed</span>' : '<span class="warn">open</span>'}</div><div class="ht">${esc(h.title.replace(/\s*\[.*\]$/, ""))}</div>
    <div class="sym">${esc(h.symptom)}</div>
    <dl class="f" style="font-size:12.5px"><dt>share</dt><dd>${ev(h.share.count + " of " + h.share.of, { label: "Share of archived errors", slice: h.target, n: h.share.of, src: ".research/hills.json › " + k + ".share", note: h.share.of_what })} archived errors</dd>
    <dt>target</dt><dd><code>${esc(h.target.replace("gsm8k-test/", ""))}</code> · n ${tr.n}</dd>
    <dt>champion</dt><dd>${chs ? ev(Math.round(chs.score * tr.n) + " / " + tr.n, { label: "Champion on " + h.target, slice: h.target, hash: tr.hash, n: tr.n, runs: [chs.task], src: "leaderboard (latest run)" }) : '<span class="warn">not run</span>'}</dd>
    <dt>archived</dt><dd>${arch ? Math.round(arch.score * tr.n) + " / " + tr.n : "—"}</dd></dl>
    ${h.examples.map(x => `<div class="exm"><div class="q">${esc(x.input)}</div><div class="row"><span class="neg">wrong</span><code>${esc(x.wrong)}</code></div><div class="row"><span class="pos">right</span><code>${esc(x.right)}</code></div><div class="why">${esc(x.why)}</div></div>`).join("")}</div>`;
  };
  body("failures").innerHTML = `<div class="fig sc">${s}</div><div class="fig sc">${s2}</div>
  <div class="hills">${Object.entries(H).map(([k, h]) => card(k, h)).join("")}</div>
  <h3>still wrong on ${esc(TGT.replace("gsm8k-test/", ""))} · ${still.length} of ${D.rows.target.ids.length} ids · champion right in k of ${nR} runs</h3>
  <div class="idchips">${still.map(x => `<button data-id="${x.id}" data-c="${x.c}" data-b="${x.b}">${x.id.slice(0, 8)} · ${Math.round(x.c * nR)}/${nR}${x.b ? " · was right" : ""}</button>`).join("")}</div>
  <div class="cap">example texts are the hill's archived illustrations; per-id traces stay private</div>`;
  $(".idchips").onclick = e => { const b = e.target.closest("button"); if (!b) return; openPop(b, { v: "wrong", label: "Problem " + b.dataset.id, slice: TGT, hash: SL[TGT].hash, n: SL[TGT].n, runs: [lb(TGT, CH).task], src: "hill-percent-base.json › target.runs", note: `champion mean ${(+b.dataset.c).toFixed(2)} over ${nR} runs · previous ${b.dataset.b}` }); };
}

/* ================= 08 lineage ================= */
{
  const chain = []; let m = CH; while (m && !chain.includes(m)) { chain.unshift(m); const p = M[m].parent; if (p === m) break; m = p; }
  const fullS = k => lb(FULL, k)?.score;
  const spine = chain.map((k, i) => `${i ? '<span class="ar">→</span>' : ""}<div class="nd${k === CH ? " me" : ""}"><b>${esc(k)}</b>${fullS(k) != null ? ev(Math.round(fullS(k) * N) + " / " + N0(N), { label: k + " on full", slice: FULL, n: N, runs: [lb(FULL, k).task], src: "leaderboard" }) : ""} · <span class="st ${M[k].status}">${M[k].status}</span></div>`).join("");
  const kids = p => Object.entries(M).filter(([k, v]) => v.parent === p && k !== p).sort((a, b) => a[1].created - b[1].created);
  const lo = .6, hi = 1, X = v => 4 + (v - lo) / (hi - lo) * 292;
  const ref = [[lb(TGT, PV).score, "s-mut"], [lb(TGT, CH).score, "s-pos"]];
  const row = (k, v) => { const sc = lb(TGT, k)?.score; return `<div class="lrow" data-k="${k}"><div class="nm" title="${esc(k)}">${esc(k)}</div><span class="st ${v.status}">${v.status}</span>
    <svg viewBox="0 0 300 18" preserveAspectRatio="none"><line class="grid" x1="4" x2="296" y1="9" y2="9"/>${ref.map(([r, c]) => `<line class="${c}" x1="${X(r)}" x2="${X(r)}" y1="1" y2="17" stroke-dasharray="2 2"/>`).join("")}${sc != null ? `<circle cx="${X(sc)}" cy="9" r="5" class="${v.status === "champion" ? "f-pos" : v.status === "rejected" ? "f-neg" : v.status === "candidate" ? "f-warn" : "f-mut"}"/>` : `<text x="8" y="13" class="t-f">no run on target</text>`}</svg></div>
    <div class="ldet"><dl class="f" style="font-size:12.5px"><dt>title</dt><dd>${esc(v.title)}</dd><dt>registered</dt><dd>${dt(v.created)}</dd>${sc != null ? `<dt>target</dt><dd>${ev(Math.round(sc * 185) + " / 185", { label: k + " on " + TGT, slice: TGT, hash: SL[TGT].hash, n: 185, runs: [lb(TGT, k).task], src: "leaderboard (latest run)" })} · p50 ${lb(TGT, k).latency_p50?.toFixed(1) ?? "—"} s</dd>` : ""}<dt>change</dt><dd>${esc(v.change)}</dd>${v.reason ? `<dt>${v.status === "rejected" ? "rejected" : "reason"}</dt><dd class="${v.status === "rejected" ? "neg" : ""}">${esc(v.reason)}</dd>` : ""}</dl></div>`; };
  const groups = [...new Set(Object.values(M).map(v => v.parent))].filter(p => M[p]).sort((a, b) => M[a].created - M[b].created);
  const counts = Object.values(M).reduce((a, v) => (a[v.status] = (a[v.status] || 0) + 1, a), {});
  const axis = `<div class="lrow" style="cursor:default"><div></div><div></div><svg viewBox="0 0 300 18" preserveAspectRatio="none">${[.6, .7, .8, .9, 1].map(v => `<text x="${X(v)}" y="12" text-anchor="middle" class="t-f">${v * 100}%</text>`).join("")}</svg></div>`;
  body("lineage").innerHTML = `<div class="spine">${spine}</div>
  <div class="facts" style="margin-bottom:10px">${Object.entries(counts).map(([k, n]) => `<span class="st ${k}">${n} ${k}</span>`).join("")}</div>
  <div class="lin">${axis}
  ${groups.map(p => `<div class="grp">children of ${esc(p)}${p === PV ? " (previous champion)" : p === CH ? " (champion)" : ""} · score on ${esc(TGT.replace("gsm8k-test/", ""))}, n 185</div>${kids(p).map(([k, v]) => row(k, v)).join("")}`).join("")}
  </div><div class="leg"><span><i style="background:var(--control)"></i>dashed: previous champion</span><span><i style="background:var(--positive)"></i>dashed: champion</span><span>click a row for its change and reason</span></div>`;
  $(".lin").onclick = e => { if (e.target.closest(".ev")) return; const r = e.target.closest(".lrow[data-k]"); if (r) r.classList.toggle("open"); };
}

/* ================= 09 cost ================= */
{
  const sls = [FULL, "gsm8k-test/random100", "gsm8k-test/random50", CTL, TGT];
  const W = 800, L = 170, hi = 60, X = v => L + Math.min(v, hi) / hi * (W - L - 30), rh = 40;
  let s = `<svg viewBox="0 0 ${W} ${sls.length * rh + 34}" role="img" aria-label="Latency p50 and p95, previous vs champion">`;
  for (let v = 0; v <= hi; v += 10) s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="0" y2="${sls.length * rh}"/><text class="t-f" x="${X(v)}" y="${sls.length * rh + 14}" text-anchor="middle">${v}s</text>`;
  s += `<text class="t-f" x="${W - 30}" y="${sls.length * rh + 30}" text-anchor="end">s per question, batch 16 · dot p50, bar end p95</text>`;
  sls.forEach((sl, i) => {
    const y = 12 + i * rh; s += `<text x="${L - 10}" y="${y + 10}" text-anchor="end">${esc(sl.replace("gsm8k-test/", ""))}</text>`;
    [[PV, 0, "s-mut", "f-mut"], [CH, 14, "s-acc", "f-acc"]].forEach(([m, dy, sc, fc]) => { const r = lb(sl, m); if (!r?.latency_p50) return;
      s += `<line class="${sc}" stroke-width="4" stroke-linecap="round" x1="${X(r.latency_p50)}" x2="${X(r.latency_p95)}" y1="${y + dy}" y2="${y + dy}" opacity=".55"/><circle class="${fc}" cx="${X(r.latency_p50)}" cy="${y + dy}" r="4.5"/>`;
      s += `<text class="t-f" x="${X(r.latency_p95) + 6}" y="${y + dy + 4}">${r.latency_p50.toFixed(1)} / ${r.latency_p95.toFixed(1)}</text>`; });
  });
  s += `</svg>`;
  const tk = [["previous", 96157, "f-mut"], ["champion", 369446, "f-acc"]], TW = 800, TX = v => v / 400000 * (TW - 120);
  let s2 = `<svg viewBox="0 0 ${TW} 70" role="img" aria-label="Generated tokens on full">`;
  tk.forEach(([l, v, c], i) => { s2 += `<rect class="${c}" x="0" y="${i * 28 + 4}" width="${TX(v)}" height="20" rx="3"/><text x="${TX(v) + 8}" y="${i * 28 + 18}" class="t-b">${N0(v)} <tspan class="t-f">${l}</tspan></text>`; });
  s2 += `</svg>`;
  const cr = (sl, m) => lb(sl, m)?.cost;
  body("cost").innerHTML = `<div class="fig sc">${s}<div class="leg"><span><i style="background:var(--control)"></i>${esc(PV)}</span><span><i style="background:var(--accent)"></i>${esc(CH)}</span></div></div>
  <h3>generated tokens on full, n ${N0(N)}</h3><div class="fig sc">${s2}</div>
  <dl class="f">
    <dt>tokens</dt><dd>${ev("3.84×", { label: "Token ratio", slice: FULL, n: N, runs: ["1026-023024-eval-5116"], src: "task note", note: "369,446 vs 96,157 generated tokens" })} the previous champion</dd>
    <dt>batch seconds</dt><dd>${ev("2.82×", { label: "Batch seconds ratio", slice: FULL, n: N, runs: ["1026-031545-analysis-39e2"], src: "audit note" })}</dd>
    <dt>p50 · p95 on full</dt><dd>${ev(lb(FULL, CH).latency_p50.toFixed(1) + " · " + lb(FULL, CH).latency_p95.toFixed(1) + " s", { label: "Latency on full", slice: FULL, n: N, runs: [lb(FULL, CH).task, lb(FULL, PV).task], src: "leaderboard › latency_p50 / latency_p95", note: "previous " + lb(FULL, PV).latency_p50.toFixed(2) + " · " + lb(FULL, PV).latency_p95.toFixed(2) + " s" })} vs ${lb(FULL, PV).latency_p50.toFixed(1)} · ${lb(FULL, PV).latency_p95.toFixed(1)} s</dd>
    <dt>$ per query</dt><dd class="warn">${cr(FULL, CH) == null ? "not recorded on any run (cost = null)" : cr(FULL, CH)}</dd>
    <dt>H100 serving</dt><dd>${esc(D.config.serving.status)} · batch sizes ${D.config.serving.batch_sizes.join(", ")} · ${ev("1 completed run", { label: "H100 serving benchmark", runs: ["1026-032756-benchmark-7ebf", "1026-032353-benchmark-6bf4"], src: "tasks", note: (T["1026-032756-benchmark-7ebf"]?.note || "") + " · numbers not in the export" })}, numbers not exported</dd>
  </dl>`;
}

/* ================= 10 not known ================= */
{
  const sls = [FULL, "gsm8k-test/random100", "gsm8k-test/random50", CTL, TGT, "gsm8k-test/dev-time-rate-v1", "gsm8k-test/dev-group-count-v1"];
  const hasRows = sl => sl === TGT || sl === CTL;
  const mk = v => v === 2 ? '<span class="ok">✓</span>' : v === 1 ? '<span class="part">~</span>' : '<span class="no">✗</span>';
  const mx = sls.map(sl => { const c = runsOf(CH, sl).length, p = runsOf(PV, sl).length; const ci = sl === FULL || hasRows(sl);
    return `<tr><td class="id">${esc(sl.replace("gsm8k-test/", ""))}</td><td>${mk(c ? 2 : 0)} <span class="faint">${c}</span></td><td>${mk(p ? 2 : 0)} <span class="faint">${p}</span></td><td>${mk(ci ? 2 : (c && p ? 1 : 0))}</td><td>${mk(hasRows(sl) ? 2 : 0)}</td><td>${mk(c > 1 ? 2 : c ? 1 : 0)}</td></tr>`; }).join("");
  const items = [
    ["not run", `champion on <code>dev-time-rate-v1</code> (500) and <code>dev-group-count-v1</code> (447); 118 of 168 archived errors sit there`],

    ["noise on full", `${runsOf(CH, FULL).length} champion runs on full, all ${N0(NOW)}; previous champion ${runsOf(PV, FULL).length} runs`],
    ["test reuse", "gsm8k-test was used for development; it is not an untouched final test"],
    ["cap", "34 outputs still hit 1,024 tokens on full; 2048 and 4096 candidates are open"],
    ["cost", "$ per query not recorded; H100 serving numbers not exported"],
    ["causes", "hill categories are input regexes, a discovery proxy, not verified causal labels"],
    ["goal audit", "goal needs an independent audit and H100 serving reports for every promoted champion"]

  body("unknown").innerHTML = `<div class="tw"><table class="mx"><thead><tr><th>slice</th><th>champion runs</th><th>previous runs</th><th>paired CI</th><th>per-id rows here</th><th>repeated</th></tr></thead><tbody>${mx}</tbody></table></div>
  <dl class="f" style="margin-top:14px">${items.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
  <h3>open candidates against this champion</h3><div class="facts">${Object.entries(M).filter(([k, v]) => v.parent === CH && v.status === "candidate").map(([k]) => `<span class="pill warn">${esc(k)}</span>`).join("")}</div>`;
}

/* ================= 11 reproduce ================= */
{
  const sp = typeof champModel.serving_policy === "object" ? champModel.serving_policy : (() => { try { return JSON.parse(String(champModel.serving_policy).replace(/'/g, '"').replace(/\bFalse\b/g, "false").replace(/\bTrue\b/g, "true")); } catch { return {}; } })();
  const gc = T["1026-023024-eval-5116"]?.config || {};
  const cmd = `<span class="cmt"># where the champion stands, and the next run</span>
arx gate ${CH}
arx goal status ${G.name}
<span class="cmt"># re-run the champion on every slice it lacks (dev-time-rate-v1, dev-group-count-v1)</span>
arx baseline ${CH}
<span class="cmt"># the harness is hash-pinned; dry-run first</span>
arx run --manifest &lt;manifest.json&gt; --expected-sha256 ${gc.runner_sha256} --dry-run`;
  const contract = JSON.stringify({ ...sp, batch_size: gc.batch_size, batch_order: gc.batch_order, runner_sha256: gc.runner_sha256, scorer_sha256: gc.scorer_sha256, module_sha256: gc.module_sha256, serving_policy_fingerprint: champModel.serving_policy_fingerprint }, null, 2);
  const sls = [FULL, "gsm8k-test/random100", "gsm8k-test/random50", CTL, TGT];
  body("reproduce").innerHTML = `<div class="cb"><pre id="c1">${cmd}</pre><button class="cp" data-c="c1">Copy</button></div>
  <h3>serving contract</h3><div class="cb"><pre id="c2">${esc(contract)}</pre><button class="cp" data-c="c2">Copy</button></div>
  <h3>every run behind this paper</h3>
  <div class="tw"><table><thead><tr><th>slice</th><th>hash</th><th>model</th><th>run id</th><th class="n">score</th><th>ended</th></tr></thead><tbody>
  ${sls.flatMap(sl => [CH, PV].flatMap(m => runsOf(m, sl).map(t => `<tr${m === CH ? ' class="me"' : ""}><td class="id">${esc(sl.replace("gsm8k-test/", ""))}</td><td class="id">${esc(SL[sl].hash)}</td><td class="id">${m === CH ? "champion" : "previous"}</td><td class="id">${esc(t.id)}</td><td class="n">${t.summary?.score != null ? pct(t.summary.score) : "—"}</td><td class="id">${dt(t.ended)}</td></tr>`))).join("")}
  </tbody></table></div>
  <h3>audits</h3><dl class="f">${D.tasks.filter(t => t.kind === "analysis" && /audit/i.test(t.title)).map(t => `<dt>${esc(t.id)}</dt><dd><b>${esc(t.title)}</b><div class="muted">${esc(t.note || "")}</div></dd>`).join("")}</dl>`;

/* ---------------- popover ---------------- */
const pop = $("#pop"); let popFor = null;
function openPop(anchor, e) {
  $$(".ev.open").forEach(x => x.classList.remove("open")); anchor.classList?.add("open"); popFor = anchor;
  const rows = [["slice", e.slice], ["hash", e.hash], ["n", e.n != null ? N0(e.n) : null], ["source", e.src], ["detail", e.note]].filter(r => r[1] != null && r[1] !== "");
  pop.innerHTML = `<button class="x" aria-label="Close">×</button><div class="pv">${esc(e.v)}</div><div class="pl">${esc(e.label || "")}</div>
  <dl class="f">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}${(e.runs || []).filter(Boolean).length ? `<dt>runs</dt><dd>${e.runs.filter(Boolean).map(id => `<div>${runLine(id)}</div>`).join("")}</dd>` : ""}</dl>
  <div class="pa"><button class="tb" id="pCopy">Copy evidence</button></div>`;
  pop.classList.add("show");
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(12, r.left), innerWidth - pw - 12), top = r.bottom + 8; if (top + ph > innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  $("#pCopy").onclick = () => copy([e.v, e.label, ...rows.map(([k, v]) => k + ": " + v), ...(e.runs || []).filter(Boolean).map(id => "run: " + id)].join("\n"), "Evidence copied");
  pop.querySelector(".x").onclick = closePop;
}
function closePop() { pop.classList.remove("show"); $$(".ev.open").forEach(x => x.classList.remove("open")); popFor = null; }
document.addEventListener("click", e => {
  const b = e.target.closest(".ev"); if (b) { e.stopPropagation(); if (popFor === b) return closePop(); return openPop(b, EV[b.dataset.ev]); }
  if (!e.target.closest("#pop") && !e.target.closest("#grid rect") && !e.target.closest(".idchips button")) closePop();
});
addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
addEventListener("scroll", () => { if (popFor && innerWidth > 560) closePop(); }, { passive: true });

/* ---------------- toolbar ---------------- */
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600); };
async function copy(text, msg) { try { await navigator.clipboard.writeText(text); } catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch {} ta.remove(); } toast(msg); }
let cur = "claim";
const linkTo = id => location.href.split("#")[0] + "#" + id;
$("#bLink").onclick = () => copy(linkTo(cur), "Link to " + SECS.find(s => s[0] === cur)[1] + " copied");
$$(".anc").forEach(b => b.onclick = () => { copy(linkTo(b.dataset.anchor), "Link copied"); history.replaceState(null, "", "#" + b.dataset.anchor); });
$("#bPrint").onclick = () => { $$(".lrow").forEach(r => r.classList.add("open")); print(); };
addEventListener("afterprint", () => $$(".lrow").forEach(r => r.classList.remove("open")));
$("#bTheme").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("arx-paper-theme", r.dataset.theme); } catch {} };
try { const t = localStorage.getItem("arx-paper-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#bShare").onclick = () => {
  const doc = document.documentElement.cloneNode(true);
  doc.removeAttribute("data-theme");
  [...doc.querySelector("head").children].forEach(n => { if (!n.hasAttribute("data-keep")) n.remove(); });
  [...doc.querySelector("body").children].forEach(n => { if (!n.hasAttribute("data-keep")) n.remove(); });
  [...doc.querySelector("body").attributes].forEach(a => { if (a.name !== "data-keep") doc.querySelector("body").removeAttribute(a.name); });
  doc.querySelector("#app").innerHTML = '<div id="load">loading…</div>';
  doc.querySelector("#snap").textContent = JSON.stringify(D).replace(/</g, "\\u003c");
  const out = "<!doctype html>\n" + doc.outerHTML;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out], { type: "text/html" }));
  a.download = `${CH}-paper-${new Date(D.now * 1000).toISOString().slice(0, 10)}.html`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Snapshot saved · ${(out.length / 1024).toFixed(0)} KB, no fetches`);
};

/* ---------------- scroll spy ---------------- */
const spy = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { cur = e.target.id; $$("#toc a, #chips a").forEach(a => a.classList.toggle("on", a.dataset.s === cur)); const c = $(`#chips a[data-s="${cur}"]`); const ch = $("#chips"); if (c && ch.offsetParent) ch.scrollTo({ left: c.offsetLeft - ch.clientWidth / 2 + c.offsetWidth / 2, behavior: "smooth" }); } }); }, { rootMargin: "-80px 0px -65% 0px" });
$$("section.s").forEach(s => spy.observe(s));
if (location.hash && $(location.hash)) requestAnimationFrame(() => $(location.hash).scrollIntoView());
if (SNAP) $(".crumb").insertAdjacentHTML("beforeend", ` · <span class="warn">snapshot ${dt(D.now)}</span>`);
})();
</script>
