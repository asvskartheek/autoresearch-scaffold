/* ================= 04 results ================= */
// the gate this model was promoted on pooled fewer runs than today: say what it read then, so one comparison never
// shows two unexplained numbers
function atProm(r) {
  const a = r.at_promotion, p = r.vs;
  if (!a || !p || Math.abs(a.delta - p.delta) < 5e-4) return "";
  return `<div class="faint" style="font-size:11.5px" title="The promotion gate (${dt(D.promotion.t)}) pooled ${a.cand_runs ?? "?"} vs ${a.base_runs ?? "?"} runs">at promotion ${isBin(r) ? cnt(a.cand, r) + ", " : ""}${dl(a.delta, r)}</div>`;
}
section("results", () => {
  if (!R.length) return `<div class="empty">No complete runs.</div>`;
  const bins = R.filter(r => isBin(r) && r.vs);
  let fig = "";
  if (bins.length) {
    const ext = Math.max(2, ...bins.flatMap(r => [Math.abs(r.vs.lo * 100), Math.abs(r.vs.hi * 100), Math.abs(r.vs.delta * 100)]));
    const st = niceStep(ext / 3), lo = -Math.ceil(ext / st) * st, hi = -lo;
    const W = FW("results"), nar = W < 560, L = nar ? Math.round(Math.min(150, W * .4)) : 230, Rr = nar ? 52 : 70, X = v => L + (v - lo) / (hi - lo) * (W - L - Rr), rh = 28, H = bins.length * rh;
    const lch = Math.max(6, Math.floor((L - 14) / 7) - (nar ? 0 : 8));
    let s = `<svg viewBox="0 0 ${W} ${H + 40}" width="${W}" role="img" aria-label="Paired delta per slice with 90% CI">`;
    for (let v = lo, k = 0; v <= hi + 1e-9; v += st, k++) s += `<line class="${Math.abs(v) < 1e-9 ? "s-text" : "grid"}" x1="${X(v)}" x2="${X(v)}" y1="4" y2="${H + 6}"/>${nar && k % 2 && Math.abs(v) > 1e-9 ? "" : `<text class="t-f" x="${X(v)}" y="${H + 22}" text-anchor="middle">${v > 0 ? "+" : ""}${+v.toFixed(2)}</text>`}`;
    s += `<text class="t-f" x="${X(hi)}" y="${H + 36}" text-anchor="end">pts, ${esc(mnt(CH).length > 30 ? "this" : mnt(CH))} − ${esc(PV && mnt(PV).length < 30 ? mnt(PV) : "before")}</text>`;
    bins.forEach((r, i) => {
      const y = 16 + i * rh, p = r.vs, c = p.lo > 0 ? "pos" : p.hi < 0 ? "neg" : "mut";
      s += `<text x="${L - 10}" y="${y + 4}" text-anchor="end">${esc(short(r.slice).length > lch ? short(r.slice).slice(0, lch - 1) + "…" : short(r.slice))}${nar ? "" : ` <tspan class="t-f">n ${N0(r.n)}</tspan>`}</text>`;
      s += `<line x1="${X(p.lo * 100)}" x2="${X(p.hi * 100)}" y1="${y}" y2="${y}" stroke-width="3" class="s-${c}" stroke-linecap="round"/><circle cx="${X(p.delta * 100)}" cy="${y}" r="5" class="f-${c === "mut" ? "mut" : c}"/>`;
      s += `<text x="${W - Rr + 8}" y="${y + 4}" class="t-b">${sgn(p.delta * 100)}</text>`;
    });
    fig = `<div class="fig">${s}</svg><div class="leg"><span><i style="background:var(--positive)"></i>90% CI above 0</span><span><i style="background:var(--negative)"></i>below 0</span><span><i style="background:var(--control)"></i>includes 0</span></div></div>`;
  }
  const strip = r => {
    const f = r.field.filter(x => x[1] != null); if (f.length < 2) return "";
    const vs = f.map(x => x[1]), a = Math.min(...vs), b = Math.max(...vs), X = v => 6 + (b > a ? (v - a) / (b - a) : .5) * 148;
    const rank = 1 + f.filter(x => (D.project.higher_is_better ? x[1] > r.score : x[1] < r.score) && x[0] !== CH).length;
    return `${trk([tLine(), ...f.filter(x => x[0] !== CH && x[0] !== PV).map(x => tDot(X(x[1]) / 160, "c-mut", 3, mnt(x[0]) + " · " + sc(x[1], r))), ...f.filter(x => x[0] === PV).map(x => tDot(X(x[1]) / 160, "c-acc", 3.5, mnt(x[0]) + " · " + sc(x[1], r))), ...f.filter(x => x[0] === CH).map(x => tDot(X(x[1]) / 160, "c-pos", 5, mnt(x[0]) + " · " + sc(x[1], r)))], 18, "strip")}<span class="faint" style="font:11px var(--mono)">rank ${rank} of ${f.length}</span>`;
  };
  return `${fig}<div class="tw"><table><thead><tr><th>slice</th><th class="n hn">n</th><th class="n">this</th><th class="n hn">before</th><th class="n">Δ</th><th class="n">90% CI</th><th class="n hn">fixed / broken</th><th class="n hn">runs</th><th class="hn">every try</th></tr></thead><tbody>
  ${R.map(r => { const p = r.vs; return `<tr${r.slice === D.main ? ' class="me"' : ""}><td class="id">${esc(short(r.slice))}</td><td class="n hn">${N0(r.n)}</td>
    <td class="n">${ev(isBin(r) ? cnt(r.score, r) : sc(r.score, r), evRes(r))} ${isBin(r) ? `<span class="faint hn">${pct(r.score)}</span>` : ""}</td>
    <td class="n hn">${p ? (isBin(r) ? cnt(p.base, r) + ` <span class="faint">${pct(p.base)}</span>` : sc(p.base, r)) : '<span class="faint">—</span>'}</td>
    <td class="n ${p ? (p.lo > 0 ? "pos" : p.hi < 0 ? "neg" : "") : ""}">${p ? ev(dl(p.delta, r), evPair(r, p)) : "—"}</td><td class="n">${p ? ev(ciTxt(p, r), evPair(r, p)) : "—"}</td>
    <td class="n hn">${p ? `<span class="pos">${p.wins}</span> / <span class="neg">${p.losses}</span>` : "—"}</td><td class="n hn">${r.runs}${r.base ? " · " + r.base.runs : ""}${atProm(r)}</td><td class="hn">${strip(r)}</td></tr>`; }).join("")}
  </tbody></table></div>
  <dl class="f" style="margin-top:12px"><dt>this</dt><dd>${mn(CH)}: mean per id over every complete run</dd><dt>before</dt><dd>${PV ? mn(PV) : "no comparator"}</dd><dt>CI</dt><dd>paired bootstrap over shared ids, 2,000 resamples, seed 0</dd><dt>errors</dt><dd>count as 0</dd></dl>`;
});

/* ================= 05 gates ================= */
section("gates", () => {
  const L = D.ladder;
  if (!L.length) return `<div class="empty">research.json has no gate ladder.</div>`;
  // on a continuous slice margin / tolerance are a fraction of the champion's mean (core.gate): once paired the
  // threshold is in the slice's unit, "not worse by more than 8.2 MB (5% of the champion's mean)"
  const cont = c => c.scale === "continuous" || !!c.relative;
  const frac = c => +(100 * Math.abs(c.relative && c.base ? c.threshold / c.base : c.threshold)).toPrecision(2) + "% of the champion's mean";
  const rule = c => c.rule === "manual" ? "signed off by a person"
    : !cont(c) ? (c.rule === "better" ? `better > ${pts(c.threshold, 0).replace("+", "")} pts` : `not worse ≥ ${pts(c.threshold, 0)} pts`)
    : !c.threshold ? (c.rule === "better" ? "better" : "not worse")
    : `${c.rule === "better" ? "better" : "not worse"} by more than ${c.relative ? `${grp(Math.abs(c.threshold))}${c.unit ? " " + c.unit : ""} (${frac(c)})` : frac(c)}`;
  const mini = c => {
    if (c.delta == null) return "";
    const k = cont(c) ? 1 : 100, ends = [Math.abs(c.threshold * k), Math.abs((c.lo ?? c.delta) * k), Math.abs((c.hi ?? c.delta) * k)];
    const ext = cont(c) ? Math.max(...ends) * 1.15 || 1 : Math.max(4, ends[0] + 2, ends[1], ends[2]), X = v => .03 + (v + ext) / (2 * ext) * .94, thr = c.threshold * k;
    const ok = c.state === "pass";
    return trk([tLine(), `<i class="tzone" style="left:0;width:${pc(X(thr))}"></i>`, tMark(X(0), "c-faint", true), tMark(X(thr), "c-neg"), c.lo != null ? tBar(X(c.lo * k), X(c.hi * k), ok ? "c-pos" : "c-neg", 3) : "", tDot(X(c.delta * k), ok ? "c-pos" : "c-neg", 4.5)], 26);
  };
  const stateTxt = { need_run: `${mnt(CH)} not run`, need_baseline: `${PV ? mnt(PV) : "comparator"} not run`, no_comparator: "no comparator", needs_review: "needs a person" };
  const rungs = L.map((rg, i) => {
    const checks = rg.checks.map(c => {
      const r = RS[c.slice] || { slice: c.slice, scale: c.scale || "binary", n: c.n, unit: c.unit, metric: c.metric };
      const e = { label: `${rg.rung} · ${c.slice}`, slice: c.slice, n: c.n, src: `ladder rule ${c.ref}`, note: c.delta != null ? `${rule(c)} · observed ${dl(c.delta, r)} · CI ${ciTxt(c, r)} · ${c.wins} better / ${c.losses} worse${c.cand_runs ? ` · ${c.cand_runs} vs ${c.base_runs ?? "?"} runs pooled` : ""}` : stateTxt[c.state] || c.state, runs: [c.cand_task, c.base_task].filter(Boolean).length ? [c.cand_task, c.base_task].filter(Boolean) : RS[c.slice] ? runIds(RS[c.slice]) : [] };
      return `<div class="chk"><div class="rl">${esc(short(c.slice))} · ${rule(c)}</div>
      <div class="ob">${c.delta != null ? `${isBin(r) && c.cand != null ? ev(NC(c.cand * c.n) + " vs " + NC(c.base * c.n), e) + " · " : ""}<b class="${c.state === "pass" ? "pos" : "neg"}">${ev(dl(c.delta, r), e)}</b> ${c.state === "pass" ? '<span class="pos">✓</span>' : '<span class="neg">✗</span>'}${c.noisy ? ' <span class="warn">noisy</span>' : ""}` : `<span class="warn">${esc(stateTxt[c.state] || c.state)}</span>`}</div>${mini(c)}</div>`;
    }).join("") || `<div class="chk"><div class="ob faint">no slice to check</div></div>`;
    const cls = rg.status === "pass" ? "champion" : rg.status === "fail" ? "rejected" : rg.status === "pending" ? "candidate" : "historical";
    return `<div class="rung"><div class="rh"><b>${i + 1} · ${esc(rg.rung)}</b><span class="st ${cls}">${esc(rg.status)}</span></div>${checks}</div>`;
  }).join("");
  const vsL = D.promotion ? D.promotion.replaced : PV;
  return `<div class="ladder" style="--cols:${Math.min(4, L.length)}">${rungs}</div>
  <div class="leg"><span><i style="background:var(--positive)"></i>observed Δ and 90% CI</span><span><i style="background:var(--negative);opacity:.35"></i>fails below the dashed threshold</span><span>vs ${(vsL ? mn(vsL) : "—")}</span>${D.promotion ? `<span>as promoted ${dt(D.promotion.t)}</span>` : ""}</div>
  ${D.baseline.need.length ? `<div class="after"><div class="stp"><div class="k">baseline</div>${D.baseline.have.length} slices have runs of ${mn(CH)} · missing ${D.baseline.need.map(x => `<code>${esc(short(x))}</code>`).join(", ")}</div></div>` : ""}`;
});

/* ================= 06 flips ================= */
section("flips", () => {
  const can = R.filter(r => r.cells && r.cells.b);
  if (!can.length) return `<div class="empty">No compatible current per-ID comparison of ${mn(CH)} and ${(PV ? mn(PV) : "a comparator")}. ${D.promotion ? `The <a href="#gates">frozen promotion gates from ${dt(D.promotion.t)}</a> retain their historical evidence.` : ""}</div>`;
  let cur = can[0].slice, hide = new Set();
  const LAB = { fix: "fixed", brk: "broken", ww: "both wrong", rr: "both right", na: "not in both" }, COL = { fix: "f-pos", brk: "f-neg", ww: "f-ww", rr: "f-rr", na: "f-track" };
  const ORD = { fix: 0, brk: 1, ww: 2, rr: 3, na: 4 };
  const cells = r => r.ids.map((id, i) => {
    const c = r.cells.m[i], b = r.cells.b[i];
    if (c == null || b == null) return { id, c, b, o: "na" };
    if (isBin(r)) { const a = c >= .5, p = b >= .5; return { id, c, b, o: a && !p ? "fix" : p && !a ? "brk" : a ? "rr" : "ww" }; }
    const d = (c - b) * (D.project.higher_is_better ? 1 : -1); return { id, c, b, o: d > 0 ? "fix" : d < 0 ? "brk" : "rr" };
  });
  const labs = r => isBin(r) ? LAB : { ...LAB, fix: "better", brk: "worse", rr: "same", ww: "—" };
  let CELLS = [];
  const draw = () => {
    const r = RS[cur], all = cells(r).sort((a, b) => ORD[a.o] - ORD[b.o]); CELLS = all;
    const w = $("#grid").clientWidth || 700, cols = Math.max(10, Math.min(60, Math.floor(w / 14))), cs = 12, gap = 2, W = cols * (cs + gap);
    const H = Math.ceil(all.length / cols) * (cs + gap);
    const out = all.map((c, i) => `<rect data-i="${i}" x="${(i % cols) * (cs + gap)}" y="${Math.floor(i / cols) * (cs + gap)}" width="${cs}" height="${cs}" rx="2" class="${COL[c.o]}" style="${hide.has(c.o) ? "opacity:.12" : ""}"/>${c.c > 0 && c.c < 1 && isBin(r) ? `<circle cx="${(i % cols) * (cs + gap) + cs / 2}" cy="${Math.floor(i / cols) * (cs + gap) + cs / 2}" r="2" style="fill:var(--surface)" pointer-events="none"/>` : ""}`).join("");
    $("#grid").innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="Every id on ${esc(cur)}: fixed, broken, both right, both wrong">${out}</svg>`;
    const tot = {}; all.forEach(c => tot[c.o] = (tot[c.o] || 0) + 1); const L2 = labs(r);
    $("#fleg").innerHTML = Object.keys(ORD).filter(o => tot[o]).map(o => `<button data-o="${o}" class="${hide.has(o) ? "dim" : ""}"><i style="background:${{ fix: "var(--positive)", brk: "var(--negative)", ww: "var(--cell-ww)", rr: "var(--cell-rr)", na: "var(--pill-neutral-bg)" }[o]}"></i>${L2[o]} · <b>${N0(tot[o])}</b></button>`).join("") + (isBin(r) && r.runs > 1 && all.some(c => c.c > 0 && c.c < 1) ? `<span><i style="background:var(--surface);border:1px solid var(--control);border-radius:50%"></i>differs across runs</span>` : "");
    $("#fsum").innerHTML = `<dt>net</dt><dd>${ev((tot.fix || 0) + " − " + (tot.brk || 0) + " = " + sgn((tot.fix || 0) - (tot.brk || 0), 0), evPair(r, r.vs))} ids on ${esc(r.slice)}</dd><dt>flaky</dt><dd>${all.filter(c => c.c > 0 && c.c < 1).length} ids where ${mn(CH)} differs across its ${r.runs} runs</dd>`;
  };
  setTimeout(() => {
    draw();
    $("#fmode").onclick = e => { const b = e.target.closest("button"); if (!b) return; cur = b.dataset.m; $$("#fmode button").forEach(x => x.classList.toggle("on", x === b)); draw(); };
    $("#fleg").onclick = e => { const b = e.target.closest("button[data-o]"); if (!b) return; const o = b.dataset.o; hide.has(o) ? hide.delete(o) : hide.add(o); draw(); };
    const tip = $("#tip"), g = $("#grid");
    g.addEventListener("mousemove", e => { const el = e.target.closest("rect[data-i]"); if (!el) { tip.style.display = "none"; return; } const c = CELLS[+el.dataset.i], r = RS[cur];
      tip.textContent = `${c.id}\n${labs(r)[c.o]}\nthis ${c.c == null ? "—" : isBin(r) ? (r.runs > 1 ? "right in " + Math.round(c.c * r.runs) + " of " + r.runs + " runs" : c.c >= .5 ? "right" : "wrong") : num(c.c)}\nbefore ${c.b == null ? "—" : isBin(r) ? (c.b >= .5 ? "right" : "wrong") : num(c.b)}`;
      tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 12, innerWidth - 240) + "px"; tip.style.top = e.clientY + 14 + "px"; });
    g.addEventListener("mouseleave", () => tip.style.display = "none");
    g.addEventListener("click", e => { const el = e.target.closest("rect[data-i]"); if (!el) return; const c = CELLS[+el.dataset.i], r = RS[cur];
      openPop(el, { v: labs(r)[c.o], label: "Example " + c.id, slice: r.slice, hash: r.hash, n: r.n, runs: runIds(r), src: "rows.jsonl, mean per id", note: `this ${c.c == null ? "—" : num(c.c, 3)} over ${r.runs} runs · before ${c.b == null ? "—" : num(c.b, 3)}` }); });
    let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(draw, 150); });
  });
  return `<div class="ctl"><div class="seg" id="fmode">${can.slice(0, 12).map((r, i) => `<button class="${i ? "" : "on"}" data-m="${esc(r.slice)}">${esc(short(r.slice))} · ${N0(r.n)}</button>`).join("")}</div></div>
  <div class="fig" id="grid"></div><div class="leg" id="fleg"></div><dl class="f" id="fsum" style="margin-top:12px"></dl>`;
});

/* ================= 07 failures ================= */
section("failures", () => {
  const G = D.gallery;
  if (!G.length) return `<div class="empty">No hills in the ledger.</div>`;
  const shared = G.filter(h => h.share && h.share.of);
  let bar = "";
  const of = shared[0]?.share.of;
  if (shared.length > 1 && shared.every(h => h.share.of === of)) {
    const W = 800, cs = ["var(--chart-1)", "var(--chart-2)", "var(--chart-3)", "var(--accent)", "var(--warning)"]; let x = 0;
    const other = Math.max(0, of - shared.reduce((a, h) => a + h.share.count, 0));
    bar = `<div class="fig"><svg viewBox="0 0 ${W} 62" role="img" aria-label="Errors split by hill"><text class="t-f" x="0" y="11">${N0(of)} ${esc((shared[0].share.of_what || "errors").split(";")[0].slice(0, 90))}</text>`;
    [...shared.map((h, i) => [h.name, h.share.count, cs[i % cs.length]]), ["other", other, "var(--control)"]].forEach(([k, n, c]) => { const w = n / of * W; if (w <= 0) return; bar += `<rect x="${x}" y="20" width="${Math.max(1, w - 1)}" height="28" rx="3" style="fill:${c}"><title>${esc(k)}: ${n} of ${of}</title></rect><text x="${x + 6}" y="38" style="fill:${k === "other" ? "var(--text)" : "#fff"};font-size:11.5px" class="t-b">${w > 7.5 * (k.length + String(n).length + 2) ? esc(k) + " " + n : w > 26 ? n : ""}</text>`; x += w; });
    bar += `</svg></div>`;
  }
  const card = h => {
    const t = RS[h.target];
    const scoreLine = h.score != null ? ev(t && isBin(t) ? cnt(h.score, t) + " / " + N0(t.n) : sc(h.score, t), t ? evRes(t) : { label: h.target }) + (h.vs ? ` · <span class="${h.vs.lo > 0 ? "pos" : h.vs.hi < 0 ? "neg" : "faint"}">${dl(h.vs.delta, t)}</span>` : "") : '<span class="warn">not run</span>';
    const stc = h.status === "climbed" ? "pos" : h.status === "open" ? "warn" : "faint";
    return `<div class="hc" id="hill-${esc(h.name)}"><div class="kick">${esc(h.name)} · <span class="${stc}">${esc(h.status)}</span>${h.mine ? " · this model's hill" : ""}</div><div class="ht">${esc((h.title || h.name).replace(/\s*\[.*\]$/, ""))}</div>
    ${h.symptom ? `<div class="sym">${esc(h.symptom)}</div>` : ""}
    <dl class="f" style="font-size:12.5px">${h.share ? `<dt>share</dt><dd>${ev(h.share.count + " of " + h.share.of, { label: "Share", slice: h.target, n: h.share.of, src: ".research/hills.json › " + h.name + ".share", note: h.share.of_what })}</dd>` : ""}
    <dt>target</dt><dd><code>${esc(short(h.target))}</code>${t ? " · n " + N0(t.n) : ""}</dd><dt>this</dt><dd>${scoreLine}</dd>${h.base_score != null ? `<dt>before</dt><dd>${t && isBin(t) ? cnt(h.base_score, t) + " / " + N0(t.n) : sc(h.base_score, t)}</dd>` : ""}${h.measure ? `<dt>measure</dt><dd>${esc(h.measure)}</dd>` : ""}</dl>
    ${h.examples.map(x => `<div class="exm">${x.input ? `<div class="q">${esc(x.input)}</div>` : ""}${x.wrong ? `<div class="row"><span class="neg">wrong</span><code>${esc(x.wrong)}</code></div>` : ""}${x.right ? `<div class="row"><span class="pos">right</span><code>${esc(x.right)}</code></div>` : ""}${x.why ? `<div class="why">${esc(x.why)}</div>` : ""}</div>`).join("")}</div>`;
  };
  const still = MAIN && MAIN.cells && isBin(MAIN) ? MAIN.ids.map((id, i) => ({ id, c: MAIN.cells.m[i], b: MAIN.cells.b?.[i] })).filter(x => x.c != null && x.c < .5).sort((a, b) => a.c - b.c) : [];
  setTimeout(() => { const ic = $("#still"); if (ic) ic.onclick = e => { const b = e.target.closest("button"); if (!b) return; const x = still[+b.dataset.i]; openPop(b, { v: "wrong", label: "Example " + x.id, slice: MAIN.slice, hash: MAIN.hash, n: MAIN.n, runs: MAIN.run_ids || [MAIN.task], src: "rows.jsonl, mean per id", note: `this right in ${Math.round(x.c * MAIN.runs)} of ${MAIN.runs} runs · before ${x.b == null ? "—" : x.b >= .5 ? "right" : "wrong"}` }); }; });
  const first = G.slice(0, 9), rest = G.slice(9);
  return `${bar}<div class="hills">${first.map(card).join("")}</div>${rest.length ? `<details class="print-open"><summary class="more-btn" style="display:inline-block;cursor:pointer">${rest.length} more hills</summary><div class="hills" style="margin-top:12px">${rest.map(card).join("")}</div></details>` : ""}
  ${still.length ? `<h3>still wrong on ${esc(short(MAIN.slice))} · ${N0(still.length)} of ${N0(MAIN.n)}${MAIN.runs > 1 ? ` · wrong in every run unless marked` : ""}</h3><div class="idchips" id="still">${still.slice(0, 240).map((x, i) => `<button data-i="${i}">${esc(String(x.id).slice(0, 10))}${MAIN.runs > 1 && Math.round(x.c * MAIN.runs) > 0 ? " · right " + Math.round(x.c * MAIN.runs) + "/" + MAIN.runs : ""}${x.b >= .5 ? " · was right" : ""}</button>`).join("")}${still.length > 240 ? `<span class="faint">+${still.length - 240}</span>` : ""}</div>` : ""}`;
});

/* ================= 08 lineage ================= */
section("lineage", () => {
  const chain = D.lineage;
  // the strip's slice: the one most of this family ran (ties: the main slice, then a full one), not a sparse hill target
  const fam = new Set([...chain.map(s => s.name), ...chain.flatMap(s => s.siblings.map(v => v.name)), ...D.children.map(v => v.name)]);
  const cover = r => (r.field || []).filter(f => f[1] != null && fam.has(f[0])).length;
  const rank = r => r.slice === D.main ? 0 : r.kind === "full" ? 1 : 2;
  const ref = [...R].sort((a, b) => cover(b) - cover(a) || rank(a) - rank(b) || (b.n || 0) - (a.n || 0))[0] || null;
  const F = Object.fromEntries((ref?.field || []).map(f => [f[0], f]));
  const field = Object.fromEntries((ref?.field || []).map(f => [f[0], f[1]]));
  const evM = k => ({ label: mnt(k) + " on " + ref.slice, slice: ref.slice, hash: ref.hash, n: ref.n, runs: F[k]?.[3] || [], src: `mean per id over ${(F[k]?.[3] || []).length} complete run${(F[k]?.[3] || []).length === 1 ? "" : "s"}` });
  const spine = chain.map((s, i) => `${i ? '<span class="ar">→</span>' : ""}<div class="nd${s.name === CH ? " me" : ""}"><b title="${esc(s.name)}">${esc(mnt(s.name))}</b>${field[s.name] != null ? ev(sc(field[s.name], ref), evM(s.name)) + " · " : ""}${stPill(s.status)}</div>`).join("");
  const vals = Object.entries(field).filter(([k, v]) => v != null && fam.has(k)).map(e => e[1]), lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
  const X = v => .02 + (hi > lo ? (v - lo) / (hi - lo) : .5) * .96;
  const refs = [[field[PV], "c-mut"], [field[CH], "c-pos"]].filter(x => x[0] != null);
  const dotC = st => st === "champion" ? "c-pos" : st === "rejected" ? "c-neg" : st === "candidate" ? "c-warn" : "c-mut";
  const row = v => { const s = field[v.name]; return `<div class="lrow" data-k="${esc(v.name)}"><div class="nm" title="${esc(v.name)}">${esc(mnt(v.name))}</div>${stPill(v.status)}
    ${trk([tLine(), ...refs.map(([r, c]) => tMark(X(r), c)), s != null ? tDot(X(s), dotC(v.status), 5, mnt(v.name) + " · " + sc(s, ref)) : `<span class="ttxt">no run</span>`])}</div>
    <div class="ldet"><dl class="f" style="font-size:12.5px">${v.title ? `<dt>title</dt><dd>${esc(v.title)}</dd>` : ""}<dt>id</dt><dd class="mono">${esc(v.name)}</dd>${s != null ? `<dt>${esc(short(ref.slice))}</dt><dd>${ev(sc(s, ref), evM(v.name))}</dd>` : ""}${v.hill ? `<dt>hill</dt><dd>${esc(v.hill)}</dd>` : ""}<dt>change</dt><dd>${esc(v.change || "—")}</dd>${v.reason ? `<dt>${v.status === "rejected" ? "rejected" : "reason"}</dt><dd class="${v.status === "rejected" ? "neg" : ""}">${esc(v.reason)}</dd>` : ""}</dl></div>`; };
  const ranFirst = list => [...list].sort((a, b) => (field[a.name] == null) - (field[b.name] == null));
  const groups = chain.filter(s => s.parent).map(s => ({ parent: s.parent, kept: s, sib: s.siblings }));
  if (D.children.length) groups.push({ parent: CH, kept: null, sib: D.children });
  const counts = {}; groups.forEach(g => g.sib.forEach(v => counts[v.status] = (counts[v.status] || 0) + 1));
  const axis = vals.length ? `<div class="lrow" style="cursor:default"><div class="nm faint">${esc(short(ref.slice))} · n ${N0(ref.n)}</div><div></div><div class="ends"><span>${sc(lo, ref)}</span><span>${sc(hi, ref)}</span></div></div>` : "";
  const tl = D.decisions.slice().reverse(), TLN = 12, kinds = {};
  tl.forEach(d => kinds[d.kind] = (kinds[d.kind] || 0) + 1);
  const tlRow = d => `<div><span class="k">${dt(d.t)}</span><span>${stPill(d.kind)}</span><span>${d.model ? mn(d.model) : esc(d.goal || "")}${d.reason || d.note ? ` <span class="muted">· ${esc(d.reason || d.note)}</span>` : ""}</span></div>`;
  setTimeout(() => { const l = $(".lin"); if (l) l.onclick = e => { if (e.target.closest(".ev")) return; const r = e.target.closest(".lrow[data-k]"); if (r) r.classList.toggle("open"); }; });
  return `${ref ? `<div class="cap" style="margin:0 0 8px">scores on <code>${esc(short(ref.slice))}</code>, n ${N0(ref.n)} · ${cover(ref)} of ${fam.size} models in this family ran it</div>` : ""}<div class="spine">${spine}</div>
  ${Object.keys(counts).length ? `<div class="facts" style="margin-bottom:10px">${Object.entries(counts).map(([k, n]) => `<span class="st ${esc(k)}">${n} ${esc(k)}</span>`).join("")}</div>` : ""}
  <div class="lin">${axis}
  ${groups.map(g => `<div class="grp">tried after ${mn(g.parent)}${g.kept ? ` · kept ${mn(g.kept.name)}` : " · this model"}</div>${g.kept ? row(g.kept) : ""}${ranFirst(g.sib).map(row).join("") || '<div class="empty">no other tries</div>'}`).join("")}
  </div><div class="leg"><span><i style="background:var(--control)"></i>dashed: before</span><span><i style="background:var(--positive)"></i>dashed: this</span></div>
  ${tl.length ? `<h3>decisions · ${N0(tl.length)}</h3><div class="facts" style="margin-bottom:8px">${Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span class="st ${esc(k)}">${n} ${esc(k)}</span>`).join("")}</div>
  <div class="tl">${tl.slice(0, TLN).map(tlRow).join("")}</div>${tl.length > TLN ? `<details class="noprint"><summary class="more-btn" style="display:inline-block;cursor:pointer">${tl.length - TLN} earlier</summary><div class="tl">${tl.slice(TLN).map(tlRow).join("")}</div></details>` : ""}` : ""}`;
});

/* ================= 09 cost ================= */
section("cost", () => {
  const ls = R.filter(r => r.latency_p50 != null);
  const cs = R.filter(r => r.cost != null);
  if (!ls.length && !cs.length) return `<div class="empty">No run of ${mn(CH)} logged latency or cost.</div>`;
  let s = "";
  if (ls.length) {
    const hi = Math.max(...ls.flatMap(r => [r.latency_p95 ?? r.latency_p50, r.base?.latency_p95 ?? r.base?.latency_p50 ?? 0])) * 1.1;
    const W = FW("cost"), nar = W < 560, L = nar ? 96 : 200, X = v => L + Math.min(v, hi) / hi * (W - L - (nar ? 70 : 110)), rh = 40, st = niceStep(hi / (nar ? 3 : 6));
    s = `<svg viewBox="0 0 ${W} ${ls.length * rh + 34}" width="${W}" role="img" aria-label="Latency p50 and p95">`;
    for (let v = 0; v <= hi; v += st) s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="0" y2="${ls.length * rh}"/><text class="t-f" x="${X(v)}" y="${ls.length * rh + 14}" text-anchor="middle">${+v.toFixed(2)}s</text>`;
    s += `<text class="t-f" x="${W - 30}" y="${ls.length * rh + 30}" text-anchor="end">s per example · dot p50, bar end p95</text>`;
    ls.forEach((r, i) => {
      const y = 12 + i * rh; s += `<text x="${L - 10}" y="${y + 10}" text-anchor="end">${esc(short(r.slice).slice(0, nar ? 12 : 28))}</text>`;
      [[r.base, 0, "s-mut", "f-faint"], [r, 14, "s-acc", "f-acc"]].forEach(([x, dy, sc2, fc]) => { if (!x || x.latency_p50 == null) return; const p95 = x.latency_p95 ?? x.latency_p50;
        s += `<line class="${sc2}" stroke-width="4" stroke-linecap="round" x1="${X(x.latency_p50)}" x2="${X(p95)}" y1="${y + dy}" y2="${y + dy}" opacity=".55"/><circle class="${fc}" cx="${X(x.latency_p50)}" cy="${y + dy}" r="4.5"/><text class="t-f" x="${X(p95) + 6}" y="${y + dy + 4}">${x.latency_p50.toFixed(1)} / ${p95.toFixed(1)}</text>`; });
    });
    s += `</svg>`;
  }
  return `${s ? `<div class="fig">${s}<div class="leg"><span><i style="background:var(--faint)"></i>${(PV ? mn(PV) : "before")}</span><span><i style="background:var(--accent)"></i>${mn(CH)}</span></div></div>` : ""}
  ${costTable()}`;
});

function costTable() {
  // only the columns some run filled in
  const cols = [["p50", r => r.latency_p50, secs], ["p95", r => r.latency_p95, secs], ["before p50", r => r.base?.latency_p50, secs],
    ["$ / example", r => r.cost, v => "$" + num(v, 3)], ["before $", r => r.base?.cost, v => "$" + num(v, 3)], ["$ total", r => r.cost_total, v => "$" + num(v, 4)]].filter(([, g]) => R.some(r => g(r) != null));
  return `<div class="tw"><table><thead><tr><th>slice</th>${cols.map(([h]) => `<th class="n">${h}</th>`).join("")}</tr></thead><tbody>
  ${R.map(r => `<tr><td class="id">${esc(short(r.slice))}</td>${cols.map(([, g, f]) => `<td class="n">${g(r) == null ? "—" : f(g(r))}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}

/* ================= 10 not known ================= */
section("unknown", () => {
  const U = D.unknown;
  const text = u => ({
    not_run: [`not run`, "", `<code>${esc(u.slice)}</code>${u.roles?.length ? " · " + esc(u.roles.join(", ")) : ""}`],
    noisy: [`noisy`, "", `<code>${esc(short(u.slice))}</code>: 90% CI ${pts(u.lo)} to ${pts(u.hi)} pts spans 0, n ${N0(u.n)}`],
    errors: [`errors`, "neg", `<code>${esc(short(u.slice))}</code>: ${N0(u.errors)} of ${N0(u.n)} errored, scored 0`],
    no_pair: [`no pair`, "mut", `<code>${esc(short(u.slice))}</code>: no matching current harness comparison with ${mn(u.base)}`],
    need_run: [`gate`, "", `rung ${esc(u.rung)} needs a run of ${mn(CH)} on <code>${esc(short(u.slice))}</code>`],
    need_baseline: [`gate`, "", `rung ${esc(u.rung)} needs a run of ${(PV ? mn(PV) : "the comparator")} on <code>${esc(short(u.slice))}</code>`],
    no_cost: [`cost`, "mut", "no run logged cost"],
    no_latency: [`latency`, "mut", "no run logged latency"],
    goal_open: [`goal`, "", `${esc(u.title || u.goal)} not met`],
    pending_child: [`waiting`, "mut", `${mn(u.model)} is ${esc(u.status)}`]
  }[u.kind] || [u.kind, "mut", esc(JSON.stringify(u))]);
  const sl = [...R.map(r => r.slice), ...D.baseline.need];
  const mk = v => v === 2 ? '<span class="ok">✓</span>' : v === 1 ? '<span class="part">~</span>' : '<span class="no">✗</span>';
  const mx = sl.map(s => { const r = RS[s]; return `<tr><td class="id">${esc(short(s))}</td><td>${mk(r ? 2 : 0)} <span class="faint">${r?.runs || 0}</span></td><td>${mk(r?.base ? 2 : 0)} <span class="faint">${r?.base?.runs || 0}</span></td><td>${mk(r?.vs ? (r.vs.noisy ? 1 : 2) : 0)}</td><td>${mk(r ? (r.runs > 1 ? 2 : 1) : 0)}</td></tr>`; }).join("");
  const LIM = 40;
  return `<div class="tw"><table class="mx"><thead><tr><th>slice</th><th>this runs</th><th>before runs</th><th>paired CI clear of 0</th><th>repeated</th></tr></thead><tbody>${mx}</tbody></table></div>
  <h3>${U.length} open points</h3><div class="unk">${U.slice(0, LIM).map(u => { const [k, c, t] = text(u); return `<div><b class="${c}">${k}</b><span>${t}</span></div>`; }).join("")}${U.length > LIM ? `<div><b class="mut">more</b><span>${U.length - LIM} more</span></div>` : ""}</div>`;
});

/* ================= 11 reproduce ================= */
section("reproduce", () => {
  const g = D.goals.filter(x => x.model === CH);
  const cmd = `<span class="cmt"># where ${esc(mnt(CH))} stands, and the next run</span>
arx gate ${esc(CH)}${g.map(x => `\narx goal status ${esc(x.name)}`).join("")}
<span class="cmt"># run it on every slice it lacks${D.baseline.need.length ? " (" + D.baseline.need.length + ")" : ""}</span>
arx baseline ${esc(CH)} --dry-run`;
  const spec = Object.fromEntries(D.spec);
  return `<div class="cb"><pre id="c1">${cmd}</pre><button class="cp" data-c="c1">Copy</button></div>
  ${D.spec.length ? `<h3>specification, as JSON</h3><div class="cb"><pre id="c2">${esc(JSON.stringify(spec, null, 2))}</pre><button class="cp" data-c="c2">Copy</button></div>` : ""}
  <h3>every run behind this paper</h3>
  <div class="tw"><table><thead><tr><th>slice</th><th>hash</th><th>run id</th><th>command</th><th>ended</th></tr></thead><tbody>
  ${D.runs.map(t => `<tr><td class="id">${esc(short(t.slice))}</td><td class="id">${esc(t.hash)}</td><td class="id">${esc(t.task)}</td><td class="mono" style="word-break:break-all;font-size:12px">${esc(t.command || "—")}</td><td class="id">${dt(t.ended)}</td></tr>`).join("")}
  </tbody></table></div>`;
});

/* charts are drawn at their section's width: redraw them when that width changes a lot (rotate, resize) */
let lastW = FW("results"), rzT;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { const w = FW("results"); if (Math.abs(w - lastW) < 40 || matchMedia("print").matches) return; lastW = w; ["claim", "results", "cost"].forEach(id => section(id, DRAW[id])); }, 200); });

/* ---------------- popover ---------------- */
const pop = $("#pop"); let popFor = null;
function openPop(anchor, e) {
  if (!e) return;
  $$(".ev.open").forEach(x => x.classList.remove("open")); anchor.classList?.add("open"); popFor = anchor;
  const rows = [["slice", e.slice], ["hash", e.hash], ["n", e.n != null ? N0(e.n) : null], ["source", e.src], ["detail", e.note], ...(e.extra || [])].filter(r => r[1] != null && r[1] !== "");
  const runs = [...new Set((e.runs || []).filter(Boolean))];
  pop.innerHTML = `<button class="x" aria-label="Close">×</button><div class="pv">${esc(e.v)}</div><div class="pl">${esc(e.label || "")}</div>
  <dl class="f">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}${runs.length ? `<dt>runs · ${runs.length}</dt><dd style="max-height:9.5em;overflow:auto">${runs.map(id => SNAP ? `<div>${esc(id)}</div>` : `<div><a href="${BASE}/#task/${enc(id)}" target="_top">${esc(id)}</a></div>`).join("")}</dd>` : ""}</dl>
  <div class="pa"><button class="tb" id="pCopy">Copy evidence</button></div>`;
  pop.classList.add("show");
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(12, r.left), innerWidth - pw - 12), top = r.bottom + 8; if (top + ph > innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  $("#pCopy").onclick = () => copy([e.v, e.label, ...rows.map(([k, v]) => k + ": " + v), ...runs.map(id => "run: " + id)].join("\n"), "Evidence copied");
  pop.querySelector(".x").onclick = closePop;
}
function closePop() { pop.classList.remove("show"); $$(".ev.open").forEach(x => x.classList.remove("open")); popFor = null; }
document.addEventListener("click", e => {
  const b = e.target.closest(".ev"); if (b) { e.stopPropagation(); if (popFor === b) return closePop(); return openPop(b, EV[b.dataset.ev]); }
  if (!e.target.closest("#pop") && !e.target.closest("#grid rect") && !e.target.closest(".idchips button")) closePop();
});
addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
// the dashboard's keys (keys.js): j / k through the sections, h or Backspace back to the model, g + letter a page, ? the sheet
if (!SNAP) {
  const rl = document.createElement("nav"); rl.id = "rail"; rl.hidden = true;
  rl.innerHTML = ["overview", "learn", "workbench", "goals", "questions", "models", "hills", "papers", "slices", "archive"].map(k => `<a href="${BASE}/#${k}"></a>`).join("");
  document.body.append(rl);
  const ks = document.createElement("script"); ks.src = BASE + "/keys.js"; document.body.append(ks);
}
addEventListener("scroll", () => { if (popFor && innerWidth > 560) closePop(); }, { passive: true });

/* ---------------- toolbar ---------------- */
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600); };
async function copy(text, msg) { try { await navigator.clipboard.writeText(text); } catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch {} ta.remove(); } toast(msg); }
let cur = "claim";
const linkTo = id => location.href.split("#")[0] + "#" + id;
$("#bLink").onclick = () => copy(linkTo(cur), "Link to " + SECS.find(s => s[0] === cur)[1] + " copied");
$$(".anc").forEach(b => b.onclick = () => { copy(linkTo(b.dataset.anchor), "Link copied"); history.replaceState(null, "", "#" + b.dataset.anchor); });
$$(".cp").forEach(b => b.onclick = () => copy($("#" + b.dataset.c).textContent, "Copied"));
$("#bPrint").onclick = () => print();
// in print, folded hill cards open (Ctrl+P too); lineage details print only where someone opened them
let printOpened = [];
addEventListener("beforeprint", () => { printOpened = $$("details.print-open:not([open])"); printOpened.forEach(d => d.open = true); });
addEventListener("afterprint", () => { printOpened.forEach(d => d.open = false); printOpened = []; });
$("#bTheme").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("arx-theme", r.dataset.theme); } catch {} };
try { const t = localStorage.getItem("arx-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#bDown").onclick = () => {
  const doc = document.documentElement.cloneNode(true);
  doc.removeAttribute("data-theme");
  [...doc.querySelector("head").children].forEach(n => { if (!n.hasAttribute("data-keep")) n.remove(); });
  [...doc.querySelector("body").children].forEach(n => { if (!n.hasAttribute("data-keep")) n.remove(); });
  doc.querySelector("#app").innerHTML = '<div id="load">loading…</div>';
  doc.querySelector("#snap").textContent = JSON.stringify(D).replace(/</g, "\\u003c");
  const out = "<!doctype html>\n" + doc.outerHTML;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out], { type: "text/html" }));
  a.download = `${CH.replace(/[^\w.+-]+/g, "_")}-paper-${new Date(D.generated * 1000).toISOString().slice(0, 10)}.html`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Saved · ${(out.length / 1024).toFixed(0)} KB, no fetches`);
};
if (!SNAP) {
  const go = (m, vs) => { const u = `${BASE}/reference/${enc(m)}${vs ? "?vs=" + enc(vs) : ""}${location.hash}`; location.href = u; };
  $("#pickM").onchange = e => go(e.target.value, "");
  $("#pickB").onchange = e => go(CH, e.target.value);
}

/* ---------------- scroll spy ---------------- */
const spy = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { cur = e.target.id; $$("#toc a, #chips a").forEach(a => a.classList.toggle("on", a.dataset.s === cur)); const c = $(`#chips a[data-s="${cur}"]`); const ch = $("#chips"); if (c && ch.offsetParent) ch.scrollTo({ left: c.offsetLeft - ch.clientWidth / 2 + c.offsetWidth / 2, behavior: "smooth" }); } }); }, { rootMargin: "-80px 0px -65% 0px" });
$$("section.s").forEach(s => spy.observe(s));
document.title = `${mnt(CH)} · paper`;
if (location.hash && location.hash.length > 1) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) requestAnimationFrame(() => t.scrollIntoView()); }
if (SNAP) $(".crumb").insertAdjacentHTML("beforeend", ` · <span class="warn">snapshot ${dt(D.generated)}</span>`);
})();
</script>
</body></html>
