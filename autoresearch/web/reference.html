<!doctype html>
<html lang="en"><head data-keep><meta charset="utf-8" data-keep><meta name="viewport" content="width=device-width,initial-scale=1" data-keep>
<title data-keep>Paper</title>
<style data-keep>
:root{--ground:#f2f5f8;--surface:#fff;--raised:#f5f7f9;--active:#e4e9ee;--border:#e3e7eb;--rule:#eef1f4;--control:#cdd3d9;
 --text:#131416;--muted:#5b6168;--faint:#6f767d;--accent:#1b6c80;--accent-soft:#e3f0f3;--primary:#16181a;--on-primary:#fff;
 --positive:#1e7b4f;--negative:#c4242a;--warning:#92400e;--chart-1:#1b6c80;--chart-2:#2f70bb;--chart-3:#a86f0c;--chart-4:#7650b8;--grid:#e9edf0;
 --pill-positive-bg:#dcfae5;--pill-negative-bg:#ffedea;--pill-warning-bg:#fff5db;--pill-neutral-bg:#ebeef1;
 --cell-rr:#cfd6dc;--cell-ww:#6f767d;
 --radius-card:8px;--radius-control:6px;--radius-chip:4px;
 --font:"IBM Plex Sans",Inter,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --ground:#0c0f12;--surface:#13171b;--raised:#1a1f24;--active:#232a31;--border:#232a30;--rule:#1c2227;--control:#3a434b;
 --text:#eef1f3;--muted:#a3abb3;--faint:#8c959d;--accent:#5cb8cc;--accent-soft:#163038;--primary:#eef1f3;--on-primary:#0c0f12;
 --positive:#4cc38a;--negative:#f07575;--warning:#e3a84f;--chart-1:#5cb8cc;--chart-2:#6aa1e6;--chart-3:#d9a441;--chart-4:#a68be6;--grid:#222930;
 --pill-positive-bg:#14291e;--pill-negative-bg:#2e1a1d;--pill-warning-bg:#2b2215;--pill-neutral-bg:#222930;
 --cell-rr:#2c343b;--cell-ww:#8c959d;color-scheme:dark}}
:root[data-theme="dark"]{
 --ground:#0c0f12;--surface:#13171b;--raised:#1a1f24;--active:#232a31;--border:#232a30;--rule:#1c2227;--control:#3a434b;
 --text:#eef1f3;--muted:#a3abb3;--faint:#8c959d;--accent:#5cb8cc;--accent-soft:#163038;--primary:#eef1f3;--on-primary:#0c0f12;
 --positive:#4cc38a;--negative:#f07575;--warning:#e3a84f;--chart-1:#5cb8cc;--chart-2:#6aa1e6;--chart-3:#d9a441;--chart-4:#a68be6;--grid:#222930;
 --pill-positive-bg:#14291e;--pill-negative-bg:#2e1a1d;--pill-warning-bg:#2b2215;--pill-neutral-bg:#222930;
 --cell-rr:#2c343b;--cell-ww:#8c959d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--ground);color:var(--text);font:14.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.9em}
a{color:var(--accent)}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.bar .in{flex-wrap:wrap;max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.bar .crumb{font:500 12.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.bar .crumb b{color:var(--text);font-weight:600}
.bar a.crumb{color:inherit;text-decoration:none}.bar a.crumb:hover,.bar a.crumb:hover b{color:var(--accent)}
a.tb{color:inherit;text-decoration:none}
.tb{border:1px solid var(--control);background:var(--surface);border-radius:var(--radius-control);height:30px;padding:0 10px;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tb[hidden]{display:none}
.tb:hover{border-color:var(--accent)}
.tb.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tb svg{width:14px;height:14px}
.chips{display:none;overflow-x:auto;gap:6px;padding:0 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--pill-neutral-bg);color:var(--muted);text-decoration:none}
.chips a.on{background:var(--primary);color:var(--on-primary)}
/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
.toc{position:sticky;top:58px;align-self:start;padding:28px 0;max-height:calc(100vh - 60px);overflow:auto}
.toc a{display:flex;gap:8px;padding:5px 8px;border-radius:var(--radius-control);color:var(--muted);text-decoration:none;font-size:13.5px}
.toc a b{font:500 11.5px var(--mono);color:var(--faint);width:18px;flex:none;padding-top:1px}
.toc a:hover{background:var(--raised);color:var(--text)}
.toc a.on{background:var(--surface);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
main{padding:28px 0 120px;min-width:0}
@media (max-width:999px){.wrap{grid-template-columns:minmax(0,1fr)}.toc{display:none}.chips{display:flex}}
/* header */
.head{margin:0 0 20px}
.kick{font:500 12px var(--mono);color:var(--faint);letter-spacing:.02em}
h1{font:600 26px/1.2 var(--font);margin:6px 0 10px;word-break:break-word}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--pill-neutral-bg);color:var(--muted);white-space:nowrap}
.pill.pos{background:var(--pill-positive-bg);color:var(--positive)}.pill.neg{background:var(--pill-negative-bg);color:var(--negative)}.pill.warn{background:var(--pill-warning-bg);color:var(--warning)}
/* sections */
section.s{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px 22px 22px;margin:0 0 16px;scroll-margin-top:64px}
.s>.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.s>.hd b{font:600 12px var(--mono);color:var(--faint)}
.s>.hd h2{font:600 17px/1.3 var(--font);margin:0;flex:1}
.s>.hd .anc{opacity:0;border:0;background:none;color:var(--faint);font:500 12px var(--mono);padding:2px 6px;border-radius:4px}
.s:hover>.hd .anc,.s>.hd .anc:focus{opacity:1}
.s>.hd .anc:hover{background:var(--raised);color:var(--accent)}
h3{font:600 13px var(--mono);color:var(--faint);margin:22px 0 8px;letter-spacing:.02em}
.fig{margin:0 0 14px}
.fig svg{display:block;width:100%;height:auto;overflow:visible}.fig svg[width]{width:auto;max-width:100%}
.cap{font-size:12.5px;color:var(--muted);margin-top:6px}
/* labelled facts */
dl.f{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
dl.f dt{font:500 12px var(--mono);color:var(--faint);padding-top:2px}
dl.f dd{margin:0;min-width:0;word-break:break-word}
@media (max-width:560px){dl.f{grid-template-columns:minmax(0,1fr);gap:0}dl.f dd{margin-bottom:8px}}
/* evidence numbers */
.ev{border:0;background:none;padding:0 1px;font:inherit;color:inherit;font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--faint);cursor:pointer;border-radius:2px}
.ev:hover,.ev.open{background:var(--accent-soft);color:var(--accent);border-bottom-color:var(--accent)}
.pos{color:var(--positive)}.neg{color:var(--negative)}.warn{color:var(--warning)}.muted{color:var(--muted)}.faint{color:var(--faint)}
/* svg text */
svg text{font-family:var(--font);font-size:12px;fill:var(--text)}
svg .t-m{fill:var(--muted)}svg .t-f{fill:var(--faint);font-family:var(--mono);font-size:11px}
svg .t-b{font-weight:600}svg .t-big{font-size:15px;font-weight:600}
svg .grid{stroke:var(--grid)}svg .axis{stroke:var(--control)}
svg .f-pos{fill:var(--positive)}svg .f-neg{fill:var(--negative)}svg .f-acc{fill:var(--accent)}svg .f-mut{fill:var(--control)}svg .f-rr{fill:var(--cell-rr)}svg .f-ww{fill:var(--cell-ww)}
svg .f-warn{fill:var(--warning)}svg .f-faint{fill:var(--faint)}svg .f-raised{fill:var(--raised)}svg .f-track{fill:var(--pill-neutral-bg)}
svg .s-pos{stroke:var(--positive)}svg .s-acc{stroke:var(--accent)}svg .s-neg{stroke:var(--negative)}svg .s-text{stroke:var(--text)}svg .s-mut{stroke:var(--faint)}
/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font:500 11.5px var(--mono);color:var(--faint);white-space:nowrap;border-bottom-color:var(--border)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.id{font:12px var(--mono);color:var(--muted);white-space:nowrap}
tr.na td{color:var(--faint)}
tr.me td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* pipeline */
.pipe{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-bottom:14px}
.stg{flex:1 1 120px;min-width:0;border:1px solid var(--border);background:var(--raised);border-radius:var(--radius-card);padding:10px 11px;position:relative}
.stg .k{font:500 11px var(--mono);color:var(--faint);margin-bottom:4px}
.stg .v{font-size:13px;font-weight:500;word-break:break-word}
.stg .was{font-size:12px;color:var(--negative);text-decoration:line-through;margin-top:3px}
.stg.chg{border-color:var(--accent);background:var(--accent-soft)}
.stg.chg .k:after{content:" · changed";color:var(--accent)}
.arr{flex:none;width:14px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px}
@media (max-width:700px){.pipe{flex-direction:column}.arr{width:auto;height:14px}.arr span{transform:rotate(90deg)}}
/* seg control */
.seg{display:inline-flex;background:var(--pill-neutral-bg);border-radius:var(--radius-control);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:4px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.leg button{border:0;background:none;padding:2px 4px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.leg button.dim{opacity:.35}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* gate ladder */
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.rung{border:1px solid var(--border);border-radius:var(--radius-card);background:var(--raised);padding:10px 12px}
.rung .rh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px}
.rung .rh b{font-size:14px}
.chk{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.chk:first-of-type{border-top:0;padding-top:0;margin-top:0}
.chk .rl{font:500 11.5px var(--mono);color:var(--faint);word-break:break-word}
.chk .ob{font-size:13px;margin:3px 0 4px}
.chk .trk{margin-top:2px}
@media (max-width:760px){.ladder{grid-template-columns:minmax(0,1fr)}.rung{margin-left:0!important}}
.after{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.after .stp{flex:1 1 200px;border:1px dashed var(--control);border-radius:var(--radius-card);padding:9px 12px;font-size:13px}
.after .stp .k{font:500 11px var(--mono);color:var(--faint)}
/* failure gallery */
.hills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.hills{grid-template-columns:minmax(0,1fr)}}
.hc{border:1px solid var(--border);border-radius:var(--radius-card);padding:12px;background:var(--surface);min-width:0}
.hc .ht{font-weight:600;font-size:14px;margin:4px 0 6px}
.hc .sym{font-size:13px;color:var(--muted);margin-bottom:10px}
.exm{border:1px solid var(--rule);border-radius:var(--radius-control);padding:9px 10px;margin:8px 0 0;background:var(--raised);font-size:13px}
.exm .q{font-weight:500;margin-bottom:6px}
.exm .row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;margin:3px 0;align-items:baseline}
.exm .row span{font:500 11px var(--mono)}
.exm .row code{font-size:12.5px;word-break:break-word}
.exm .why{font-size:12.5px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--border);padding-top:6px}
.idchips{display:flex;flex-wrap:wrap;gap:4px}
.idchips button{font:11.5px var(--mono);border:1px solid var(--border);background:var(--raised);border-radius:4px;padding:2px 6px;color:var(--muted)}
.idchips button:hover{border-color:var(--accent);color:var(--accent)}
/* lineage */
.lin .grp{font:500 11.5px var(--mono);color:var(--faint);padding:10px 0 4px;border-top:1px solid var(--rule)}
.lrow{display:grid;grid-template-columns:minmax(0,210px) 86px minmax(0,1fr);gap:10px;align-items:center;padding:3px 0;cursor:pointer;border-radius:4px}
.lrow:hover{background:var(--raised)}
.lrow .nm{font:12.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ends{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--faint)}
.ldet{display:none;grid-column:1/-1;font-size:13px;padding:6px 10px 10px;border-left:2px solid var(--border);margin:2px 0 6px 4px}
.lrow.open+.ldet{display:block}
@media (max-width:560px){.lrow{grid-template-columns:minmax(0,1fr) 78px}.lrow .trk,.lrow .ends{grid-column:1/-1}}
.st{font-size:11.5px;padding:1px 7px;border-radius:999px;text-align:center;white-space:nowrap}
.st.champion{background:var(--pill-positive-bg);color:var(--positive)}.st.rejected{background:var(--pill-negative-bg);color:var(--negative)}
.st.candidate{background:var(--pill-warning-bg);color:var(--warning)}.st.retired,.st.historical,.st.planned{background:var(--pill-neutral-bg);color:var(--muted)}
.spine{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.spine .nd{border:1px solid var(--border);border-radius:var(--radius-card);padding:7px 10px;background:var(--raised);font-size:12.5px;min-width:0}
.spine .nd b{display:block;font:500 12px var(--mono);word-break:break-all}
.spine .nd.me{border-color:var(--positive);background:var(--pill-positive-bg)}
.spine .ar{color:var(--faint)}
/* matrix */
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left}
.ok{color:var(--positive);font-weight:600}.no{color:var(--negative);font-weight:600}.part{color:var(--warning);font-weight:600}
/* code */
pre{margin:0;background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-control);padding:10px 12px;overflow-x:auto;font:12.5px/1.55 var(--mono);position:relative}
.cb{position:relative;margin:0 0 10px}
.cb .cp{position:absolute;top:6px;right:6px;height:24px;font-size:11.5px;padding:0 8px;border:1px solid var(--control);background:var(--surface);border-radius:4px}
.cmt{color:var(--faint)}
/* popover */
#pop{position:fixed;z-index:50;width:min(380px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--control);border-radius:var(--radius-card);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13px;display:none}
#pop.show{display:block}
#pop .pv{font:600 18px var(--font);margin-bottom:2px}
#pop .pl{color:var(--muted);margin-bottom:8px}
#pop dl.f{font-size:12.5px;gap:4px 12px}
#pop dl.f dd{font-family:var(--mono);font-size:12px}
#pop .pa{display:flex;gap:6px;margin-top:10px}
#pop .x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--faint);font-size:16px}
@media (max-width:560px){#pop{left:12px!important;right:12px;top:auto!important;bottom:12px;width:auto}}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--primary);color:var(--on-primary);font:12px var(--mono);padding:5px 8px;border-radius:4px;display:none;white-space:pre}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:8px 14px;border-radius:var(--radius-control);font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#load{padding:80px 0;color:var(--faint);font:13px var(--mono)}
/* print */
@media print{
 :root,:root[data-theme="dark"]{--ground:#fff;--surface:#fff;--raised:#f6f7f8;--border:#d5dade;--rule:#e6e9ec;--control:#b9c0c6;--text:#111;--muted:#444;--faint:#666;
  --accent:#1b6c80;--accent-soft:#e3f0f3;--positive:#1e7b4f;--negative:#c4242a;--warning:#92400e;--grid:#e3e7ea;--cell-rr:#cfd6dc;--cell-ww:#6f767d;
  --pill-positive-bg:#dcfae5;--pill-negative-bg:#ffedea;--pill-warning-bg:#fff5db;--pill-neutral-bg:#eceff2;--primary:#111;--on-primary:#fff;color-scheme:light}
 @page{margin:14mm 12mm}
 html,body{background:#fff;font-size:11.5px}
 .bar,.toc,.chips,.anc,.ctl,.cp,#pop,#tip,#toast,.noprint{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 main{padding:0}
 section.s{border:0;border-top:1px solid #ccc;border-radius:0;padding:14px 0 6px;margin:0;break-inside:auto}
 .fig,.rung,.hc,.exm,tr,pre,.stg{break-inside:avoid}
 .ev{border-bottom:0}
 .tw{overflow:visible;margin:0}
 table{font-size:10px}th,td{padding:4px 5px}td .trk.strip{width:96px}
 .lrow:not(.open)+.ldet{display:none!important}
 h3{break-after:avoid}
 .trk,.trk *{print-color-adjust:exact}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* reference additions */
@media (max-width:1000px){.bar .tb span{display:none}}
.bar .crumb{min-width:120px}
section.s,.head{overflow-wrap:anywhere}.tl span,.unk span,.after .stp{min-width:0}
table{overflow-wrap:normal}
.ladder{grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
@media (max-width:760px){.ladder{grid-template-columns:minmax(0,1fr)}}
.stg .k,.stg .v,.spine .nd b,.lrow .nm,.goal .gt,h1,.crumb b{overflow-wrap:anywhere;word-break:break-word}
.stg .k{word-break:normal}
.tb select{border:0;background:none;font:inherit;color:inherit;max-width:220px;padding:0;outline:0;cursor:pointer}
.pickers{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.pickers label{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--faint)}
.pickers select{height:28px;border:1px solid var(--control);background:var(--surface);color:var(--text);border-radius:var(--radius-control);font:12.5px var(--mono);max-width:min(320px,70vw);padding:0 6px}
.goals{display:grid;gap:8px;margin-top:14px}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--rule);border-radius:var(--radius-control);padding:8px 10px;background:var(--raised)}
.goal .trk{grid-column:1/-1}
.goal .gt{font-weight:500;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.goal .gv{font:600 13px var(--mono);white-space:nowrap}
td .trk.strip{width:160px}
.sz{height:6px;border-radius:3px;background:var(--chart-1);opacity:.8;min-width:2px}
.szw{width:90px;background:var(--rule);border-radius:3px}
.empty{color:var(--faint);font-size:13px;padding:6px 0}
.tl{display:grid;gap:2px;font-size:13px}
.tl div{display:grid;grid-template-columns:130px 90px minmax(0,1fr);gap:8px;padding:4px 0;border-bottom:1px solid var(--rule)}
.tl .k{font:500 12px var(--mono);color:var(--faint)}
@media (max-width:560px){.tl div{grid-template-columns:minmax(0,1fr)}td .trk.strip{width:110px}.goal{grid-template-columns:minmax(0,1fr)}}
.unk{display:grid;gap:6px}
.unk div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:13px;align-items:baseline}
.unk b{font:500 11.5px var(--mono);padding:2px 7px;border-radius:999px;background:var(--pill-warning-bg);color:var(--warning);text-align:center}
.unk b.neg{background:var(--pill-negative-bg);color:var(--negative)}.unk b.mut{background:var(--pill-neutral-bg);color:var(--muted)}
@media (max-width:560px){.unk div{grid-template-columns:minmax(0,1fr)}.unk b{justify-self:start}}
.trk{position:relative;width:100%;min-width:60px}

const pct = (x, d = 1) => x == null ? "—" : (x * 100).toFixed(d) + "%";

const secs = x => x == null ? "—" : x < 10 ? x.toFixed(2) + " s" : x.toFixed(1) + " s";
const enc = encodeURIComponent;

/* ---------------- data: inlined snapshot, else the ledger ---------------- */

const M = D.model, CH = M.name, PV = D.base, R = D.results, RS = Object.fromEntries(R.map(r => [r.slice, r]));

const STATUS = Object.fromEntries(D.models.map(m => [m.name, m.status]));
const LB = D.labels || {};
const mnt = k => k == null || k === "" ? "—" : LB[k] || (String(k).split("+").length > 3 ? "…+" + String(k).split("+").slice(-2).join("+") : String(k));
const mn = k => { const t = mnt(k); return t === String(k ?? "—") ? esc(t) : `<span title="${esc(k)}">${esc(t)}</span>`; };
const isBin = r => (r?.scale || "binary") === "binary";
const unit = r => r?.unit ? " " + r.unit : "";
// a score in its slice's units: "1,224 of 1,319" on 0/1 slices, "387 ms" on continuous ones; a "minus ..." metric is
// stored negated (higher is better) and reads as the plain amount
const negR = r => /^\s*minus\b/i.test(r?.metric || "");
const grp = x => Math.abs(x) >= 100 ? fmt.format(Math.round(x)) : (+x.toPrecision(3)).toLocaleString("en-US");
// a count pooled over several runs keeps its fraction (96.6 of 100), so the count and its percent never disagree
const NC = x => x == null ? "—" : Math.abs(x - Math.round(x)) < 0.05 ? N0(x) : (Math.round(x * 10) / 10).toLocaleString("en-US", { minimumFractionDigits: 1 });
const sc = (v, r) => v == null ? "—" : isBin(r) ? (r?.n ? `${NC(v * r.n)} of ${N0(r.n)}` : pct(v)) : grp(negR(r) ? -v : v) + unit(r);
const sdc = (x, r) => (x > 0 ? "+" : x < 0 ? "−" : "") + grp(Math.abs(x)) + unit(r);
const dl = (v, r) => v == null ? "—" : isBin(r) ? pts(v) + " pts" : sdc(negR(r) ? -v : v, r);
const cnt = (v, r) => v == null ? "—" : isBin(r) ? NC(v * r.n) : num(v);
const short = s => { const p = String(s || "").split("/"); return p.length > 1 && p[0] === D.project.primary_dataset ? p.slice(1).join("/") : String(s || ""); };
const ciTxt = (p, r) => p && p.lo != null ? (isBin(r) ? `[${pts(p.lo)}, ${pts(p.hi)}]` : negR(r) ? `[${sdc(-p.hi, r)}, ${sdc(-p.lo, r)}]` : `[${sdc(p.lo, r)}, ${sdc(p.hi, r)}]`) : "—";
const runsTxt = r => `${r.runs} run${r.runs === 1 ? "" : "s"}`;
const stPill = s => `<span class="st ${esc(s || "")}">${esc(s || "—")}</span>`;
// strips drawn in HTML, positions in % of the width: dots stay round at any width and in print (no stretched SVG)
const trk = (parts, h = 18, cls = "") => `<div class="trk ${cls}" style="height:${h}px">${parts.join("")}</div>`;
const pc = x => (Math.max(0, Math.min(1, x)) * 100).toFixed(2) + "%";
const tMark = (x, c, solid) => `<i class="tmark ${c}${solid ? " solid" : ""}" style="left:${pc(x)}"></i>`;
const tDot = (x, c, r = 5, tip) => `<i class="tdot ${c}" style="left:${pc(x)};width:${2 * r}px;height:${2 * r}px"${tip ? ` title="${esc(tip)}"` : ""}></i>`;
const tBar = (a, b, c, h = 3) => `<i class="tbar ${c}" style="left:${pc(Math.min(a, b))};width:calc(${pc(Math.max(a, b))} - ${pc(Math.min(a, b))});height:${h}px"></i>`;
const tLine = () => `<i class="tline"></i>`;

/* ---------------- evidence registry ---------------- */
const EV = {}; let evN = 0;
function evb(inner, o, cls = "", style = "") { const k = "e" + (++evN); EV[k] = o; return `<button class="ev ${cls}" data-ev="${k}"${style ? ` style="${style}"` : ""}>${inner}</button>`; }
function ev(v, o) { const k = "e" + (++evN); EV[k] = { v, ...o }; return `<button class="ev" data-ev="${k}">${esc(v)}</button>`; }
const runIds = r => [...(r.run_ids || [r.task]), ...(r.base ? r.base.run_ids || [r.base.task] : [])];
const evRes = (r, label, note) => ({ label: label || `${mnt(CH)} on ${r.slice}`, slice: r.slice, hash: r.hash, n: r.n, runs: runIds(r), src: `${r.runs} complete run${r.runs === 1 ? "" : "s"} pooled per id` + (r.base ? `, ${mnt(PV)}: ${r.base.runs}` : ""), note });
const evPair = (r, p) => evRes(r, `Paired delta vs ${mnt(PV)} on ${r.slice}`, p ? `delta ${dl(p.delta, r)}, 90% CI ${ciTxt(p, r)}, n ${N0(p.n)} shared ids, ${p.wins} better, ${p.losses} worse` : null);

/* ---------------- shell ---------------- */
const SECS = [["claim", "Claim"], ["system", "System"], ["data", "Data and slices"], ["results", "Results"], ["gates", "Gate ladder"], ["flips", "Fixed and broken"], ["failures", "Failures"], ["lineage", "Lineage"], ["cost", "Cost and latency"], ["unknown", "Not known"], ["reproduce", "Reproduce"]];
const ICON = {
  link: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.5 2.5 0 013.5 3.5l-1 1M9 11.5l-1 1A2.5 2.5 0 014.5 9l1-1"/></svg>',
  down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8M5 7l3 3 3-3M3 12v2h10v-2"/></svg>',
  print: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6V2h8v4M4 11H2V6h12v5h-2M4 9h8v5H4z"/></svg>',
  theme: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 008 2.5z" fill="currentColor"/></svg>',
  paper: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 1.5h5l3 3v10H4z"/><path d="M9 1.5v3h3M6 8h4M6 11h4"/></svg>',
  cmt: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 3h11v8H7l-3 2.5V11H2.5z"/></svg>'
};
const sec = (i, id, title) => `<section class="s" id="${id}" data-item><div class="hd"><b>${String(i + 1).padStart(2, "0")}</b><h2>${title}</h2><button class="anc" data-anchor="${id}" title="Copy link to this section">#</button></div><div data-body="${id}"></div></section>`;
const order = { champion: 0, candidate: 1, retired: 2, historical: 3, rejected: 4, planned: 5 };
// two models can share a title: the option then also names the id, so no two entries read the same
const dupT = (c => (D.models.forEach(m => c[mnt(m.name)] = (c[mnt(m.name)] || 0) + 1), c))({});
const opts = (list, sel) => list.map(m => `<option value="${esc(m.name)}"${m.name === sel ? " selected" : ""}>${esc(mnt(m.name))}${dupT[mnt(m.name)] > 1 && mnt(m.name) !== m.name ? " (" + esc(m.name) + ")" : ""} · ${esc(m.status)}</option>`).join("");
const byStatus = [...D.models].sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9) || a.name.localeCompare(b.name));
const gPick = [g => g.status === "open" && g.kpi === "score" && !g.met && g.slice === D.main, g => g.status === "open" && g.kpi === "score" && !g.met, g => g.status === "open", () => true];
const champGoal = gPick.map(f => D.goals.find(g => g.model === CH && f(g))).find(Boolean) || null;
// a goal's slice as a results row, and its comparator as read: a "minus ms" score stored as >= -1000 reads "≤ 1,000 ms"
const gR = g => RS[g.slice] || { slice: g.slice, scale: g.scale || "binary", n: g.n, unit: g.unit, metric: g.metric };
const gCmp = g => (g.higher_is_better !== false) !== (g.kpi === "score" && negR(gR(g))) ? "≥" : "≤";

$("#app").innerHTML = `
<div class="bar"><div class="in">
  <div class="crumb ttl">${SNAP ? `${esc(D.project.name || "project")} · <b>${mn(CH)}</b>` : `<a class="crumb" href="${BASE}/#overview">${esc(D.project.name || "project")}</a> · <a class="crumb" href="${BASE}/#model/${enc(CH)}"><b>${mn(CH)}</b></a>`} · paper</div>
  ${(D.papers || []).slice(0, 1).map(x => `<a class="tb" href="${BASE}/papers/${enc(x.name)}" title="${esc(x.title)}">${ICON.paper}<span>${x.kind === "model" ? "Written paper" : "Hill paper"}</span></a>`).join("")}
  ${SNAP ? "" : `<a class="tb" id="bCmt" href="${D.papers?.length ? `${BASE}/papers/${enc(D.papers[0].name)}` : `${BASE}/#model/${enc(CH)}`}" title="Comment">${ICON.cmt}<span>Comment</span></a>`}
  <button class="tb" id="bLink" title="Copy a link to the section in view" ${window.parent!==window&&window.parent.ARX_SNAP||window.ARX_SNAP?'hidden':''}>${ICON.link}<span>Copy link</span></button>
  <button class="tb pri" id="bDown" title="Download one self-contained HTML file">${ICON.down}<span>Download</span></button>
  <button class="tb" id="bPrint" title="Print or save as PDF">${ICON.print}<span>PDF</span></button>

</div><nav class="chips" id="chips">${SECS.map(([id, t]) => `<a href="#${id}" data-s="${id}">${t}</a>`).join("")}</nav></div>
<div class="wrap">
<nav class="toc" id="toc">${SECS.map(([id, t], i) => `<a href="#${id}" data-s="${id}"><b>${String(i + 1).padStart(2, "0")}</b>${t}</a>`).join("")}</nav>
<main id="main">
<header class="head">
  <div class="kick">${esc(M.status)} · ${esc(D.project.name || "")}${champGoal ? " · goal " + esc(champGoal.name) : ""}</div>
  <h1>${mn(CH)}</h1>${mnt(CH) !== CH ? `<div class="kick" style="margin:-4px 0 10px">${esc(CH)}</div>` : ""}
  <div class="facts">
    ${stPill(M.status)}
    ${M.title && M.title !== mnt(CH) ? `<span class="pill">${esc(M.title)}</span>` : ""}
    ${M.promoted ? `<span class="pill pos">champion since ${dt(M.promoted)}</span>` : ""}
    ${PV ? `<span class="pill">vs ${mn(PV)}</span>` : ""}

</header>
${SECS.map(([id, t], i) => sec(i, id, t)).join("")}
</main></div>
<div id="pop" role="dialog"></div><div id="tip"></div><div id="toast"></div>`;
const body = id => $(`[data-body="${id}"]`);
const FW = id => Math.max(300, Math.min(900, Math.round(body(id)?.clientWidth || 800)));  // charts drawn at their real width, so 12px text stays 12px
const DRAW = {};
function section(id, fn) { DRAW[id] = fn; try { const h = fn(); if (typeof h === "string") body(id).innerHTML = h; } catch (e) { console.warn(id, e); body(id).innerHTML = `<div class="empty">This section could not be drawn from the ledger: ${esc(e.message)}</div>`; } }

/* ================= 01 claim ================= */
section("claim", () => {
  if (!MAIN) return `<div class="empty">${mn(CH)} has no complete eval run yet.</div>`;
  const r = MAIN, p = r.vs, bin = isBin(r), g = champGoal && champGoal.slice === r.slice && champGoal.kpi === "score" ? champGoal : D.goals.find(x => x.slice === r.slice && x.kpi === "score" && x.status === "open");
  const val = v => bin ? v * r.n : v;
  const bars = [[PV ? "before · " + mnt(PV) : null, p ? p.base : null, "f-mut"], ["this · " + mnt(CH), r.score, "f-pos"]].filter(b => b[0] && b[1] != null);
  const tgt = g ? (g.need ?? g.target * r.n) : null;
  const vals = [...bars.map(b => val(b[1])), ...(tgt != null && bin ? [tgt] : [])];
  const top = bin ? r.n : Math.max(...vals) * 1.05, span = Math.max(...vals) - Math.min(...vals);
  let lo = bin ? Math.max(0, Math.min(...vals) - Math.max(span * 1.2, r.n * .04)) : Math.min(0, Math.min(...vals));
  lo = bin ? Math.floor(lo / (r.n > 200 ? 50 : 5)) * (r.n > 200 ? 50 : 5) : lo;
  const W = FW("claim"), X = v => 12 + (v - lo) / ((top - lo) || 1) * (W - 24), BH = 26, GAP = 58, Y0 = 34;
  const yEnd = Y0 + (bars.length - 1) * GAP + BH, H = yEnd + 62, maxCh = Math.max(12, Math.floor((W - 24) / 7));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(r.slice)}: before, this model, target">`;
  const step = niceStep((top - lo) / Math.max(3, Math.min(6, Math.floor(W / 120))));
  for (let v = Math.ceil(lo / step) * step; v <= top + 1e-9; v += step) s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${Y0 - 4}" y2="${yEnd + 4}"/><text class="t-f" x="${X(v)}" y="${yEnd + 36}" text-anchor="middle">${bin ? N0(v) : num(v, 3)}</text>`;
  bars.forEach(([lab, v, c], i) => {
    const y = Y0 + i * GAP, xe = X(val(v)), w = Math.max(2, xe - X(lo)), txt = bin ? N0(val(v)) : sc(v, r), tw = txt.length * 9 + 10;
    const inside = xe + 8 + tw > W - 2;  // no room after the bar: the value goes inside its end, in a colour that reads on the bar

    s += `<rect class="f-track" x="${X(lo)}" y="${y}" width="${X(top) - X(lo)}" height="${BH}" rx="4"/><rect class="${c}" x="${X(lo)}" y="${y}" width="${w}" height="${BH}" rx="4"/>`;
    s += `<text x="${inside ? xe - 8 : xe + 8}" y="${y + 18}" class="t-big"${inside ? ` text-anchor="end" style="fill:${c === "f-pos" ? "var(--on-primary)" : "var(--text)"}"` : ""}>${esc(txt)}</text>`;

    const now = val(r.score);
    if (now < tgt) { const cx = Math.min(W - 40, Math.max(X(lo) + 40, (X(now) + xt) / 2));
      s += `<path d="M${X(now)} ${yEnd + 10} H${xt}" class="s-neg" stroke-width="2"/><text x="${cx}" y="${yEnd + 22}" text-anchor="middle" class="t-f" style="fill:var(--negative)">${N0(tgt - now)} short</text>`; }

  const ratio = (a, b, slow, fast) => { if (a == null || b == null || !(b > 0) || !(a > 0)) return ""; const x = a / b; return Math.abs(x - 1) < .05 ? ' <span class="faint">(same)</span>' : x > 1 ? ` <span class="neg">(${x.toFixed(1)}× ${slow})</span>` : ` <span class="pos">(${(1 / x).toFixed(1)}× ${fast})</span>`; };
  const lat = r.latency_p50 != null ? `p50 ${ev(secs(r.latency_p50), { ...evRes(r, "p50 latency on " + r.slice), note: "latest run summary" })}${r.base?.latency_p50 != null ? " vs " + secs(r.base.latency_p50) + ratio(r.latency_p50, r.base.latency_p50, "slower", "faster") : ""}` : "";
  const cost = r.cost != null ? `${ev("$" + num(r.cost, 3), evRes(r, "Cost per example on " + r.slice))} per example${r.base?.cost != null ? " vs $" + num(r.base.cost, 3) + ratio(r.cost, r.base.cost, "the cost", "cheaper") : ""}` : "";

  <dl class="f">
    <dt>result</dt><dd>${bin ? ev(NC(r.right) + " / " + N0(r.n), evRes(r)) + ` right (${pct(r.score)})` : ev(sc(r.score, r), evRes(r))} on ${esc(r.slice)} · ${runsTxt(r)}</dd>
    ${p ? `<dt>vs before</dt><dd>${ev(dl(p.delta, r), evPair(r, p))} paired, 90% CI ${ev(ciTxt(p, r), evPair(r, p))}${p.noisy ? ' <span class="warn">noisy</span>' : ""}, same ${N0(p.n)} ids</dd>
    <dt>churn</dt><dd><span class="pos">${ev(p.wins + " fixed", evPair(r, p))}</span> · <span class="neg">${ev(p.losses + " broken", evPair(r, p))}</span> · net ${sgn(p.wins - p.losses, 0)}</dd>` : `<dt>current comparison</dt><dd class="warn">${PV ? "No matching current harness comparison with " + mn(PV) : "no comparator in the ledger"}${D.promotion ? `; <a href="#gates">historical promotion ${dt(D.promotion.t)}</a>` : ""}</dd>`}
    ${g ? `<dt>goal</dt><dd>${goalLine(g, r)}</dd>` : ""}
    ${M.title ? `<dt>change</dt><dd>${esc(M.title)}</dd>` : ""}

// where this model stands against a score goal on its own slice: "43 more of 1,319 to reach 1,267", "458 ms to cut to ≤ 1,000 ms"
function goalLine(g, r) {
  const sg = g.higher_is_better !== false ? 1 : -1, v = r.score, met = v != null && sg * (v - g.target) >= -1e-12;
  const need = isBin(r) ? g.need ?? Math.ceil(g.target * r.n - 1e-9) : null, have = isBin(r) && v != null ? Math.round(v * r.n) : null;
  const e = { label: "Distance to goal " + g.name, slice: g.slice, n: r.n, runs: runIds(r), src: ".research/goals.json › " + g.name, note: isBin(r) ? `target ${g.target} → ${N0(need)} of ${N0(r.n)}; now ${N0(have)}` : `target ${gCmp(g)} ${sc(g.target, r)}; now ${sc(v, r)}` };
  const head = `${esc(g.title || g.name)}: `;
  if (v == null) return head + `target ${gCmp(g)} ${isBin(r) ? N0(need) + " of " + N0(r.n) : sc(g.target, r)}`;
  if (met) return head + `<span class="pos">met</span>`;
  return head + (isBin(r) ? ev(N0(need - have) + " more", e) + ` of ${N0(r.n)} to reach ${N0(need)}`
    : ev(grp(Math.abs(g.target - v)) + unit(r) + (gCmp(g) === "≤" ? " to cut" : " to go"), e) + ` to reach ${gCmp(g)} ${sc(g.target, r)}`);
}
function niceStep(raw) { if (!(raw > 0)) return 1; const e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * e; }
function goalStrips() {
  if (!D.goals.length) return "";
  const ord = { open: 0, achieved: 1, abandoned: 2 };
  return `<div class="goals">${[...D.goals].sort((a, b) => (ord[a.status] ?? 3) - (ord[b.status] ?? 3)).map(g => {
    const v = g.value, t = g.target, hib = g.higher_is_better !== false, isS = g.kpi === "score";
    const r = gR(g), bin = isS && isBin(r), Dv = x => x == null ? x : isS && negR(r) ? -x : x;
    const fmtv = x => x == null ? "—" : isS ? sc(x, r) : g.kpi.startsWith("latency") ? secs(x) : g.kpi === "cost" ? "$" + num(x, 3) : /tokens?_per_s|throughput/i.test(g.kpi) ? num(x) + " tok/s" : num(x);
    const now = bin && g.have != null ? `${N0(g.have)} of ${N0(g.n)} <span class="faint">(${pct(v)})</span>` : fmtv(v);
    const goal = bin && g.need != null ? N0(g.need) : isS && !bin ? fmtv(t) : fmtv(t);
    const dist = g.met ? '<span class="pos">met</span>' : g.need != null && g.have != null ? `<b>${N0(g.need - g.have)} more</b>` : v != null ? `${isS && !bin ? grp(Math.abs(t - v)) + unit(r) : fmtv(Math.abs(t - v))} ${gCmp(g) === "≤" ? "to cut" : "to go"}` : "no run";
    const top = Math.max(Dv(v) ?? 0, Dv(t) ?? 0) * (isS && !bin ? 1.15 : isS ? 1 : 1.15) || 1, hi = bin ? 1 : top, X = x => Math.max(0, Math.min(1, Dv(x) / hi));
    return `<div class="goal${g.status === "abandoned" ? " dim" : ""}"><div class="gt">${esc(g.title || g.name)} <span class="faint mono" style="font-size:11.5px">${esc(g.status)} · ${esc(short(g.slice))}${g.model && g.model !== CH ? " · " + mn(g.model) : ""}</span></div><div class="gv">${g.status === "abandoned" ? now : `${now} <span class="faint">${gCmp(g)} ${goal}</span> · ${dist}`}</div>
    ${trk([`<i class="tbar c-trk" style="left:0;width:100%;height:8px"></i>`, v != null ? `<i class="tbar ${g.met ? "c-pos" : "c-acc"}" style="left:0;width:${X(v) * 100}%;height:8px"></i>` : "", t != null ? tMark(X(t), "c-text", true) : ""], 14)}</div>`;
  }).join("")}</div>`;
}

/* ================= 02 system ================= */
section("system", () => {
  // the system as its parts, root first: what each part added, what it did on one example (input, output before,
  // output after: its hill's example) and what it cost (p50 latency and cost per example against the step before)
  const chain = D.lineage, first = x => { const t = String(x || "").split(/(?<=[.;])\s/)[0].replace(/;$/, ""); return t.length > 110 ? t.slice(0, 109) + "…" : t; };
  const costRow = c => {
    if (!c || (c.latency_p50 == null && c.cost == null)) return "";
    const ls = [c.latency_p50, c.base_latency_p50].filter(x => x != null), top = Math.max(...ls, 1e-9);
    const bar = (v, cls, lab) => v == null ? "" : `<div class="sy-cb"><span>${lab}</span><i class="${cls}" style="width:${(v / top * 100).toFixed(1)}%"></i><b>${secs(v)}</b></div>`;
    const ratio = c.latency_p50 != null && c.base_latency_p50 ? c.latency_p50 / c.base_latency_p50 : null;
    const one = c.base_latency_p50 == null;
    const bits = [ratio ? `<span class="${ratio > 1.05 ? "warn" : ratio < .95 ? "pos" : "faint"}">${ratio > 1.05 ? ratio.toFixed(1) + "× slower" : ratio < .95 ? (1 / ratio).toFixed(1) + "× faster" : "same speed"}</span>` : "",
      c.cost != null ? `$${num(c.cost, 3)}/example${c.base_cost != null ? ` <span class="faint">vs $${num(c.base_cost, 3)}</span>` : ""}` : ""].filter(Boolean);
    return `<div class="sy-cost">${bar(c.base_latency_p50, "c-mut", "before")}${bar(c.latency_p50, ratio && ratio > 1.05 ? "c-warn" : "c-acc", one ? "p50" : "after")}
      <div class="sy-cm">${bits.join(" · ")} <span class="faint">${one ? "" : "p50 · "}${esc(short(c.slice))}</span></div></div>`;
  };
  const exRow = x => !x ? "" : `<div class="sy-ex">
    <div class="sy-box"><span>input</span><div>${esc(x.input || "—")}</div></div><i class="sy-ar">→</i>
    <div class="sy-box neg"><span>before</span><code>${esc(x.wrong || "—")}</code></div><i class="sy-ar">→</i>
    <div class="sy-box pos"><span>after</span><code>${esc(x.right || "—")}</code></div></div>`;
  const seenEx = new Set();  // parts from one hill share its example: draw it once
  const step = (s, i) => {
    const exK = s.example ? JSON.stringify(s.example) : null, exNew = exK && !seenEx.has(exK); if (exK) seenEx.add(exK);
    const r = s.delta && RS[s.delta.slice] || { scale: "binary" }, d = s.delta;
    const eff = d && d.delta != null ? `<span class="${d.lo > 0 ? "pos" : d.hi < 0 ? "neg" : "faint"}">${ev(dl(d.delta, r), { label: `${mnt(s.name)} vs ${mnt(s.parent)} on ${d.slice}`, slice: d.slice, n: d.n, src: "paired over shared ids", note: `CI ${ciTxt(d, r)}, ${d.wins} better, ${d.losses} worse` })}</span> <span class="faint">${esc(short(d.slice))}</span>${d.wins != null ? ` · <span class="pos">${d.wins} fixed</span> <span class="neg">${d.losses} broke</span>` : ""}` : "";
    return `<div class="sy-step${s.name === CH ? " me" : ""}"><div class="sy-n">${i + 1}</div><div class="sy-b">
      <div class="sy-h"><b title="${esc(s.name)}">${esc(mnt(s.name))}</b>${stPill(s.status)}<span class="sy-eff">${i ? eff : '<span class="faint">start</span>'}</span></div>
      ${i && s.change ? `<div class="sy-what">${esc(first(s.change))}</div>` : ""}${i && exNew ? exRow(s.example) : ""}${costRow(s.cost)}</div></div>`;
  };
  // what differs from the comparator: the registered spec where both have one, else how each was run
  const a = Object.fromEntries(D.base_spec), b = Object.fromEntries(D.spec), short8 = v => /^[0-9a-f]{32,}$/.test(String(v)) ? String(v).slice(0, 8) : String(v ?? "—");
  const specDiff = D.base_spec.length ? [...new Set([...D.base_spec.map(x => x[0]), ...D.spec.map(x => x[0])])].filter(k => String(a[k] ?? "") !== String(b[k] ?? "")).map(k => [k, a[k], b[k], /^[0-9a-f]{32,}$/.test(String(b[k] ?? a[k]))]) : [];
  const diff = (specDiff.length ? specDiff : D.run_diff || []), shown = diff.filter(x => !x[3]), hashes = diff.length - shown.length;
  const chips = PV && diff.length ? `<h3>what changed vs ${mn(PV)}</h3><div class="sy-diff">${shown.map(([k, x, y]) => `<span class="sy-chg"><code>${esc(k.split(".").pop())}</code><s>${esc(short8(x))}</s><i>→</i><b>${esc(short8(y))}</b></span>`).join("")}${hashes ? `<span class="faint">${hashes} pinned hash${hashes === 1 ? "" : "es"} differ</span>` : ""}</div>` : "";
  const specT = D.spec.length ? `<details class="sy-more"><summary>spec · ${D.spec.length} fields</summary><div class="tw"><table><tbody>${D.spec.map(([k, v]) => `<tr><td class="id">${esc(k)}</td><td class="mono" style="word-break:break-all">${esc(short8(v))}</td></tr>`).join("")}</tbody></table></div></details>` : "";
  const note = M.change ? `<details class="sy-more"><summary>registered note</summary><div class="muted" style="font-size:13px;margin-top:6px">${esc(M.change)}</div></details>` : "";
  return `<div class="sys">${chain.map(step).join("")}</div>${chips}${specT}${note}`;
});

/* ================= 03 data ================= */
section("data", () => {
  // one row per dataset: its full slice on top, the other slices as segments sized by n and coloured by kind; solid if

  const P = D.project.primary_dataset, ranIn = k => run.some(r => ds(r.slice) === k);
  names.sort((a, b) => (b === P) - (a === P) || ranIn(b) - ranIn(a) || a.localeCompare(b));

    return `${t ? `<span title="hill target">◎${t > 1 ? t : ""}</span>` : ""}${c ? `<span title="hill control">◇${c > 1 ? c : ""}</span>` : ""}`; };

    runs: x.ran ? runIds(x) : [], src: ".research/slices.json › " + x.slice,
    extra: [["kind", x.kind], ["roles", (x.roles || []).join(", ")], ["metric", x.metric], ["measures", x.description], ["this model", x.ran ? `${x.runs} run${x.runs === 1 ? "" : "s"}` : "no run"]] });
  const seg = (x, full) => evb(`<span class="sn">${esc(full ? short(x.slice) || x.slice : String(x.slice).split("/").slice(1).join("/") || x.slice)}</span><span class="sv">${N0(x.n)}</span>${glyph(x)}`, pop(x),
    `cseg ${kc(x.kind)} ${x.ran ? "run" : "norun"}`, full ? "" : `flex:${Math.max(1, x.n || 1)} 1 auto`);  // never narrower than its label
  const idle = names.filter(k => !ranIn(k));
  const idleRow = idle.length ? `<div class="dsr"><div class="dsh"><b>${idle.length} more dataset${idle.length === 1 ? "" : "s"}</b> <span class="faint">· none run by ${mn(CH)}</span></div><div class="lane">${idle.map(k => {
    const d = D.datasets[k] || {}, mine = all.filter(x => ds(x.slice) === k);
    return evb(`<span class="sn">${esc(k)}</span><span class="sv">${d.size != null ? N0(d.size) : ""}</span>${mine.length > 1 ? `<span class="sv">· ${mine.length} slices</span>` : ""}`,
      { v: d.title || k, label: "dataset " + k, n: d.size, src: ".research/datasets.json › " + k, extra: [["about", d.description], ["source", d.url], ...mine.map(x => [x.kind || "slice", `${x.slice} · n ${N0(x.n)} · not run${x.roles?.length ? " · " + x.roles.join(", ") : ""}`])] },
      "cseg k-full norun", `flex:${Math.max(1, Math.sqrt(d.size || 1))} 1 0`); }).join("")}</div></div>` : "";
  const rows = names.filter(ranIn).map(k => {
