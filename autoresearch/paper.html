<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papers</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/ui.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("arx-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch{}</script>
<style>
.badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500}
.ta,.in{width:100%;border:1px solid var(--input);border-radius:6px;background:var(--page);color:var(--foreground);font:inherit;padding:8px 10px}
.ta{resize:none;min-height:38px;max-height:220px;line-height:1.45;display:block}
.ta::placeholder,.in::placeholder{color:var(--muted-fg)}
/* top bar */
.bar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--background)}
.doc-ic{width:30px;height:30px;border-radius:6px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;flex:none}
.ttl{min-width:0;flex:1;display:flex;align-items:center;gap:8px;font-size:14px}
.ttl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ttl .crumb{color:var(--muted-fg);text-decoration:none;white-space:nowrap}.ttl .crumb:hover{color:var(--foreground)}
.ttl .sep{color:var(--input)} #hillCrumb{display:contents}
.ttl .crumb.ell{overflow:hidden;text-overflow:ellipsis;max-width:28ch;min-width:0}
.lgr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 16px;font-size:13px;color:var(--muted-fg);border-bottom:1px solid var(--border);background:var(--background)}
.lgr b{color:var(--foreground);font-weight:600}
.lgr .tag{font:500 11.5px var(--mono);padding:2px 7px;border-radius:4px;background:var(--muted);color:var(--muted-fg)}
.lgr .tag.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.lgr .tag.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.lgr .tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.lgr .why{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 200px}
.bar .back{display:none}
.side.rail{position:fixed;left:0;top:0;width:60px;z-index:40;align-items:center;padding:12px 10px}
.side.rail .brand{padding:0 0 14px}
.side.rail a{position:relative;width:40px;height:40px;padding:0;justify-content:center}
.side.rail a .count{position:absolute;margin:0;transform:translate(12px,-11px);font-size:10px;line-height:15px;padding:0 5px}
.side.rail .foot{padding:0}
.shell{margin-left:60px}
.nav{display:flex;align-items:center;border:1px solid var(--input);border-radius:6px;height:32px;background:var(--page)}
.nav .btn{height:30px;border-radius:5px}
.nav .count{font-size:12.5px;color:var(--muted-fg);padding:0 4px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-fg);user-select:none;cursor:pointer;white-space:nowrap}
.switch i{width:30px;height:18px;border-radius:999px;background:var(--input);position:relative;transition:background .15s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--page);transition:transform .15s}
.switch[aria-checked="true"] i{background:var(--ring)} .switch[aria-checked="true"] i:after{transform:translateX(12px)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--input);border-radius:999px;padding:2px 10px 2px 2px;height:32px;background:var(--page);font-size:12.5px}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.live.off{background:var(--red)}
/* canvas */
.canvas{display:flex;justify-content:center;gap:20px;padding:28px 16px 120px}
.sheet{position:relative;width:816px;min-width:0;flex:0 1 816px}
.page{background:var(--page);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative}
.page iframe{display:block;width:100%;border:0;height:600px;background:transparent;color-scheme:normal;visibility:hidden}
.page iframe.ready{visibility:visible}  /* hidden until the theme is in: no white canvas flash */
.page iframe.next{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none}
.col{position:relative;width:320px;flex:none}
.empty{position:absolute;top:0;left:0;right:0;border:1px dashed var(--input);border-radius:var(--radius);padding:16px;color:var(--muted-fg);font-size:13px;text-align:center}
.empty b{display:block;color:var(--foreground);font-weight:600;margin-bottom:2px}
kbd{font:11px var(--mono);border:1px solid var(--input);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--muted)}
/* add comment affordance */
.add{position:absolute;left:0;z-index:5;display:none;box-shadow:var(--pop)}
.add.show{display:inline-flex}
/* cards */
.card{position:absolute;left:0;width:100%;background:var(--page);border:1px solid var(--border);border-radius:var(--radius);
  transition:top .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1),border-color .15s,opacity .2s;cursor:pointer}
.card:hover{border-color:var(--input)}
.card.on{transform:translateX(-14px);cursor:default;z-index:3;border-color:var(--ring)}
.card.resolved{opacity:.72}
.card.waiting:not(.on):before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--agent)}
.msg{padding:12px 14px 10px;position:relative}
.msg + .msg{border-top:1px solid var(--border)}
.card:not(.on) .msg.more{display:none}
.card:not(.on) .collapsed{display:block}
.collapsed{display:none;padding:0 14px 10px;font-size:12px;color:var(--muted-fg)}
.who{display:flex;align-items:center;gap:8px;min-height:28px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:600;flex:none}
.av.agent{background:var(--agent-soft);color:var(--agent)}
.who .nm{font-weight:600;font-size:13px;line-height:1.2;display:flex;align-items:center;gap:6px}
.who .tm{font-size:11.5px;color:var(--muted-fg);line-height:1.2}
.who .meta{min-width:0;flex:1}
.badge.ai{background:var(--agent-soft);color:var(--agent)}
.badge.guest{background:var(--muted);color:var(--muted-fg)}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.card.on .acts,.card:hover .acts,.acts:focus-within{opacity:1}
.acts .btn{color:var(--muted-fg)} .acts .btn:hover{color:var(--foreground)}
.body{margin-top:6px;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.body code{font:12px var(--mono);background:var(--muted);border-radius:4px;padding:1px 4px}
.body a{color:var(--agent)}
.tools{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--input);border-radius:999px}
.tools button{all:unset;display:grid;place-items:center;width:28px;height:28px;border-radius:999px;cursor:pointer;color:var(--muted-fg)}
.tools button:hover{background:var(--muted);color:var(--fg)}.tools button.on{background:var(--primary);color:var(--primary-fg,#fff)}
.ink{position:absolute;inset:0;z-index:4;pointer-events:none}.ink.on{pointer-events:auto;cursor:crosshair;touch-action:none}
.ink-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ink-svg path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ink-svg .v{stroke:#e8590c;stroke-width:2.5}.ink-svg .v.highlight{stroke:#facc15;stroke-width:16;stroke-opacity:.38}
.ink-svg .hit{stroke:transparent;stroke-width:14;pointer-events:visibleStroke;cursor:pointer}
.ink-svg g.res .v{stroke-opacity:.35}.ink-svg g.on .v{stroke:var(--ring);stroke-width:3.5}.ink-svg g.on .v.highlight{stroke:#facc15;stroke-opacity:.6;stroke-width:18}
.ink-svg g.draft .v{stroke-dasharray:5 4}.ink-svg g.hover .v{stroke:var(--ring);stroke-width:3.5}.ink-svg g.hover .v.highlight{stroke:#facc15;stroke-opacity:.6;stroke-width:18}
.card.hover{border-color:var(--ring)}
@media (max-width:900px){.tools .dr,.tools .sep{display:none}}  /* a phone picks; drawing needs a pointer */
.tools .dr,.tools .sep{display:none}.tools.open .dr{display:grid}.tools.open .sep{display:block}
.tools .sep{width:1px;margin:5px 2px;background:var(--input)}
.tools button.pk{width:auto;padding:0 10px 0 8px;gap:6px;grid-auto-flow:column;font-size:12.5px;color:var(--foreground)}.tools button.pk.on{color:var(--primary-fg,#fff)}
@media (max-width:520px){.tools button.pk span{display:none}.tools button.pk{padding:0 6px}}
.ink.pick{cursor:default}
.ink-svg .v.pk{stroke:var(--ring);stroke-width:2;stroke-opacity:.35}.ink-svg g.on .v.pk,.ink-svg g.hover .v.pk,.ink-svg g.draft .v.pk{stroke-opacity:1}
.shp{width:300px}.shp-u{padding:6px 10px 8px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted-fg)}
.shp-u b{font-weight:600;color:var(--foreground)}.shp .shp-x{margin-left:auto;font-size:11.5px;color:var(--muted-fg)}.shp code{font:12px var(--mono)}
.shp a{display:block;padding:7px 10px;border-radius:6px;color:inherit;text-decoration:none;font-size:13px}.shp a:hover{background:var(--muted)}
.seen{display:flex;align-items:center;gap:6px;margin:4px 14px 0;font-size:11px;color:var(--muted-fg)}
.seen .px-face+.px-face{margin-left:-5px}
.body .px-fig{margin:4px 0 8px}
.body b.at{color:var(--ring)}
.quote{margin:0 14px;padding:8px 0 0;font-size:12px;color:var(--muted-fg);display:flex;gap:6px;align-items:baseline}
.quote q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;quotes:none;border-left:2px solid var(--hl-on);padding-left:8px}
.tag{font-size:11px;color:var(--warn-ink);background:var(--warn-bg);border-radius:4px;padding:1px 5px;margin:8px 14px 0;display:inline-block}
.chip{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;text-decoration:none;color:var(--foreground);background:var(--muted);cursor:pointer;width:100%;text-align:left}
.chip:hover{border-color:var(--input)}
.chip .ci{width:30px;height:30px;border-radius:6px;background:var(--page);border:1px solid var(--border);display:grid;place-items:center;flex:none;color:var(--agent)}
.chip .cl{min-width:0;flex:1} .chip .cl b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cl span{display:block;font-size:11.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.think{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted-fg)}
.think .av{width:22px;height:22px;font-size:10px}
.dots{display:inline-flex;gap:3px} .dots i{width:5px;height:5px;border-radius:50%;background:var(--agent);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.sent{padding:0 14px 10px;font-size:11.5px;color:var(--muted-fg);display:flex;align-items:center;gap:6px}
.reply{padding:10px 14px 12px;border-top:1px solid var(--border);display:none}
.card.on .reply{display:block}
.row{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;align-items:center}
.row .hint{margin-right:auto;font-size:11.5px;color:var(--muted-fg)}
.reply .row{display:none} .reply.typing .row{display:flex}
.res{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-fg)}
.res .btn{margin-left:auto}
.draft{cursor:default}
.draft .msg{padding-bottom:12px}
.name-in{margin-bottom:8px}
/* menu */
.menu{position:absolute;z-index:40;min-width:170px;background:var(--page);border:1px solid var(--border);border-radius:8px;box-shadow:var(--pop);padding:4px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:7px 8px;border-radius:5px;font-size:13px;text-align:left}
.menu button:hover{background:var(--accent)} .menu button.danger{color:var(--red)}
/* toast, preview */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;display:flex;align-items:center;gap:12px;
  background:var(--primary);color:var(--primary-fg);border-radius:8px;padding:10px 12px 10px 16px;box-shadow:var(--pop);font-size:13px;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .btn{background:transparent;color:var(--primary-fg);border-color:color-mix(in srgb,var(--primary-fg) 30%,transparent)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px}
.ov.show{display:flex}
.dlg{background:var(--page);border-radius:var(--radius);box-shadow:var(--pop);width:min(1100px,100%);height:min(820px,100%);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
.dlg header{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border)}
.dlg header b{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg iframe{flex:1;border:0;width:100%;background:var(--page)}
/* paper list */
.list{max-width:816px;margin:28px auto;padding:0 16px;display:grid;gap:10px}
.list a{display:block;background:var(--page);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.list a:hover{border-color:var(--input)} .list b{font-size:15px} .list span{display:block;color:var(--muted-fg);font-size:12.5px;margin-top:2px}
.sheet-head{display:none}
/* narrow: the margin becomes a bottom sheet */
@media (max-width:1180px){.sheet{flex-basis:680px}.col{width:290px}}
@media (max-width:900px){
  .side.rail{display:none} .shell{margin-left:0} .bar .back{display:inline-flex} .ttl .crumb,.ttl .sep{display:none}
  .canvas{padding:0 0 96px;display:block}
  .sheet{width:100%}
  .page{border:0;border-radius:0;box-shadow:none}
  .bar .switch,.bar .me .nmv,.nav .count{display:none} .nav .count.m{display:inline}
  .ttl span{display:none}
  .col{position:fixed;left:0;right:0;bottom:0;width:auto;z-index:35;max-height:62vh;overflow:auto;background:var(--page);
    border-top:1px solid var(--border);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .25s;padding:0 12px 16px}
  .col.open{transform:none}
  .sheet-head{display:flex;align-items:center;position:sticky;top:0;background:var(--page);padding:8px 0;z-index:2;font-weight:600;font-size:14px;gap:8px}
  .sheet-head:before{content:"";position:absolute;top:5px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--input)}
  .sheet-head span{flex:1;padding-top:6px}
  .card,.empty{position:relative!important;top:auto!important;transform:none!important;margin-bottom:10px}
  .col:not(.all) .card:not(.on):not(.draft){display:none}
  .add{position:fixed;left:50%!important;top:auto!important;bottom:20px;transform:translateX(-50%);height:40px;padding:0 16px;z-index:36}
}
@media (max-width:520px){.bar{gap:6px;padding:0 10px}.nav .count.m{min-width:24px}}  /* a phone: the title gets the room */
</style>
</head>
<body>
<nav class="side rail" id="rail"></nav>
<div class="shell">
<header class="bar">
  <a class="btn icon ghost back" href="/#papers" title="Papers"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
  <div class="ttl"><a class="crumb" href="/#papers">Papers</a><span class="sep">/</span><span id="hillCrumb"></span><b id="title"></b></div>
  <div class="nav" id="nav" hidden>
    <button class="btn icon ghost" id="prev" title="Previous comment"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <span class="count" id="count"></span><span class="count m" id="countM" hidden></span>
    <button class="btn icon ghost" id="next" title="Next comment"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="tools" id="tools" hidden role="toolbar" aria-label="Comment">
    <button data-tool="pick" class="pk" title="Comment on an element (C)"><svg class="i" viewBox="0 0 24 24"><path d="M4 4l6 16 2.5-6.5L19 11z"/></svg><span>Comment</span></button><i class="sep"></i>
    <button data-tool="box" class="dr" title="Box (B)"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg></button>
    <button data-tool="arrow" class="dr" title="Arrow (A)"><svg class="i" viewBox="0 0 24 24"><path d="M5 19 19 5M10 5h9v9"/></svg></button>
    <button data-tool="pen" class="dr" title="Pen (D)"><svg class="i" viewBox="0 0 24 24"><path d="M4 18c3-6 6 2 9-4s4-6 7-8"/></svg></button>
    <button data-tool="highlight" class="dr" title="Highlight (H)"><svg class="i" viewBox="0 0 24 24"><path d="M4 16h16" stroke-width="7" stroke-opacity=".35"/></svg></button>
  </div>
  <span class="switch" id="showRes" role="switch" aria-checked="false" tabindex="0" hidden><i></i>Resolved</span>
  <button class="btn icon outline" id="share" title="Share"><svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4M8.2 13.2l7.6 4"/></svg></button>
  <button class="btn icon outline" id="theme" title="Toggle theme"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button class="me" id="me" title="Your name on comments"><span class="av" id="meAv"></span><span class="nmv" id="meNm"></span></button>
  <span class="live" id="live" title="Live"></span>
</header>
<div class="lgr" id="ledger" hidden></div>
<div id="root"></div>
</div>
<div class="toast" id="toast"><span id="toastT"></span><button class="btn sm outline" id="toastB">Show</button></div>
<div class="ov" id="ov"><div class="dlg"><header><b id="ovT"></b><a class="btn sm outline" id="ovOpen" target="_blank" rel="noopener">Open in new tab</a>
  <button class="btn icon sm ghost" id="ovX" title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header><iframe id="ovF"></iframe></div></div>
<script src="../people.js"></script>
<script src="../keys.js"></script>
<script src="../comments.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const BASE = (location.pathname.match(/^\/p\/[^/]+/) || [""])[0];  // /p/<key>: a project other than the server's own
document.querySelectorAll('a[href^="/#"]').forEach(a => a.setAttribute("href", BASE + a.getAttribute("href")));
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const I = {
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  dots: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></svg>',
  spark: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>',
  jump: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',

    return `<g class="${cls} pk" data-id="${esc(id)}"><path class="hit" d="${d}"/><path class="v box pk" d="${d}"/></g>`; }
  if (!r || !r.block || !a.shape) return "";
  const x = shapeXf(a, r);
  return `<g class="${cls}" data-id="${esc(id)}" transform="translate(${r1(x.tx)} ${r1(x.ty)}) scale(${r1(x.k * 1000) / 1000})"><path class="hit" d="${esc(a.shape.d)}"/><path class="v ${esc(a.shape.tool)}" d="${esc(a.shape.d)}"/></g>`;
}
function drawInk() {
  if (!frame) return;
  let out = visible().filter(t => t.anchor && (t.anchor.shape || t.anchor.pick)).map(t => inkG(t.anchor, (t.id === active ? "on " : "") + (t.id === hoverId ? "hover " : "") + (t.resolved ? "res" : ""), t.id)).join("");
  if (draft && (draft.anchor.shape || draft.anchor.pick)) out += inkG(draft.anchor, "draft", "_draft");
  if (stroke) out += `<g class="draft"><path class="v ${stroke.tool}" d="${shapeD(stroke.tool, stroke.pts)}"/></g>`;
  if (inkSvg._html !== out) inkSvg.innerHTML = inkSvg._html = out;  // the 1.5 s refresh leaves the marks under the pointer alone
}
// a mark and its card ring together, whichever one the pointer is on; one at a time, so nothing stays ringed
let hoverId = null;
function setHover(id) {
  if (id === hoverId) return; hoverId = id;
  for (const [k, c] of cards) c.classList.toggle("hover", k === id);
  inkSvg.querySelectorAll("g[data-id]").forEach(g => g.classList.toggle("hover", g.dataset.id === id));
}
inkSvg.addEventListener("click", e => { const g = e.target.closest("g[data-id]"); if (g && g.dataset.id !== "_draft") { e.stopPropagation(); setActive(g.dataset.id, { scroll: "if-needed" }); } });
inkSvg.addEventListener("pointerover", e => { const g = e.target.closest("g[data-id]"); g && g.dataset.id !== "_draft" && setHover(g.dataset.id); });
inkSvg.addEventListener("pointerout", e => { const g = e.target.closest("g[data-id]"); if (g && !g.contains(e.relatedTarget)) setHover(null); });
addEventListener("resize", () => { if (pen && mobile()) setPen(pen); drawInk(); });

// ---------- share: the paper's link (for others once `arx share on` ran) and the paper as one file ----------
async function paperLink(hash = "") {
  let u = location.origin + location.pathname, shared = false;
  try { const d = await (await fetch(`${BASE}/api/share`, { cache: "no-store" })).json();
    if (d.link) { const x = new URL(d.link); x.pathname += "papers/" + encodeURIComponent(NAME); u = x.href; shared = true; } } catch {}
  return { url: u + hash, shared };
}
// copy, with a fallback where the clipboard API is missing (plain http on another machine) or refused
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = h("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch {} ta.remove();
  if (!ok) prompt("Copy", text);
  return ok;
}
$("#share").onclick = async e => {
  e.stopPropagation(); $("#shp") && $("#shp").remove();
  const { url, shared } = await paperLink(), m = h("div", "menu shp"); m.id = "shp";
  m.innerHTML = `<div class="shp-u"><b>${shared ? "Anyone on your network" : "Only this machine"}</b><br><code>${esc(url)}</code></div><button data-s="copy">Copy link</button>` +
    (shared ? "" : `<button data-s="on"><code>arx share on</code><span class="shp-x">for others</span></button>`) +
    `<a data-s="dl" href="${BASE}/api/export?paper=${encodeURIComponent(NAME)}" download>Download as one file</a>`;
  document.body.appendChild(m);
  const r = $("#share").getBoundingClientRect(); m.style.top = scrollY + r.bottom + 6 + "px"; m.style.left = Math.max(8, Math.min(r.right - 300, innerWidth - 308)) + "px";
  const copied = (b, t) => async ev => { ev.stopPropagation(); if (await copyText(t)) { const was = b.innerHTML; b.textContent = "Copied"; setTimeout(() => { b.innerHTML = was; }, 1500); } };
  for (const [k, t] of [["copy", url], ["on", "arx share on"]]) { const b = m.querySelector(`[data-s=${k}]`); if (b) b.onclick = copied(b, t); }
  setTimeout(() => addEventListener("click", function off(ev) { if (!m.contains(ev.target)) { m.remove(); removeEventListener("click", off); } }));
};

// ---------- clicks ----------
function hitThread(e) {
  const d = paperDoc(); let node, off;
  if (d.caretPositionFromPoint) { const p = d.caretPositionFromPoint(e.clientX, e.clientY); if (!p) return null; node = p.offsetNode; off = p.offset; }
  else if (d.caretRangeFromPoint) { const r = d.caretRangeFromPoint(e.clientX, e.clientY); if (!r) return null; node = r.startContainer; off = r.startOffset; }
  else return null;
  const hits = visible().filter(t => { const r = ranges.get(t.id); try { return r && r.range && r.range.isPointInRange(node, off) && [...r.range.getClientRects()].some(b => e.clientX >= b.left - 1 && e.clientX <= b.right + 1 && e.clientY >= b.top - 1 && e.clientY <= b.bottom + 1); } catch { return false; } });
  return hits.length ? hits.sort((a, b) => ranges.get(a.id).range.toString().length - ranges.get(b.id).range.toString().length)[0] : null;
}
// a click inside a drawn box opens its comment (the smallest box, when boxes nest); the text under it stays selectable
function boxAt(e) {
  const f = frame.getBoundingClientRect(), x = e.clientX + f.left, y = e.clientY + f.top;
  const hits = [...inkSvg.querySelectorAll("g[data-id]:not(.draft) .v.box")].map(p => [p.closest("g").dataset.id, p.getBoundingClientRect()])
    .filter(([, r]) => x >= r.left && x <= r.right && y >= r.top && y <= r.bottom).sort((a, b) => a[1].width * a[1].height - b[1].width * b[1].height);
  return hits.length ? threads.find(t => t.id === hits[0][0]) : null;
}
function onPaperClick(e) {
  const a = e.target.closest && e.target.closest("a[href]");
  if (a) { // links inside the paper: in-page jumps scroll this page; anything else opens a new tab
    const href = a.getAttribute("href");
    if (href.startsWith("#")) { e.preventDefault(); jumpTo(decodeURIComponent(href.slice(1))); return; }
    if (!a.target) { e.preventDefault(); open(a.href, "_blank", "noopener"); return; }
  }
  const s = paperDoc().getSelection(); if (s && !s.isCollapsed) return;
  const t = hitThread(e) || boxAt(e);
  if (t) setActive(t.id, { scroll: false });
  else if (active && !e.target.closest("button,input,select,textarea,label,a")) setActive(null);
}
function onCardClick(e, id) {
  const b = e.target.closest("[data-act]"), a = e.target.closest("a[data-link]");
  if (a) { follow(a.dataset.link, e, a.querySelector("b").textContent); return; }
  if (!b) { if (active !== id) setActive(id, { scroll: "if-needed" }); return; }
  e.stopPropagation();
  const act = b.dataset.act, t = threads.find(x => x.id === id);
  if (act === "send") sendReply(id);
  else if (act === "cancel") { const ta = cards.get(id).querySelector("textarea"); ta.value = ""; drafts[id] = ""; saveDrafts(); grow(ta); cards.get(id).querySelector(".reply").classList.remove("typing"); ta.blur(); layout(); }
  else if (act === "resolve") { needName() && api("resolve", { parent: id }).then(() => { setActive(null); refresh(); }); }
  else if (act === "ask") { needName() && api("reply", { parent: id, body: "@agent" }).then(refresh); }
  else if (act === "reopen") { needName() && api("reopen", { parent: id }).then(refresh); }
  else if (act === "menu") menu(b, id, b.dataset.mid, b.dataset.mine === "1", t);
}
function needName() { if (me) return true; $("#me").click(); return !!me; }
async function sendReply(id) {
  const c = cards.get(id), ta = c.querySelector("textarea"); if (!ta.value.trim() || !needName()) return;
  const btn = c.querySelector("[data-act=send]"); btn.disabled = true;
  if (await api("reply", { parent: id, body: ta.value })) { ta.value = ""; drafts[id] = ""; saveDrafts(); grow(ta); c.querySelector(".reply").classList.remove("typing"); await refresh(); }
  btn.disabled = !ta.value.trim();
}
function menu(btn, tid, mid, mine, t) {
  closeMenu();
  const m = h("div", "menu"); m.id = "menu";
  const items = [["Copy link to comment", async () => { if (await copyText((await paperLink("#c-" + tid)).url)) toast("Link copied"); }]];
  if (mine) items.unshift(["Edit", () => editMsg(tid, mid)], ["Delete", async () => { await api("delete", { target: mid }); refresh(); }, "danger", "Delete for good?"]);
  for (const [label, fn, cls, sure] of items) { const b = h("button", cls || "", esc(label));
    b.onclick = e => { e.stopPropagation(); if (sure && !b.dataset.sure) { b.dataset.sure = 1; b.textContent = sure; return; } closeMenu(); fn(); }; m.appendChild(b); }
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(); m.style.top = scrollY + r.bottom + 4 + "px"; m.style.left = Math.max(8, Math.min(r.right - 170, innerWidth - 178)) + "px";
  setTimeout(() => addEventListener("click", closeMenu, { once: true }));
}
function closeMenu() { const m = $("#menu"); m && m.remove(); }
function editMsg(tid, mid) {
  const c = cards.get(tid), el = c.querySelector(`.msg[data-mid="${mid}"] .body`), t = threads.find(x => x.id === tid), m = t.messages.find(x => x.id === mid);
  c._sig = "editing";
  el.innerHTML = `<textarea class="ta"></textarea><div class="row"><button class="btn sm ghost" data-e="x">Cancel</button><button class="btn sm primary" data-e="ok">Save</button></div>`;
  const ta = el.querySelector("textarea"); ta.value = m.body; grow(ta); ta.focus();
  const done = async ok => { if (ok && ta.value.trim() && ta.value !== m.body) await api("edit", { target: mid, body: ta.value }); c._sig = null; refresh(); };
  el.querySelector("[data-e=x]").onclick = e => { e.stopPropagation(); done(false); };
  el.querySelector("[data-e=ok]").onclick = e => { e.stopPropagation(); done(true); };
  ta.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) done(true); if (e.key === "Escape") done(false); };
  ta.onclick = e => e.stopPropagation();
  layout();
}

// ---------- focus and navigation ----------
function setActive(id, { scroll } = {}) {
  if (id && draft) cancelDraft();
  active = id; renderAll();
  const at = id && threads.find(x => x.id === id); at && markSeen(at);
  if (mobile()) { col.classList.toggle("open", !!id); col.classList.remove("all"); $("#sheetT").textContent = "Comment"; }
  if (id && scroll) scrollToThread(id, scroll === "if-needed");
  if (id) history.replaceState(null, "", "#c-" + id); else if (location.hash.startsWith("#c-")) history.replaceState(null, "", location.pathname);
}
function scrollToThread(id, ifNeeded) {
  const t = threads.find(x => x.id === id); if (!t) return;
  const y = topOf(t) + page.getBoundingClientRect().top + scrollY, vh = innerHeight;
  if (ifNeeded && y > scrollY + 80 && y < scrollY + vh - 120) return;
  scrollTo({ top: Math.max(0, y - vh * (mobile() ? .2 : .3)), behavior: "smooth" });
}
function step(dir) {
  const v = ordered(); if (!v.length) return;
  let i = v.findIndex(t => t.id === active);
  i = i < 0 ? (dir > 0 ? 0 : v.length - 1) : (i + dir + v.length) % v.length;
  setActive(v[i].id, { scroll: true });
}
$("#prev").onclick = () => step(-1); $("#next").onclick = () => { if (mobile() && !active) { col.classList.add("open", "all"); $("#sheetT").textContent = "Comments"; renderAll(); return; } step(1); };
$("#sheetX").onclick = () => { col.classList.remove("open", "all"); if (active) setActive(null); cancelDraft(); };
const toggleRes = () => { showResolved = !showResolved; store.set("arx-show-resolved", showResolved ? "1" : "0"); renderAll(); };
$("#showRes").onclick = toggleRes; $("#showRes").onkeydown = e => (e.key === " " || e.key === "Enter") && (e.preventDefault(), toggleRes());
// keys.js gives the reader its Vim keys (j k through the comments, n N, f, g + a page, ?); the tools keep B A D H, and P
// stays the paper's own (explain-kit pause)
window.ARXK && ["b", "a", "d", "h", "p"].forEach(ARXK.reserve);
function onKey(e) {
  const typing = e.target.closest && e.target.closest("input,textarea,[contenteditable]");
  const k = { b: "box", a: "arrow", d: "pen", h: "highlight" }[e.key];
  if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey && k && !mobile()) { e.preventDefault(); setPen(k); return; }  // below 900 px the tools are hidden: no drawing
  if (e.key === "Escape" && pen) { setPen(pen); return; }
  if ((e.metaKey || e.ctrlKey) && e.altKey && (e.key === "m" || e.code === "KeyM")) { e.preventDefault(); startDraft(); }
  if (e.key === "Escape") { if (draft) cancelDraft(); else if (active) setActive(null); }
}
addEventListener("keydown", e => { if (!$("#ov").classList.contains("show")) onKey(e); else if (e.key === "Escape") closePreview(); });
document.addEventListener("click", e => { if (active && !e.target.closest(".card,.menu,.bar,.ov,.toast,.ink") && !mobile()) setActive(null); });

function jumpTo(target) {
  if (target.startsWith("c-")) { const id = target.slice(2); if (threads.find(t => t.id === id)) { if (threads.find(t => t.id === id).resolved && !showResolved) toggleRes(); setActive(id, { scroll: true }); } return; }
  const d = paperDoc(); if (!d) return;
  const el = [...d.querySelectorAll("[data-block]")].find(x => x.dataset.block === target) || d.getElementById(target);
  if (!el) { toast(`Section “${target}” is not in this version of the paper`); return; }
  const y = frame.getBoundingClientRect().top + scrollY + el.getBoundingClientRect().top;
  scrollTo({ top: Math.max(0, y - 120), behavior: "smooth" });
  el.classList.remove("arx-flash"); void el.offsetWidth; el.classList.add("arx-flash");
  setTimeout(() => el.classList.remove("arx-flash"), 1900);
  if (mobile()) col.classList.remove("open");
}
addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1)); if (h) jumpTo(h); });

// ---------- previews of attached pages ----------
function preview(url, title) { $("#ovT").textContent = title; $("#ovOpen").href = url; const F = $("#ovF"); F.style.visibility = "hidden"; F.onload = () => { F.style.visibility = ""; }; F.src = url; $("#ov").classList.add("show"); }
function closePreview() { $("#ov").classList.remove("show"); $("#ovF").src = "about:blank"; }
$("#ovX").onclick = closePreview; $("#ov").onclick = e => e.target === $("#ov") && closePreview();

// ---------- server ----------
async function api(kind, body) {
  try {
    const r = await fetch(`${BASE}/api/paper/${encodeURIComponent(NAME)}/${kind}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, author: me, by: myId() || undefined }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    return await r.json();
  } catch (err) { toast("Could not save: " + err.message); return null; }
}
let tt;
function toast(text, action) {
  $("#toastT").textContent = text; $("#toastB").hidden = !action; $("#toastB").onclick = () => { action && action(); $("#toast").classList.remove("show"); };
  $("#toast").classList.add("show"); clearTimeout(tt); tt = setTimeout(() => $("#toast").classList.remove("show"), action ? 7000 : 3500);
}
const blockTexts = d => Object.fromEntries([...d.querySelectorAll("[data-block]")].map(e => [e.dataset.block, e.textContent.replace(/\s+/g, " ").trim()]));

// A new version of the paper: load it hidden, then swap, keeping the reader's place, open threads and drafts.
// Compare the source, not the live DOM: widgets that shuffle or fill text on load would show as "changed".
const srcCache = {};
const srcTexts = v => srcCache[v] || (srcCache[v] = fetch(`${BASE}/papers/${encodeURIComponent(NAME)}/raw?v=${v}`).then(r => r.text())
  .then(t => blockTexts(new DOMParser().parseFromString(t, "text/html"))));
async function swapPaper(v, prev) {
  const old = frame, od = paperDoc(), before = srcCache[prev] ? await srcCache[prev] : blockTexts(od);  // cached when prev loaded: raw always serves the newest
  const keep = [...od.querySelectorAll("[data-block]")].map(e => [e.dataset.block, e.getBoundingClientRect().top + frame.getBoundingClientRect().top])
    .find(([, y]) => y > 56) || null;
  const f = await loadPaper(v);
  await new Promise(r => setTimeout(r, 60));
  fit(f);
  const nd = f.contentDocument, after = await srcTexts(v).catch(() => blockTexts(nd));
  const changed = Object.keys(after).filter(k => before[k] !== after[k]);
  f.className = "ready"; old.remove(); frame = f;
  if (keep) { const el = [...nd.querySelectorAll("[data-block]")].find(x => x.dataset.block === keep[0]);
    if (el) scrollTo({ top: el.getBoundingClientRect().top + frame.getBoundingClientRect().top + scrollY - keep[1], behavior: "instant" }); }
  reanchor(); for (const c of cards.values()) c._sig = null; renderAll();
  const leaves = changed.filter(k => !changed.some(o => o !== k && nd.querySelector(`[data-block="${CSS.escape(o)}"] [data-block="${CSS.escape(k)}"]`) === null && nd.querySelector(`[data-block="${CSS.escape(k)}"] [data-block="${CSS.escape(o)}"]`)));
  for (const k of leaves) { const el = nd.querySelector(`[data-block="${CSS.escape(k)}"]`); el && el.classList.add("arx-changed"); }
  toast(changed.length ? `Paper updated · ${leaves.length} passage${leaves.length === 1 ? "" : "s"} changed` : "Paper updated", leaves.length ? () => jumpTo(leaves[0]) : null);
}

// the paper's title, its goal or hill by title, and where that goal stands in the ledger now: the paper's own text is
// frozen when it was written (it may still say "draft" after the goal was abandoned)
let ctx = null, ctxAt = 0;
const fmtN = x => Number(x).toLocaleString("en-US");
async function loadContext() {
  ctxAt = Date.now();
  try { const r = await fetch(`${BASE}/api/paper-context/${encodeURIComponent(NAME)}`, { cache: "no-store" }); if (!r.ok) return; ctx = await r.json(); } catch { return; }
  const g = ctx.goal, hl = ctx.hill;
  $("#title").textContent = ctx.title; document.title = ctx.title + " · paper";
  $("#hillCrumb").innerHTML = g ? `<a class="crumb ell" href="${BASE}/#goal/${encodeURIComponent(g.name)}" title="${esc(g.title)}">${esc(g.title === ctx.title ? "Goal" : g.title)}</a><span class="sep">/</span>`
    : hl ? `<a class="crumb ell" href="${BASE}/#hill/${encodeURIComponent(hl.name)}" title="${esc(hl.title)}">${esc(hl.title === ctx.title ? "Hill" : hl.title)}</a><span class="sep">/</span>` : "";
  let line = "";
  if (g) {
    const tag = { open: ["warn", "Draft · goal open"], achieved: ["ok", "Goal achieved"], abandoned: ["bad", "Goal abandoned · negative result"], missing: ["", "Goal not in the ledger"] }[g.status] || ["", g.status];
    const bin = g.kpi === "score" && (g.scale || "binary") === "binary" && g.n;
    // anything else in its unit, as the goal page reads it: a "minus ms" score as the plain amount, latency in s
    const neg = g.kpi === "score" && /^\s*minus\b/i.test(g.metric || ""), cmp = (g.higher_is_better !== false) !== neg ? "≥" : "≤";
    const u = g.kpi === "score" ? g.unit || "" : /^latency/.test(g.kpi) ? "s" : /tokens?_per_s|throughput/i.test(g.kpi) ? "tok/s" : "";
    const amt = x => { x = Number(neg ? -x : x); const s = Math.abs(x) >= 100 ? fmtN(Math.round(x)) : String(+x.toPrecision(3)); return g.kpi === "cost" ? "$" + s : s + (u ? " " + u : ""); };
    const val = g.value == null ? "" : bin ? `${fmtN(Math.round(g.value * g.n))} of ${fmtN(g.n)}` : amt(g.value);
    const tgt = g.target == null ? "" : bin ? `${fmtN(Math.ceil(g.target * g.n - 1e-9))} of ${fmtN(g.n)}` : `${cmp} ${amt(g.target)}`;
    const when = g.when ? new Date(g.when * 1000).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
    line = `<span class="tag ${tag[0]}">${esc(tag[1])}</span>` + (g.status === "abandoned"
      ? `<span class="why">${when ? esc(when) + (g.reason ? ": " : "") : ""}${esc(g.reason || "")}</span>`
      : `<span class="why">${g.label ? `<b>${esc(g.label)}</b> ` : ""}${val ? esc(val) : "no run"}${tgt ? ` · target ${esc(tgt)}` : ""}${g.slice ? ` on ${esc(g.slice)}` : ""}${when && g.status === "achieved" ? ` · ${esc(when)}` : ""}</span>`);
  } else if (hl) {
    line = `<span class="tag ${hl.status === "climbed" ? "ok" : hl.status === "open" ? "warn" : ""}">Internal note · hill ${esc(hl.status)}</span>${ctx.champion ? `<span class="why">champion now <b>${esc(ctx.champion.label)}</b></span>` : ""}`;
  }
  $("#ledger").innerHTML = line; $("#ledger").hidden = !line;
}

let busy = false, fails = 0;
async function refresh() {
  if (busy) return; busy = true;
  try {
    const r = await fetch(`${BASE}/api/paper/${encodeURIComponent(NAME)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(); fails = 0; $("#live").className = "live"; $("#live").title = "Live";
    meta = d.meta || {};
    if (!ctx) { $("#title").textContent = document.title = meta.title || NAME; }
    if (!ctx || Date.now() - ctxAt > 15000) loadContext();
    if (version === null) { version = d.version; srcTexts(version).catch(() => {}); frame = await loadPaper(version); }
    else if (d.version !== version) { const prev = version; version = d.version; await swapPaper(version, prev); }
    threads = d.threads;
    if (active && !threads.find(t => t.id === active)) { active = null; if (location.hash.startsWith("#c-")) history.replaceState(null, "", location.pathname); }
    reanchor(); renderAll();
  } catch (err) { if (++fails > 2) { $("#live").className = "live off"; $("#live").title = "Offline: retrying"; } }
  finally { busy = false; }
}
(async () => {
  await refresh();
  const h0 = decodeURIComponent(location.hash.slice(1));
  if (h0) setTimeout(() => jumpTo(h0), 150);
  setInterval(refresh, 1500);
  if (PX) { PX.on(() => { me = PX.me().name; paintMe(); renderAll(); }); PX.start(BASE + "/api/people", () => "papers/" + NAME); }
  document.fonts && document.fonts.ready.then(layout);
})();
})();
</script>
