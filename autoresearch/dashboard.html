<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Observatory</title>
<style>
:root{--bg:#f5f5f1;--card:#fff;--ink:#202a32;--muted:#7d858c;--border:#e5e8e7;--soft:#f0f1ee;--blue:#3d73dd;--green:#299b7d;--amber:#c58a37;--purple:#9075cd;--red:#d16c61;--nav:#202d36;--navink:#c9d1d6;--radius:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151b20;--card:#1d252b;--ink:#e6eaed;--muted:#8d979e;--border:#2c363d;--soft:#242d34;--nav:#10161a;--navink:#aab4ba}}
:root[data-theme="dark"]{--bg:#151b20;--card:#1d252b;--ink:#e6eaed;--muted:#8d979e;--border:#2c363d;--soft:#242d34;--nav:#10161a;--navink:#aab4ba}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--nav);color:var(--navink);padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:600;font-size:17px;padding:0 10px 28px}
.brand svg{flex:none}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;margin-bottom:4px;font-size:14.5px}
nav a:hover{background:rgba(255,255,255,.05)}
nav a.on{background:rgba(255,255,255,.09);color:#fff}
nav a .count{margin-left:auto;font-size:12px;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:99px}
nav .foot{margin-top:auto;padding:0 12px;font-size:13px}
nav .foot b{color:#fff;display:block;font-weight:600}
main{padding:36px 40px 80px;max-width:1320px;width:100%;min-width:0}
header.top{display:flex;align-items:center;gap:16px;margin-bottom:26px}
h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:650}
h2{font-size:17px;margin:0;font-weight:620}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.dot.off{background:var(--red)}
.back{color:var(--muted);font-size:13px;display:inline-block;margin:-14px 0 18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;min-width:0}
.card h2{margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card h2 .r{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.section{margin-top:16px}
.tile .k{color:var(--muted);font-size:13px}
.tile .v{font-size:30px;font-weight:650;letter-spacing:-.02em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:7px;background:var(--soft);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.running{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.chip.stalled,.chip.failed,.chip.budget,.chip.fail,.chip.rejected{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.chip.done,.chip.pass,.chip.climbed{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.chip.champion{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.chip.pending,.chip.open,.chip.candidate{background:color-mix(in srgb,var(--purple) 14%,transparent);color:var(--purple)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 2px 12px;color:var(--muted);font-weight:550;font-size:15px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs button small{font-weight:400;margin-left:5px;font-size:12px}
.seg{display:inline-flex;background:var(--soft);padding:4px;border-radius:12px;gap:2px;flex-wrap:wrap;margin-bottom:16px}
.seg button{all:unset;cursor:pointer;padding:6px 13px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:520}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar i.champ{background:var(--amber)}
.pos{color:var(--green)}.neg{color:var(--red)}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.rung{font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.rung.pass{border-color:transparent;background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.rung.fail{border-color:transparent;background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.rung.pending{border-color:var(--purple);color:var(--purple)}
.rung.champion{border-color:transparent;background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.wb{cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.wb:hover{border-color:var(--muted)}
.wb .t{font-weight:600;font-size:15.5px}
.wb .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wb .desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:13px;display:flex;gap:8px;align-items:baseline;min-width:0}
.note .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .when{color:var(--muted);font-size:12px;white-space:nowrap}
.note.warn .msg{color:var(--amber)}.note.error .msg{color:var(--red)}
.kids{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column}
.kid{display:flex;align-items:center;gap:9px;padding:5px 6px;margin:0 -6px;border-radius:8px;color:inherit;text-decoration:none;font-size:13px;min-width:0}
.kid:hover{background:var(--soft)}
.kid .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid .vl{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sd{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.sd.running{background:var(--blue)}.sd.done,.sd.completed{background:var(--green)}.sd.failed,.sd.stalled{background:var(--red)}
.wb .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;gap:10px}
.prog{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:99px}
.wb.stalled .prog i{background:var(--red)}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.kv span{color:var(--muted)}.kv b{font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.empty{color:var(--muted);padding:34px 0;text-align:center}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
svg text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.events{max-height:380px;overflow:auto;font-size:13px}
.ev{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)}
.ev:last-child{border:0}
.ev .when{color:var(--muted);font-variant-numeric:tabular-nums}
.ev.warn .msg{color:var(--amber)}.ev.error .msg{color:var(--red)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{background:var(--soft);padding:14px;border-radius:12px;overflow:auto;font-size:12px;margin:12px 0 0}
.links a{color:var(--blue);margin-right:16px;font-size:13.5px}
.desc{color:var(--muted);margin:6px 0 0;max-width:800px}
.hero{display:flex;gap:24px;align-items:flex-start}
.hero .main{flex:1;min-width:0}
.hero h2{font-size:22px;margin:12px 0 0}
.ci{position:relative;height:22px;min-width:140px}
.ci .axis{position:absolute;left:0;right:0;top:10px;height:1px;background:var(--border)}
.ci .zero{position:absolute;top:3px;width:1px;height:15px;background:var(--muted)}
.ci .thr{position:absolute;top:5px;width:0;height:11px;border-left:1px dashed var(--amber)}
.ci .span{position:absolute;top:7px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--blue) 35%,transparent)}
.ci .pt{position:absolute;top:5px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--blue)}
.ci.pass .pt{background:var(--green)}.ci.fail .pt{background:var(--red)}
.ci.pass .span{background:color-mix(in srgb,var(--green) 30%,transparent)}.ci.fail .span{background:color-mix(in srgb,var(--red) 30%,transparent)}
.matrix td.cell{text-align:center;font-variant-numeric:tabular-nums;border-radius:8px}
.hcard{display:flex;flex-direction:column;gap:10px;transition:border-color .15s}.hcard:hover{border-color:var(--muted)}
.hcard .row,.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hcard .row .sub{margin-left:auto}
.hcard .t{font-weight:620;font-size:16px}
.hcard .sym{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hprog{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.hprog>div{display:grid;grid-template-columns:96px 1fr 54px;gap:10px;align-items:center;font-size:12px}
.hprog span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hprog b{text-align:right;font-variant-numeric:tabular-nums}
.hcard .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:10px;margin-top:auto}
.sbar{position:relative;height:8px;background:var(--soft);border-radius:99px}
.sbar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.sbar.champ i{background:var(--muted)}.sbar.up i{background:var(--green)}.sbar.down i{background:var(--red)}.sbar.warn i{background:var(--amber)}
.sbar b{position:absolute;top:-4px;width:2px;height:16px;margin-left:-1px;background:var(--ink);opacity:.55;border-radius:1px}
.lede{font-size:16px;margin:0 0 18px;max-width:760px}.hrow{margin:-6px 0 12px}
.hgrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.ex{display:flex;flex-direction:column;gap:10px}
.exin{background:var(--soft);border-radius:12px;padding:14px 16px;font-size:14px;overflow-wrap:anywhere}
.exo{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 16px;font-size:14px;overflow-wrap:anywhere}
.exo span{font-weight:700}.exo div{min-width:0}
.exo.bad{background:color-mix(in srgb,var(--red) 12%,transparent)}.exo.bad span{color:var(--red)}
.exo.good{background:color-mix(in srgb,var(--green) 12%,transparent)}.exo.good span{color:var(--green)}
.att{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 90px minmax(0,1fr) 90px;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.att.head{font-size:12px;color:var(--muted);padding-top:0;align-items:end}.att.head .sub{font-size:11.5px}
.att:last-child{border:0}a.att:hover .nm b{color:var(--blue)}.att .nm .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sc{display:flex;flex-direction:column;gap:6px}.frac{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}.frac b{color:var(--ink);font-size:16px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
.exnav{display:flex;gap:4px}.exnav button{all:unset;cursor:pointer;width:24px;height:24px;text-align:center;line-height:24px;border-radius:7px;background:var(--soft);color:var(--muted);font-size:12px}.exnav button.on{background:var(--ink);color:var(--card)}
.ofw{font-size:13px;margin:-4px 0 12px}
.att{grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 90px 100px minmax(0,1fr)}
.pex{border-top:1px solid var(--border);margin-top:8px;padding-top:16px}
.pexh{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}.lg{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.lg i{margin-left:8px}
.prow{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:start;padding:5px 0}
.pl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:14px}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.c{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--soft)}
.c.s1{background:color-mix(in srgb,var(--green) 60%,transparent)}.c.s0{background:color-mix(in srgb,var(--muted) 28%,transparent)}
.c.fx{background:var(--green);box-shadow:0 0 0 1.5px var(--card),0 0 0 3px var(--green)}.c.bk{background:var(--red);box-shadow:0 0 0 1.5px var(--card),0 0 0 3px var(--red)}
.big{font-size:30px;font-weight:650;margin-bottom:10px;font-variant-numeric:tabular-nums}.big small{font-size:15px;color:var(--muted);font-weight:500}
.meas{margin:0 0 12px;font-size:14px}
.att:last-child{border:0}.att:hover .nm b{color:var(--blue)}.att .nm .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .num{text-align:right;font-variant-numeric:tabular-nums}.att .ctl{font-size:13px}
.scroll{overflow-x:auto}
.filters{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
@media (max-width:900px){.app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px 16px;gap:2px}.brand{padding:6px 10px 6px 4px;width:100%}nav .foot{display:none}nav a{padding:8px 10px;font-size:13px}main{padding:22px 16px 60px}.hgrid{grid-template-columns:1fr}.att{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 50px}.att .ctl,.att>div:nth-child(4){display:none}.prow{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}.hero{flex-direction:column}.charts,.cards{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main id="main"><div class="empty">Loading…</div></main>
</div>
<script>
const S={ex:{},state:null,detail:null,ok:true,lbDataset:null,lbSlice:null,archiveKind:'all'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>x==null?'—':(100*x).toFixed(1)+'%';
const pts=x=>x==null?'—':((x>0?'+':'')+(100*x).toFixed(1));
const money=x=>x==null?'—':(x<0.01?'$'+x.toFixed(4):'$'+x.toFixed(3));
const secs=x=>x==null?'—':(x<10?x.toFixed(2):x.toFixed(1))+'s';
const ago=t=>{if(!t)return '—';const d=(S.state?.now||Date.now()/1000)-t;if(d<60)return Math.max(0,Math.round(d))+'s ago';if(d<3600)return Math.round(d/60)+'m ago';if(d<86400)return Math.round(d/3600)+'h ago';return Math.round(d/86400)+'d ago'};
const dur=(a,b)=>{const d=(b||S.state?.now||Date.now()/1000)-a;return d<60?Math.round(d)+'s':d<3600?Math.round(d/60)+'m':(d/3600).toFixed(1)+'h'};
const left=s=>s<60?Math.round(s)+'s':s<3600?Math.round(s/60)+'m':Math.floor(s/3600)+'h '+Math.round(s%3600/60)+'m';
const clock=t=>new Date(t*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const num=(v,p=3)=>v===0?'0':Math.abs(v)>=1000?v.toFixed(0):Math.abs(v)>=1?v.toFixed(p):Math.abs(v)<1e-3?v.toExponential(1):v.toPrecision(p);
const fmtv=v=>typeof v!=='number'?esc(v):num(v);
const short=s=>String(s||'').split('/').slice(1).join('/')||s;
const ICON={
 over:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
 wb:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h10M4 17h6"/><circle cx="18" cy="16" r="3"/></svg>',
 models:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M8.3 7l7.5 4M8.3 17l7.5-4"/></svg>',
 hills:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 19l6-10 4 6 3-4 5 8z"/></svg>',
 slices:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
 archive:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10h14V9M10 13h4"/></svg>'};
const ROUTES=[['overview','Overview','over'],['workbench','Workbench','wb'],['models','Models','models'],['hills','Hills','hills'],['slices','Slices','slices'],['archive','Archive','archive']];

function route(){const h=location.hash.slice(1)||'overview';const [r,...rest]=h.split('/');return {r,arg:decodeURIComponent(rest.join('/'))}}
const active=()=>S.state.tasks.filter(t=>t.status==='running'||t.status==='stalled');
const archived=()=>S.state.tasks.filter(t=>t.status!=='running'&&t.status!=='stalled');
const isLive=t=>t&&(t.status==='running'||t.status==='stalled');
const byId=id=>S.state.tasks.find(t=>t.id===id);
const kids=id=>S.state.tasks.filter(t=>t.parent===id).sort((a,b)=>(isLive(b)-isLive(a))||(b.created-a.created));
// every descendant, depth-first, with its depth; a guard stops cycles from bad parent ids
function tree(id,depth=0,seen=new Set([id])){return kids(id).filter(k=>!seen.has(k.id)&&seen.add(k.id)).flatMap(k=>[[k,depth],...tree(k.id,depth+1,seen)])}

function renderNav(){
 const {r}=route();const st=S.state;
 const navOn={task:active().some(t=>t.id===route().arg)?'workbench':'archive',model:'models',hill:'hills'}[r]||r;
 const counts={workbench:st?active().length:0,hills:st?Object.values(st.hills).filter(h=>h.status==='open').length:0};
 $('#nav').innerHTML=`<div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="1.6"><rect x="1" y="1" width="24" height="24" rx="7" opacity=".5"/><path d="M6 17l4.5-6 3.5 4 6-8"/></svg>Observatory</div>`+
 ROUTES.map(([k,l,i])=>`<a href="#${k}" class="${navOn===k?'on':''}">${ICON[i]}${l}${counts[k]?`<span class="count">${counts[k]}</span>`:''}</a>`).join('')+
 (st?`<div class="foot"><b>${esc(st.config.name)}</b>${Object.keys(st.models).length} models · ${Object.keys(st.hills).length} hills</div>`:'');
}
function topbar(title){return `<header class="top"><h1>${esc(title)}</h1><div class="live"><span class="dot ${S.ok?'':'off'}"></span>${S.ok?clock(S.state.now):'Offline'}</div></header>`}

// ---------- charts
function lineChart(series,{h=180,y0=null,ref=null,pctAxis=false,xLabel='step'}={}){
 // series: [{name,color,pts:[[x,y]...]}]
 const all=series.flatMap(s=>s.pts).filter(p=>p[1]!=null&&isFinite(p[1]));
 if(all.length<1)return '<div class="empty">No points yet</div>';
 const W=520,H=h,L=50,R=12,T=10,B=24;
 let xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);if(ref!=null)ys.push(ref);
 let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+1;
 let lo=y0??Math.min(...ys),hi=Math.max(...ys);if(hi===lo){hi+=Math.abs(hi)*.1||1;lo-=Math.abs(lo)*.1||0}
 const pad=(hi-lo)*.06;if(y0==null)lo-=pad;hi+=pad;
 const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-lo)/(hi-lo))*(H-T-B);
 const ticks=[0,.25,.5,.75,1].map(f=>lo+f*(hi-lo));
 const tl=v=>pctAxis?Math.round(v*100)+'%':num(v,2);
 let g=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${tl(v)}</text>`).join('');
 g+=`<text x="${L}" y="${H-6}">${Math.round(x0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${Math.round(x1)} ${xLabel}</text>`;
 if(ref!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--amber)" stroke-dasharray="4 4"/>`;
 for(const s of series){const p=s.pts.filter(p=>p[1]!=null&&isFinite(p[1]));if(!p.length)continue;
  g+=`<path d="${p.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
  const last=p[p.length-1];g+=`<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3.5" fill="${s.color}"/>`}
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}
function spark(y,color='var(--blue)'){
 if(!y||y.length<2)return '';const W=300,H=36,lo=Math.min(...y),hi=Math.max(...y),r=hi-lo||1;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="36" preserveAspectRatio="none"><path d="${y.map((v,i)=>(i?'L':'M')+(i/(y.length-1)*W).toFixed(1)+' '+(H-3-(v-lo)/r*(H-6)).toFixed(1)).join('')}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function ciBar(c){
 if(c.delta==null)return '';const span=Math.max(.05,Math.abs(c.lo),Math.abs(c.hi),Math.abs(c.threshold||0))*1.15;
 const P=v=>(50+v/span*50).toFixed(1)+'%';
 return `<div class="ci ${c.state}"><div class="axis"></div><div class="zero" style="left:${P(0)}"></div>${c.threshold?`<div class="thr" style="left:${P(c.threshold)}"></div>`:''}<div class="span" style="left:${P(c.lo)};width:calc(${P(c.hi)} - ${P(c.lo)})"></div><div class="pt" style="left:${P(c.delta)}"></div></div>`;
}

// ---------- shared bits
const ladderPills=g=>!g||g.error?'':`<div class="ladder">${g.rungs.map(r=>`<span class="rung ${r.status}">${esc(r.rung)}</span>`).join('')}</div>`;
function fullScore(m){const st=S.state,ds=st.config.primary_dataset;return st.leaderboard[ds+'/full']?.[m]}
function kidRow([k,depth]){
 const pr=k.progress||{},sc=k.summary?.score??k.last?.running_score;
 const v=isLive(k)?[pr.total?`${pr.done}/${pr.total}`:'',sc!=null?pct(sc):'',k.eta?left(k.eta.eta_s):''].filter(Boolean).join(' · ')
  :k.kind==='eval'&&sc!=null?`${pct(sc)} · n ${k.summary?.n??pr.done}`:k.status;
 return `<a class="kid" href="#task/${encodeURIComponent(k.id)}" style="padding-left:${6+depth*16}px"><span class="sd ${k.status}"></span><span class="nm">${esc(k.title)}</span><span class="vl">${esc(v)}</span></a>`;
}
function noteLine(n){return n?`<div class="note ${n.level}"><span class="msg">${esc(n.msg)}</span><span class="when">${ago(n.t)}</span></div>`:''}
function taskCard(t){
 const pr=t.progress||{},f=pr.total?Math.min(1,pr.done/pr.total):null;
 const last=Object.entries(t.last||{}).filter(([k,v])=>typeof v==='number').slice(0,3);
 const sub=tree(t.id),live=sub.filter(([k])=>isLive(k)).length,shown=sub.filter(([k])=>isLive(k)).concat(sub.filter(([k])=>!isLive(k))).slice(0,Math.max(6,live));
 return `<div class="card wb ${t.status}" onclick="if(!event.target.closest('a'))location.hash='task/${encodeURIComponent(t.id)}'">
  <div class="row"><span class="chip ${t.status}">${t.status}</span><span class="chip">${esc(t.kind)}</span>${t.agent?`<span class="chip">${esc(t.agent)}</span>`:''}</div>
  <div class="t">${esc(t.title)}</div>
  ${t.model||t.slice?`<div class="sub">${[t.model,short(t.slice)].filter(Boolean).map(esc).join(' · ')}</div>`:''}
  ${t.description?`<div class="desc">${esc(t.description)}</div>`:''}
  ${noteLine(t.note)}
  ${t.spark?spark(t.spark.y,t.status==='stalled'?'var(--red)':'var(--blue)'):''}
  ${last.length?`<div class="kv">${last.map(([k,v])=>`<div><span>${esc(k)}</span><b>${fmtv(v)}</b></div>`).join('')}</div>`:''}
  ${f!=null?`<div class="prog"><i style="width:${(f*100).toFixed(1)}%"></i></div>`:''}
  ${sub.length?`<div class="kids"><div class="sub" style="margin-bottom:4px">${live} running · ${sub.length} sub-tasks</div>${shown.map(kidRow).join('')}${sub.length>shown.length?`<a class="kid sub" href="#task/${encodeURIComponent(t.id)}">+${sub.length-shown.length} more</a>`:''}</div>`:''}
  <div class="meta"><span>${pr.total?`${pr.done} / ${pr.total}`:''}${t.eta?` · ETA ${left(t.eta.eta_s)}`:''}</span><span>${dur(t.created)}${t.budget_s?' / '+left(t.budget_s):''} · beat ${ago(t.heartbeat)}</span></div></div>`;
}

 h+=`<div class="card section"><h2>Ladder<span class="r">vs ${esc(champ||'—')}</span></h2>${cands.length?`<div class="scroll"><table><tr><th>Model</th><th>Hill</th><th>Rungs</th><th class="num">Next</th></tr>${cands.map(([k,m])=>{const g=st.gates[k]||{};return `<tr class="click" onclick="location.hash='model/${encodeURIComponent(k)}'"><td><b>${esc(k)}</b><div class="sub">${esc(m.change||'')}</div></td><td>${esc(st.hills[m.hill]?.title||m.hill||'—')}</td><td>${ladderPills(g)}</td><td class="num sub">${g.promotable?'<span class="chip pass">promote</span>':g.next?.length?esc(g.next[0].model+' · '+short(g.next[0].slice)):(g.rungs||[]).some(r=>r.status==='fail')?'<span class="chip fail">stopped</span>':''}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No candidates</div>'}</div>`;
 // leaderboard
 if(!S.lbDataset||!st.datasets[S.lbDataset])S.lbDataset=st.config.primary_dataset||ds[0];
 const sl=Object.values(st.slices).filter(s=>s.dataset===S.lbDataset);
 const order={full:0,random:1,control:2,dev:3,synthetic:4};
 sl.sort((a,b)=>(order[a.kind]-order[b.kind])||(b.n-a.n));
 if(!S.lbSlice||!sl.some(s=>s.name===S.lbSlice))S.lbSlice=sl[0]?.name;

 const cs=board.find(([m])=>m===champ)?.[1]?.score;
 h+=`<div class="card section"><div class="tabs">${ds.map(d=>`<button class="${d===S.lbDataset?'on':''}" onclick="S.lbDataset='${esc(d)}';S.lbSlice=null;render()">${esc(st.datasets[d].title||d)}<small>${st.datasets[d].size}</small></button>`).join('')}</div>
  <div class="seg">${sl.map(s=>`<button class="${s.name===S.lbSlice?'on':''}" onclick="S.lbSlice='${esc(s.name)}';render()">${esc(short(s.name))} <span class="sub">${s.n}</span></button>`).join('')}</div>
  ${board.length?`<div class="scroll"><table><tr><th>#</th><th>Model</th><th style="width:34%">Score</th><th class="num">Δ champion</th><th class="num">Errors</th><th class="num">Cost / ex</th><th class="num">p50</th><th class="num">p95</th></tr>
  ${board.map(([m,r],i)=>`<tr class="click" onclick="location.hash='task/${encodeURIComponent(r.task)}'"><td class="sub">${i+1}</td><td><b>${esc(m)}</b> ${m===champ?'<span class="chip champion">champion</span>':''}<div class="sub">${ago(r.ended)}</div></td>
   <td><div style="display:flex;gap:12px;align-items:center"><div class="bar" style="flex:1"><i class="${m===champ?'champ':''}" style="width:${Math.max(0,Math.min(100,(r.score||0)*100))}%"></i></div><b class="num">${pct(r.score)}</b></div></td>
   <td class="num ${cs!=null&&m!==champ?(r.score>cs?'pos':r.score<cs?'neg':''):''}">${cs!=null&&m!==champ?pts(r.score-cs):''}</td><td class="num">${r.errors||0}</td><td class="num">${money(r.cost)}</td><td class="num">${secs(r.latency_p50)}</td><td class="num">${secs(r.latency_p95)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No complete runs on this slice</div>'}</div>`;
 return h;

function vWorkbench(){

function vModel(name){

 const g=st.gates[name],hill=st.hills[m.hill];
 const evs=st.tasks.filter(t=>t.model===name).slice(0,30);
 let h=topbar(name)+`<a class="back" href="#models">← Models</a><div class="card"><div class="hero"><div class="main">
  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip ${m.status}">${m.status}</span>${m.parent?`<span class="chip">from ${esc(m.parent)}</span>`:''}${hill?`<a class="chip" href="#hill/${encodeURIComponent(m.hill)}">${esc(hill.title)}</a>`:''}</div>
  <h2>${esc(m.title||name)}</h2>${m.change?`<p class="desc">${esc(m.change)}</p>`:''}${m.reason?`<p class="desc neg">${esc(m.reason)}</p>`:''}
  ${m.links?`<div class="links" style="margin-top:10px">${Object.entries(m.links).map(([k,v])=>`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)} ↗</a>`).join('')}</div>`:''}</div>${g?ladderPills(g):''}</div></div>`;
 if(g&&!g.error){
  h+=`<div class="card section"><h2>Gate<span class="r">vs ${esc(g.champion||'—')}</span></h2><div class="scroll"><table><tr><th>Rung</th><th>Slice</th><th>Rule</th><th class="num">${esc(name)}</th><th class="num">Champion</th><th class="num">Δ pts</th><th>90% CI</th><th class="num">W / L</th><th>State</th></tr>`;
  for(const r of g.rungs){
   if(!r.checks.length){h+=`<tr><td><span class="rung ${r.status}">${esc(r.rung)}</span></td><td colspan="8" class="sub">${r.status}</td></tr>`;continue}
   r.checks.forEach((c,i)=>{h+=`<tr ${c.cand_task?`class="click" onclick="location.hash='task/${encodeURIComponent(c.cand_task)}'"`:''}><td>${i?'':`<span class="rung ${r.status}">${esc(r.rung)}</span>`}</td><td style="white-space:nowrap">${esc(short(c.slice))}<div class="sub">n ${c.n??st.slices[c.slice]?.n??''}${c.cand_runs>1||c.base_runs>1?` · runs ${c.cand_runs}/${c.base_runs}`:''}</div></td><td class="sub" style="white-space:nowrap">${c.rule==='better'?'better':'≥ '+pts(c.threshold)}</td><td class="num">${pct(c.cand)}</td><td class="num">${pct(c.base)}</td><td class="num ${c.delta>0?'pos':c.delta<0?'neg':''}">${pts(c.delta)}</td><td>${ciBar(c)}</td><td class="num">${c.wins!=null?c.wins+' / '+c.losses:''}</td><td><span class="chip ${c.state}">${c.state.replace('_',' ')}</span>${c.noisy?' <span class="chip">noisy</span>':''}</td></tr>`});

 }
 h+=`<div class="card section"><h2>Tasks</h2>${evs.length?`<table>${evs.map(t=>`<tr class="click" onclick="location.hash='task/${encodeURIComponent(t.id)}'"><td><b>${esc(t.title)}</b><div class="sub">${esc(t.kind)} · ${ago(t.updated)}</div></td><td><span class="chip ${t.status}">${t.status}</span></td><td class="num">${t.summary?.score!=null?pct(t.summary.score):''}</td></tr>`).join('')}</table>`:'<div class="empty">None</div>'}</div>`;
 return h;
}
// hills: small clickable cards; each hill's page explains it with its example, share and runs
const firstLine=t=>String(t||'').split(/(?<=\.)\s/)[0];
const frac=r=>r?`${Math.round(r.score*r.n)} / ${r.n}`:'—';
function hillRuns(x){
 const st=S.state,T=st.leaderboard[x.target]||{},C=x.control?st.leaderboard[x.control]||{}:{};
 return Object.entries(T).map(([m,r])=>({m,r,c:C[m]})).sort((a,b)=>b.r.score-a.r.score);
}
function scoreBar(v,mark,cls=''){return `<div class="sbar ${cls}"><i style="width:${(100*(v||0)).toFixed(1)}%"></i>${mark!=null?`<b style="left:${(100*mark).toFixed(1)}%"></b>`:''}</div>`}
function vHills(){
 const st=S.state,champ=st.champion,order={open:0,climbed:1};
 const hs=Object.entries(st.hills).sort((a,b)=>(order[a[1].status]??2)-(order[b[1].status]??2)||b[1].created-a[1].created);
 if(!hs.length)return topbar('Hills')+'<div class="card empty">No hills</div>';
 return topbar('Hills')+`<div class="cards hills">${hs.map(([k,x])=>{
  const runs=hillRuns(x),now=runs.find(o=>o.m===champ),best=runs.find(o=>o.m!==champ),tsl=st.slices[x.target];
  return `<a class="card hcard" href="#hill/${encodeURIComponent(k)}">
   <div class="row"><span class="chip ${x.status}">${x.status}</span>${x.share?`<span class="sub">${pct(x.share.count/x.share.of)} of failures</span>`:''}</div>
   <div class="t">${esc(x.title)}</div>

   <div class="hprog">
    <div><span>${esc(champ||'champion')}</span>${isBin(tsl)?scoreBar(now?.r.score,null,'champ'):''}<b>${now?(isBin(tsl)?solved(now.r)+' / '+now.r.n:val(now.r.score,tsl)):'—'}</b></div>
    <div><span>${esc(best?.m||'no attempt')}</span>${isBin(tsl)?scoreBar(best?.r.score,now?.r.score):''}<b>${best?(isBin(tsl)?solved(best.r)+' / '+best.r.n:val(best.r.score,tsl)):'—'}</b></div>
   </div>
   <div class="meta"><span>dev set ${esc(short(x.target))} · ${st.slices[x.target]?.n??'—'} examples</span><span>${(n=>n+(n===1?' attempt':' attempts'))(runs.filter(o=>o.m!==champ).length)}</span></div></a>`}).join('')}</div>`;
}
const solved=r=>Math.round(r.score*r.n);
// a slice scores 0/1 per example unless it says otherwise (`scale: continuous`, optional `unit`)
const isBin=sl=>sl?.scale!=='continuous';
const val=(v,sl)=>(Math.abs(v)>=10?v.toFixed(1):num(v,3))+(sl?.unit?' '+sl.unit:'');
function delta(d,n,sl){if(d==null)return '';if(!isBin(sl))return `<span class="${d>0?'pos':d<0?'neg':'sub'}">${d>0?'+':''}${Math.abs(d)>=10?d.toFixed(1):num(d,3)}${sl?.unit?' '+esc(sl.unit):''}</span>`;const k=Math.round(d*n);return `<span class="${k>0?'pos':k<0?'neg':'sub'}">${k>0?'+':''}${k} solved</span>`}
const shown=(r,sl)=>isBin(sl)?`<b>${solved(r)}</b> / ${r.n}`:`<b>${esc(val(r.score,sl))}</b><span class="sub"> mean of ${r.n}</span>`
// the hill's dev set: what it is, who solves how much of it, and which examples each attempt fixed or broke
function flips(a,b,bin=true){let f=0,k=0;for(const id in a){if(!(id in b))continue;const x=bin?a[id]>=.5:a[id],y=bin?b[id]>=.5:b[id];if(x>y)f++;if(x<y)k++}return {f,k}}
function devSet(x,runs,now){
 const st=S.state,champ=st.champion,sl=st.slices[x.target]||{},ctl=x.control?st.slices[x.control]:null;
 const D=S.hill?.key===x._key?S.hill.data:null,T=D?.target,cr=T?.runs?.[champ];
 const nT=sl.n,nC=ctl?.n;
 const bin=isBin(sl),cbin=isBin(ctl);
 const cell=r=>r?`<div class="sc"><div class="frac">${shown(r,sl)}</div>${bin?scoreBar(r.score,null,''):''}</div>`:'<span class="sub">not run</span>';
 let h=`<div class="card section"><h2>Dev set <span class="chip">${esc(short(x.target))}</span><span class="r">${[nT!=null?nT+' examples':'',sl.kind,sl.hash?'#'+String(sl.hash).slice(0,8):''].filter(Boolean).map(esc).join(' · ')}${sl.url?` · <a href="${esc(sl.url)}" target="_blank" rel="noopener" style="color:var(--blue)">data ↗</a>`:''}</span></h2>
  ${sl.description?`<p class="desc" style="margin:-6px 0 10px">${esc(sl.description)}</p>`:''}
  ${x.measure||sl.metric?`<p class="meas">${esc(x.measure||sl.metric)}</p>`:''}`;
 if(!runs.length)return h+'<div class="empty">No runs on this dev set yet</div></div>';
 h+=`<div class="att head"><div>Model</div><div>${bin?'Solved':'Mean score'}</div><div class="num">vs champion</div><div class="num">${bin?'fixed · broke':'better · worse'}</div>${ctl?`<div class="ctl">Control<div class="sub">${esc(short(x.control))} · ${nC??'—'} examples</div></div>`:''}</div>`;
 h+=runs.map(o=>{const me=o.m===champ,d=now&&!me?o.r.score-now.r.score:null,fl=!me&&cr&&T.runs[o.m]?flips(T.runs[o.m],cr,bin):null,cd=now?.c&&o.c&&!me?o.c.score-now.c.score:null;
  return `<a class="att" href="#model/${encodeURIComponent(o.m)}"><div class="nm"><b>${esc(o.m)}</b>${me?' <span class="chip champion">champion</span>':''}${st.models[o.m]?.change?`<div class="sub">${esc(st.models[o.m].change)}</div>`:''}</div>
  <div>${cell(o.r)}</div><div class="num">${me?'':delta(d,o.r.n,sl)}</div>
  <div class="num">${fl?`<span class="pos">+${fl.f}</span> · <span class="neg">−${fl.k}</span>`:''}</div>
  ${ctl?`<div class="ctl">${o.c?`<span class="frac">${shown(o.c,ctl)}</span> ${me?'':delta(cd,o.c.n,ctl)}`:'<span class="sub">not run</span>'}</div>`:''}</a>`}).join('');
 if(T&&T.ids.length){
  const ms=runs.map(o=>o.m).filter(m=>T.runs[m]);
  const ok1=(m,id)=>bin?T.runs[m][id]>=.5:(cr&&id in cr?T.runs[m][id]>cr[id]:false);
  const ids=[...T.ids].sort((a,b)=>ms.filter(m=>ok1(m,a)).length-ms.filter(m=>ok1(m,b)).length);
  h+=`<div class="pex"><div class="pexh"><b>Per example</b><span class="lg">${bin?'<i class="c s1"></i>solved<i class="c s0"></i>wrong<i class="c s1 fx"></i>fixed<i class="c s0 bk"></i>broke':'<i class="c s1 fx"></i>better than champion<i class="c s0"></i>same<i class="c s0 bk"></i>worse'}</span></div>
  ${ms.map(m=>{const r=T.runs[m],me=m===champ;return `<div class="prow"><div class="pl">${esc(m)}</div><div class="cells">${ids.map(id=>{const v=r[id];if(v==null)return `<i class="c na" title="${esc(id)} · not run"></i>`;const ok=bin?v>=.5:false,c=!me&&cr&&id in cr?(bin?(ok&&cr[id]<.5?' fx':!ok&&cr[id]>=.5?' bk':''):(v>cr[id]?' fx':v<cr[id]?' bk':'')):'';return `<i class="c ${ok?'s1':'s0'}${c}" title="${esc(id)} · ${num(v,2)}${sl.unit?' '+esc(sl.unit):''}"></i>`}).join('')}</div></div>`}).join('')}</div>`;
 }
 return h+'</div>';
}
function vHill(key){
 const st=S.state,champ=st.champion,x=st.hills[key]&&{...st.hills[key],_key:key};if(!x)return topbar('Not found');
 const runs=hillRuns(x),now=runs.find(o=>o.m===champ);
 const exs=x.examples||(x.example?[x.example]:[]),i=Math.min(S.ex?.[key]||0,Math.max(0,exs.length-1)),ex=exs[i]||{};
 const nT=st.slices[x.target]?.n,nC=x.control?st.slices[x.control]?.n:null;
 const cell=(r,base,n,mark)=>r?`<div class="sc"><div class="frac"><b>${solved(r)}</b> / ${r.n}</div>${scoreBar(r.score,mark,'')}</div>`:'<span class="sub">not run</span>';
 let h=topbar(x.title)+`<a class="back" href="#hills">← Hills</a>
 <div class="hrow"><span class="chip ${x.status}">${x.status}</span>${x.climbed_by?`<a class="chip pass" href="#model/${encodeURIComponent(x.climbed_by)}">climbed by ${esc(x.climbed_by)}</a>`:''}</div>
 ${x.symptom?`<p class="lede">${esc(x.symptom)}</p>`:''}
 <div class="grid ${x.share?'hgrid':''}">
  <div class="card"><h2>Examples${exs.length>1?`<span class="r exnav">${exs.map((_,j)=>`<button class="${j===i?'on':''}" onclick="S.ex={...S.ex,['${esc(key)}']:${j}};render()">${j+1}</button>`).join('')}</span>`:''}</h2>
   ${ex.input||ex.wrong?`<div class="ex">
    ${ex.input?`<div class="exin"><div class="lbl">Question</div>${esc(ex.input)}</div>`:''}
    ${ex.wrong?`<div class="exo bad"><span>✗</span><div><div class="lbl">Model answered</div>${esc(ex.wrong)}</div></div>`:''}
    ${ex.right?`<div class="exo good"><span>✓</span><div><div class="lbl">Correct answer</div>${esc(ex.right)}</div></div>`:''}
    ${ex.why?`<div class="sub">${esc(ex.why)}</div>`:''}</div>`:'<div class="empty">No example</div>'}</div>
  ${x.share?`<div class="card"><h2>How common</h2><div class="big">${x.share.count}<small> of ${x.share.of}</small></div>
   <div class="ofw">${esc(x.share.of_what||'analysed failures')}</div>${scoreBar(x.share.count/x.share.of,null,'warn')}
   <div class="sub" style="margin-top:8px">${pct(x.share.count/x.share.of)} fall into this hill</div></div>`:''}
 </div>
 ${devSet(x,runs,now)}
 ${x.problem||x.found_in?`<div class="card section"><details><summary>Pre-declared expectations</summary>${x.problem?`<p class="desc">${esc(x.problem)}</p>`:''}${x.found_in?`<p class="sub">Found in ${esc(x.found_in)}</p>`:''}</details></div>`:''}`;
 return h;
}
function vSlices(){
 const st=S.state;
 return topbar('Slices')+Object.entries(st.datasets).map(([d,x])=>`<div class="card section"><h2>${esc(x.title||d)}<span class="r">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:var(--blue)">dataset ↗</a>`:''}</span></h2><div class="scroll"><table><tr><th>Slice</th><th>Kind</th><th class="num">n</th><th>Hash</th><th>Score means</th><th>Hill</th><th></th></tr>${Object.values(st.slices).filter(s=>s.dataset===d).map(s=>`<tr><td><b>${esc(short(s.name))}</b>${s.description?`<div class="sub">${esc(s.description)}</div>`:''}</td><td><span class="chip">${esc(s.kind)}</span></td><td class="num">${s.n}</td><td class="sub"><code>${esc(s.hash)}</code>${s.seed!=null?' · seed '+s.seed:''}</td><td class="sub">${esc(s.metric||'')}</td><td>${esc(st.hills[s.hill]?.title||'')}</td><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--blue)">↗</a>`:''}</td></tr>`).join('')}</table></div></div>`).join('');
}
function vTask(id){
 const st=S.state,d=S.detail;
 const t=(d&&d.task.id===id)?d.task:st.tasks.find(x=>x.id===id);
 if(!t)return topbar('Not found');
 const isActive=t.status==='running'||t.status==='stalled';
 const pr=t.progress||{},sm=t.summary||{};
 let h=topbar(t.title)+`<a class="back" href="#${isActive?'workbench':'archive'}">← ${isActive?'Workbench':'Archive'}</a>`;
 h+=`<div class="card"><div class="hero"><div class="main"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip ${t.status}">${t.status}</span><span class="chip">${esc(t.kind)}</span>${t.model?`<a class="chip" href="#model/${encodeURIComponent(t.model)}">${esc(t.model)}</a>`:''}${t.slice?`<span class="chip">${esc(short(t.slice))} · ${st.slices[t.slice]?.n??''}</span>`:''}${t.agent?`<span class="chip">${esc(t.agent)}</span>`:''}${t.kind==='eval'&&t.status==='done'&&!t.complete?'<span class="chip fail">partial · not ranked</span>':''}</div>
  ${t.description?`<p class="desc" style="margin-top:12px">${esc(t.description)}</p>`:''}
  ${Object.keys(t.links||{}).length?`<div class="links" style="margin-top:12px">${Object.entries(t.links).map(([k,v])=>`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)} ↗</a>`).join('')}</div>`:''}</div>
  ${pr.total?ring(pr.done,pr.total):''}</div></div>`;
 const up=byId(t.parent),sub=tree(t.id);
 if(up||sub.length)h+=`<div class="card section"><h2>${sub.length?'Sub-tasks':'Part of'}<span class="r">${sub.length?sub.filter(([k])=>isLive(k)).length+' running · '+sub.length:''}</span></h2>${up?`<a class="kid" href="#task/${encodeURIComponent(up.id)}"><span class="sd ${up.status}"></span><span class="nm">↑ ${esc(up.title)}</span><span class="vl">${esc(up.status)}</span></a>`:''}<div class="kids" style="${up?'':'border:0;padding:0'}">${sub.map(kidRow).join('')}</div></div>`;
 // tiles
 const last=Object.entries(t.last||{}).filter(([k,v])=>typeof v==='number');
 const tiles=t.kind==='eval'?[['Score',pct(sm.score??t.last?.running_score),sm.n?`${Math.round((sm.score||0)*sm.n)} / ${sm.n}`:'running'],['Cost / example',money(sm.cost),sm.cost_total!=null?money(sm.cost_total)+' total':''],['Latency p50',secs(sm.latency_p50),'p95 '+secs(sm.latency_p95)],['Errors',sm.errors??'—',sm.missing?sm.missing+' missing':'']]
  :[...last.slice(0,3).map(([k,v])=>[k,fmtv(v),'latest']),['Elapsed',dur(t.created,t.ended),'beat '+ago(t.heartbeat)]];
 if(t.eta)tiles.splice(tiles.length-1,1,['ETA',left(t.eta.eta_s),`${t.eta.per_min.toFixed(1)}/min · ~${clock(t.eta.finish_at)} · ${dur(t.created)} in`]);
 h+=`<div class="grid g4 section">${tiles.map(([k,v,s])=>`<div class="card tile"><div class="k">${esc(k)}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join('')}</div>`;
 if(!d||d.task.id!==id)return h+'<div class="empty">Loading…</div>';
 // vs champion
 const vc=d.vs_champion;
 if(vc&&vc.delta!=null)h+=`<div class="card section"><h2>vs ${esc(vc.model)}<span class="r">same ${vc.n} ids</span></h2><div class="grid g4"><div class="tile"><div class="k">Δ</div><div class="v ${vc.delta>0?'pos':vc.delta<0?'neg':''}">${pts(vc.delta)}</div><div class="s">pts</div></div><div class="tile"><div class="k">90% CI</div><div class="v" style="font-size:20px">${pts(vc.lo)} … ${pts(vc.hi)}</div><div style="margin-top:6px">${ciBar({...vc,state:vc.lo>0?'pass':vc.hi<0?'fail':''})}</div></div><div class="tile"><div class="k">Wins / losses</div><div class="v">${vc.wins} / ${vc.losses}</div></div><div class="tile"><div class="k">Champion</div><div class="v">${pct(vc.base)}</div><div class="s"><a href="#task/${encodeURIComponent(vc.task)}" style="color:var(--blue)">run ↗</a></div></div></div></div>`;
 // charts: every numeric series
 const keys=[...new Set(d.metrics.flatMap(m=>Object.keys(m).filter(k=>k!=='t'&&k!=='step'&&typeof m[k]==='number')))];
 const palette=['var(--blue)','var(--green)','var(--purple)','var(--amber)','var(--red)'];
 if(keys.length){
  const champBase=vc?.base??null;
  h+=`<div class="charts section">${keys.map((k,i)=>`<div class="card"><h2>${esc(k)}<span class="r">${fmtv(d.metrics.filter(m=>typeof m[k]==='number').slice(-1)[0]?.[k])}</span></h2>${lineChart([{name:k,color:palette[i%palette.length],pts:d.metrics.filter(m=>typeof m[k]==='number').map(m=>[m.step,m[k]])}],{pctAxis:k.includes('score')||k.includes('acc'),ref:k==='running_score'?champBase:null,xLabel:t.kind==='eval'?'examples':'step'})}</div>`).join('')}</div>`;
 }
 // per-example strip for evals
 if(d.rows?.length){
  const rows=d.rows.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  h+=`<div class="card section"><h2>Examples<span class="r">${rows.length}</span></h2><div style="display:flex;flex-wrap:wrap;gap:3px">${rows.map(r=>`<span title="${esc(r.id)} · ${r.error?'error':fmtv(r.score)}" style="width:12px;height:12px;border-radius:3px;background:${r.error?'var(--red)':`color-mix(in srgb,var(--green) ${Math.round(15+85*(r.score||0))}%,var(--soft))`}"></span>`).join('')}</div></div>`;
 }
 h+=`<div class="grid g2 section"><div class="card"><h2>Log<span class="r">${d.events.length}</span></h2>${d.events.length?`<div class="events">${d.events.slice().reverse().map(e=>`<div class="ev ${e.level}"><span class="when">${clock(e.t)}</span><span class="msg">${esc(e.msg)}</span></div>`).join('')}</div>`:'<div class="empty">No notes</div>'}</div>
 <div class="card"><h2>Setup</h2><div class="kv" style="flex-direction:column;gap:6px"><div><span>id</span><b>${esc(t.id)}</b></div><div><span>started</span><b>${new Date(t.created*1000).toLocaleString()}</b></div>${t.ended?`<div><span>ended</span><b>${new Date(t.ended*1000).toLocaleString()}</b></div>`:''}<div><span>host</span><b>${esc(t.host||'')} · pid ${esc(t.pid||'')}</b></div>${t.slice_hash?`<div><span>slice hash</span><b>${esc(t.slice_hash)}</b></div>`:''}</div>
 <details style="margin-top:14px"><summary>Config and command</summary><pre>${esc(t.command||'')}\n\n${esc(JSON.stringify(t.config||{},null,2))}</pre></details></div></div>`;
 return h;
}
function ring(done,total){const f=Math.min(1,done/total),r=52,c=2*Math.PI*r;return `<svg width="130" height="130" viewBox="0 0 130 130" style="flex:none"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--soft)" stroke-width="11"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--green)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 65 65)"/><text x="65" y="66" text-anchor="middle" style="font-size:26px;font-weight:650;fill:var(--ink)">${done}</text><text x="65" y="86" text-anchor="middle">/ ${total}</text></svg>`}

function render(){
 if(!S.state)return;renderNav();
 const {r,arg}=route();
 const v={overview:vOverview,workbench:vWorkbench,archive:vArchive,models:vModels,hills:vHills,slices:vSlices}[r];
 const y=scrollY,open=[...document.querySelectorAll('#main details')].map(d=>d.open);
 $('#main').innerHTML=v?v():r==='task'?vTask(arg):r==='model'?vModel(arg):r==='hill'?vHill(arg):vOverview();
 document.querySelectorAll('#main details').forEach((d,i)=>{if(open[i])d.open=true});
 scrollTo(0,y);
}
async function tick(){
 try{
  const s=await fetch('api/state',{cache:'no-store'});S.state=await s.json();S.ok=true;
  const {r,arg}=route();
  if(r==='hill'&&arg){const d=await fetch('api/hill/'+encodeURIComponent(arg),{cache:'no-store'});S.hill=d.ok?{key:arg,data:await d.json()}:null}
  if(r==='task'&&arg){const d=await fetch('api/task/'+encodeURIComponent(arg),{cache:'no-store'});S.detail=d.ok?await d.json():null}
 }catch(e){S.ok=false}
 render();
}
addEventListener('hashchange',()=>{S.detail=null;scrollTo(0,0);tick()});
tick();setInterval(tick,4000);
</script>
</body>
